<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desa Agen</title>
<style>
:root{--panel:rgba(24,22,20,.86);--garis:rgba(255,255,255,.12);--teks:#f3efe6;--teks2:#c9c2b2;--teks3:#9a9384;--emas:#e8b85a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fc5a8;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--teks)}
#dunia{position:fixed;inset:0}
#dunia canvas{display:block}
.panel{position:fixed;background:var(--panel);border:1px solid var(--garis);border-radius:12px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#kiri{left:12px;top:12px;bottom:12px;width:290px;display:flex;flex-direction:column}
#kiri header{padding:12px 14px 8px;border-bottom:1px solid var(--garis)}
#kiri h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
#kiri h1 a{margin-left:auto;font-size:12px;color:var(--teks3);text-decoration:none;font-weight:400}
.ringkas{font-size:12px;color:var(--teks3);margin-top:4px}
#daftar{overflow:auto;padding:6px 8px 10px;flex:1}
.grp{font-size:11px;letter-spacing:.06em;color:var(--teks3);margin:10px 6px 4px;text-transform:uppercase}
.item{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:rgba(255,255,255,.06)}
.item.pilih{border-color:var(--emas);background:rgba(232,184,90,.1)}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.item .wkt{font-size:11.5px;color:var(--teks3);font-variant-numeric:tabular-nums}
.arsip{opacity:.55}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-jalan{background:#5fd39a;box-shadow:0 0 6px #5fd39a}.d-diam{background:#f0b54a}.d-selesai{background:#8b8a84}
.peran{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;flex:none}
.p-Dev{background:#16304f;color:#8cbcf5}.p-QA{background:#2a2552;color:#b3aaf2}.p-Tester{background:#103b30;color:#7fdcbc}.p-Document{background:#47271a;color:#f2a57c}.p-Lain{background:#333;color:#ccc}.p-Lead{background:#4a2a12;color:#ffd77a}
.d-menunggu{background:#7ab8f0}
#kanan{right:12px;top:12px;width:360px;max-height:calc(100% - 24px);overflow:auto;padding:14px 16px;display:none}
#kanan h2{font-size:15px;margin:6px 0 2px}
#kanan .tutup{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--teks3);font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}
.kv span:nth-child(odd){color:var(--teks3)}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--emas);border-radius:4px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:rgba(0,0,0,.3);border:1px solid var(--garis);border-radius:8px;padding:8px;max-height:220px;overflow:auto;color:var(--teks2)}
details summary{cursor:pointer;color:var(--emas);font-size:12.5px;margin-top:8px}
#kontrol{left:314px;bottom:12px;padding:6px;display:flex;gap:6px;align-items:center}
#kontrol button{font:inherit;font-size:12.5px;background:rgba(255,255,255,.08);color:var(--teks);border:1px solid var(--garis);border-radius:7px;padding:5px 10px;cursor:pointer}
#kontrol button:hover{background:rgba(255,255,255,.16)}
#kontrol button.on{border-color:var(--emas);color:var(--emas)}
#kontrol .bantu{font-size:11.5px;color:var(--teks3);padding:0 6px}
/* label di atas kepala */
.lbl{text-align:center;pointer-events:none;white-space:nowrap}
.lbl .isi{transform:translateY(-50%)}  /* CSS2D memusatkan elemen di titik; geser supaya dasar label = di atas kepala */
.lbl .nama{display:inline-flex;gap:5px;align-items:center;background:rgba(20,18,16,.78);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:6px}
.lbl .gel{display:block;margin:0 auto 3px;max-width:220px;white-space:normal;background:#fffaf0;color:#2b2620;font-size:11px;line-height:1.3;padding:4px 7px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lbl .pb{width:70px;height:4px;background:rgba(0,0,0,.35);border-radius:3px;margin:3px auto 0;overflow:hidden}
.lbl .pb i{display:block;height:100%;background:#e8b85a}
.lbl.pilih .nama{outline:2px solid #e8b85a}
.lbl .zz{font-weight:700;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.bangun{background:rgba(60,40,22,.85);color:#ffe9c2;font-size:12px;font-weight:600;padding:3px 9px;border-radius:5px;border:1px solid rgba(255,220,160,.35);pointer-events:none}
.sembunyiLbl .gel,.sembunyiLbl .pb{display:none}
.jauh .lbl:not(.pilih) .gel,.jauh .lbl:not(.pilih) .pb{display:none}  /* zoom jauh: cuma nama, kecuali agen dipilih */
.panel{z-index:10}
@media (max-width:820px){
  #kiri{width:230px;bottom:auto;max-height:44%}
  #kanan{left:12px;right:12px;width:auto;top:auto;bottom:60px;max-height:46%}
  #kontrol{left:12px;right:12px;flex-wrap:wrap}
  #kontrol .bantu{display:none}
}
.tabs{display:flex;gap:6px;margin-top:8px}
.tab{font:inherit;font-size:12.5px;flex:1;padding:5px 8px;border-radius:7px;border:1px solid var(--garis);background:rgba(255,255,255,.05);color:var(--teks2);cursor:pointer}
.tab.on{border-color:var(--emas);color:var(--emas);background:rgba(232,184,90,.1)}
#quest{overflow:auto;padding:6px 8px 10px;flex:1}
.qkontrol{display:flex;gap:6px;align-items:center;margin:4px 0 8px}.qkontrol select{flex:1}
#quest select,#qCari{font:inherit;font-size:12.5px;background:rgba(0,0,0,.3);color:var(--teks);border:1px solid var(--garis);border-radius:7px;padding:5px 7px}
#qCari{width:100%;margin:8px 0 2px}
.qg{padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}.qg:hover{background:rgba(255,255,255,.06)}.qg.pilih{border-color:var(--emas)}
.qgn{display:flex;justify-content:space-between;font-size:12.5px}.qgn span{color:var(--teks3)}
.qbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:4px;gap:1px}.qbar i{display:block}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.qchip{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--garis);background:none;color:var(--teks2);cursor:pointer}.qchip.on{border-color:var(--emas);color:var(--emas)}
.qid{font-size:11.5px;font-weight:700;color:var(--teks2);flex:none;font-variant-numeric:tabular-nums}
.qk{font-size:11.5px;color:var(--teks3);margin-top:8px}.qv{font-size:12.5px;color:var(--teks);white-space:pre-wrap;word-break:break-word}
.qh{padding:7px 0;border-top:1px solid var(--garis)}
.qpill{display:inline-block;font-size:11px;font-weight:700;color:#1a1a1a;padding:1px 8px;border-radius:6px}
.lblSlime{background:rgba(120,20,20,.85);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;pointer-events:none}
.lblSlime{display:none}.dekat .lblSlime,.lblSlime.on{display:block}
#saranHemat button{font:inherit;font-size:12.5px;background:rgba(255,255,255,.1);color:var(--teks);border:1px solid var(--garis);border-radius:7px;padding:4px 10px;cursor:pointer}
#saranHemat button#bSaranYa{border-color:var(--emas);color:var(--emas)}
#galat{z-index:20;position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#7a2020;color:#fff;padding:6px 12px;border-radius:8px;display:none;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="dunia"></div>
<aside id="kiri" class="panel">
  <header><h1>Desa Agen <a href="/">dashboard</a></h1><div class="ringkas" id="ringkas">memuat...</div>
    <div class="tabs"><button class="tab on" data-tab="agen">Agen</button><button class="tab" data-tab="quest">Quest QA</button></div></header>
  <div id="daftar"></div>
  <div id="quest" style="display:none"></div>
</aside>
<aside id="kanan" class="panel"><button class="tutup" aria-label="Tutup">&times;</button><div id="detail"></div></aside>
<div id="kontrol" class="panel">
  <button id="bKiri" title="Putar kiri (Q)">&#8634; Q</button><button id="bKanan" title="Putar kanan (E)">E &#8635;</button>
  <button id="bReset">Reset</button><button id="bLabel" class="on">Gelembung</button><button id="bDemo">Demo</button><button id="bHemat" title="Kualitas grafis. Hemat: 30 fps, tanpa efek, bayangan, rumput &amp; partikel. Normal: bayangan + bloom + tilt-shift. Ultra: + ambient occlusion, bayangan tajam.">Grafis: Normal</button>
  <span class="bantu">Drag geser · Scroll zoom · WASD · klik stickman</span>
</div>
<div id="galat"></div>
<div id="saranHemat" class="panel" style="display:none;left:50%;top:12px;transform:translateX(-50%);padding:8px 12px;font-size:13px;gap:10px;align-items:center">Desa terasa berat di perangkat ini. <button id="bSaranYa">Nyalakan mode hemat</button><button id="bSaranTidak">Nanti</button></div>
<script type="module">
import * as THREE from 'three';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// ═════ KONFIG ═════
const SIMPAN_MENIT = 10;           // agen selesai nongkrong di kedai selama ini, lalu pulang
const POLL_MS = 3000;
const LAJU = 7;                    // stud/dtk berjalan
const SKALA_ORANG = 1.25;          // stickman lebih besar dari skala bangunan supaya terbaca
const WARNA = {Dev:0x3b82d6, QA:0x7c6ae0, Tester:0x22a37a, Document:0xd8743a, Lead:0xb8322a, Lain:0x8d8d8d};
const LEAD_TAHAN = 5;              // dtk: tool sesi utama harus stabil segini sebelum Lead pindah area (biar tak bolak-balik)
const AKTIVITAS = {tempa:'Menempa', panas:'Memanaskan besi', celup:'Mencelup besi', baca:'Membaca', uji:'Latihan tebas',
  teropong:'Meneropong', tulis:'Menulis', tidur:'Tertidur', santai:'Santai di kedai', lapor:'Menyerahkan laporan', jalan:'Berjalan', diam:'Berdiri',
  perintah:'Memberi tugas', menunggu:'Menunggu balasanmu'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur = s => {s=Math.max(0,Math.round(s));const j=Math.floor(s/3600),m=Math.floor(s%3600/60),d=s%60;return j?`${j}j ${m}m`:m?`${m}m ${String(d).padStart(2,'0')}d`:`${d}d`};
const jam = t => new Date(t*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const V = (x,y,z) => new THREE.Vector3(x,y,z);

// ═════ RENDERER, SCENE, KAMERA ═════
const wadah = $('dunia');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08;
wadah.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:1';
document.body.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc5a8);
scene.fog = new THREE.Fog(0x9fc5a8, 290, 470);   // jarak dari kamera (kamera 260 stud dari titik fokus)
const hemi = new THREE.HemisphereLight(0xfff4e0, 0x5b7a52, 1.15); scene.add(hemi);
const matahari = new THREE.DirectionalLight(0xfff0d6, 2.1);
matahari.castShadow = true; matahari.shadow.mapSize.set(2048, 2048);
Object.assign(matahari.shadow.camera, {left:-40, right:40, top:40, bottom:-40, near:1, far:300});
matahari.shadow.bias = -0.0004; matahari.shadow.normalBias = 0.03;
scene.add(matahari, matahari.target);
const ARAH_MATAHARI = V(40, 70, 30).normalize();   // arah DARI tanah KE matahari; diubah siklus siang-malam

const camera = new THREE.OrthographicCamera(-1,1,1,-1,1,800);   // near > 0: dibutuhkan GTAO (kedalaman linear)
const VIEW = 32; // tinggi dunia yg terlihat (stud) pada zoom 1
const kam = {target:V(0,0,10), az:Math.PI/4, azTuju:Math.PI/4, el:0.72, zoom:1, zoomTuju:1, fokus:null};
function aturKamera(){
  const a = innerWidth/innerHeight, h = VIEW/kam.zoom;
  camera.left=-h*a/2; camera.right=h*a/2; camera.top=h/2; camera.bottom=-h/2; camera.updateProjectionMatrix();
  const d = 260;
  camera.position.set(kam.target.x+Math.sin(kam.az)*Math.cos(kam.el)*d, Math.sin(kam.el)*d, kam.target.z+Math.cos(kam.az)*Math.cos(kam.el)*d);
  camera.lookAt(kam.target);
}
// bayangan matahari: frustum ketat mengikuti area yg terlihat kamera, pusat di-snap ke grid texel (tak berkilau saat geser)
const _bx = V(0,0,0), _by = V(0,0,0), _bz = V(0,0,0), _bc = V(0,0,0);
function aturBayangan(){
  const a = innerWidth/innerHeight, h = VIEW/kam.zoom;
  const half = Math.min(110, Math.hypot(h*a, h/Math.sin(kam.el))/2 + 7), sc = matahari.shadow.camera;
  if (Math.abs(sc.right - half) > 0.01){ sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); }
  _bz.copy(ARAH_MATAHARI); _bx.set(0,1,0).cross(_bz).normalize(); _by.copy(_bz).cross(_bx);
  const texel = 2*half / matahari.shadow.mapSize.x, ux = Math.round(kam.target.dot(_bx)/texel)*texel, uy = Math.round(kam.target.dot(_by)/texel)*texel;
  _bc.copy(_bx).multiplyScalar(ux).addScaledVector(_by, uy).addScaledVector(_bz, kam.target.dot(_bz));
  matahari.target.position.copy(_bc); matahari.position.copy(_bc).addScaledVector(ARAH_MATAHARI, 140);
}

// ═════ POST-PROCESSING: AO (Ultra) -> bloom -> tilt-shift -> tone mapping ACES -> color grading ═════
const TILT = horiz => ({
  uniforms: {tDiffuse:{value:null}, d:{value:0.001}, r:{value:0.5}, kuat:{value:1}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float d, r, kuat; varying vec2 vUv;
    void main(){
      float k = kuat * smoothstep(0.14, 0.62, abs(vUv.y - r));   // pita tengah tajam, tepi atas/bawah kabur = efek diorama
      vec2 s = ${horiz ? 'vec2(d, 0.0)' : 'vec2(0.0, d)'} * k;
      vec4 c = texture2D(tDiffuse, vUv) * 0.1633;
      c += (texture2D(tDiffuse, vUv + s) + texture2D(tDiffuse, vUv - s)) * 0.1531;
      c += (texture2D(tDiffuse, vUv + 2.0*s) + texture2D(tDiffuse, vUv - 2.0*s)) * 0.12245;
      c += (texture2D(tDiffuse, vUv + 3.0*s) + texture2D(tDiffuse, vUv - 3.0*s)) * 0.0918;
      c += (texture2D(tDiffuse, vUv + 4.0*s) + texture2D(tDiffuse, vUv - 4.0*s)) * 0.051;
      gl_FragColor = c;
    }`
});
const GRADE = {   // dijalankan SETELAH OutputPass (ruang tampilan sRGB)
  uniforms: {tDiffuse:{value:null}, tint:{value:new THREE.Color(1.03, 1.0, 0.95)}, saturasi:{value:1.02}, kontras:{value:1.04}, vinyet:{value:0.55}, hangat:{value:1}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec3 tint; uniform float saturasi, kontras, vinyet, hangat; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv); vec3 x = c.rgb;
      float l = dot(x, vec3(0.299, 0.587, 0.114));
      x = mix(vec3(l), x, saturasi);
      x = (x - 0.5) * kontras + 0.5;
      x *= tint;
      x += vec3(0.05, 0.02, -0.03) * hangat * smoothstep(0.45, 1.0, l);   // sorot terang sedikit keemasan
      vec2 q = vUv - 0.5; x *= 1.0 - dot(q, q) * vinyet;
      gl_FragColor = vec4(clamp(x, 0.0, 1.0), c.a);
    }`
};
const FX = (() => {
  const rt = new THREE.WebGLRenderTarget(1, 1, {type:THREE.HalfFloatType, samples:4});   // MSAA di dalam composer
  const c = new EffectComposer(renderer, rt);
  c.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, 1, 1);
  // GTAOPass 0.160 salah menulis define kamera (typo) -> set manual utk kamera ortografis
  ao.gtaoMaterial.defines.PERSPECTIVE_CAMERA = 0; ao.gtaoMaterial.needsUpdate = true;
  ao.depthRenderMaterial.defines.PERSPECTIVE_CAMERA = 0; ao.depthRenderMaterial.needsUpdate = true;
  ao.updateGtaoMaterial({radius:0.9, distanceExponent:1.4, thickness:1.2, scale:1, distanceFallOff:1});
  ao.blendIntensity = 0.55; ao.enabled = false; c.addPass(ao);
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.34, 0.55, 1.05); c.addPass(bloom);
  const tiltH = new ShaderPass(TILT(true)), tiltV = new ShaderPass(TILT(false)); c.addPass(tiltH); c.addPass(tiltV);
  c.addPass(new OutputPass());
  const grade = new ShaderPass(GRADE); c.addPass(grade);
  return {c, ao, bloom, tiltH, tiltV, grade};
})();
let rasioPiksel = 1;
function ukuran(){
  renderer.setPixelRatio(rasioPiksel); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight);
  FX.c.setPixelRatio(rasioPiksel); FX.c.setSize(innerWidth, innerHeight);
  FX.bloom.setSize(Math.round(innerWidth*rasioPiksel/2), Math.round(innerHeight*rasioPiksel/2));   // bloom setengah resolusi
  FX.tiltH.uniforms.d.value = 1.5/innerWidth; FX.tiltV.uniforms.d.value = 1.5/innerHeight;
  aturKamera();
}
addEventListener('resize', ukuran);

// ═════ TEKSTUR PROSEDURAL (canvas, tanpa aset eksternal) ═════
const WAKTU = {value: 0};   // uniform waktu bersama utk shader angin, air, awan
function kanvas(n, gambar){ const c = document.createElement('canvas'); c.width = c.height = n; gambar(c.getContext('2d'), n); return c; }
function tekstur(c, srgb = true){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
const rngT = (s => () => (s = (s*16807) % 2147483647) / 2147483647)(777);
// value noise tileable (kisi periodik) -> Float32Array n*n, 0..1
function derau(n, sel, oktaf = 4){
  const out = new Float32Array(n*n); let amp = 1, tot = 0;
  for (let o = 0; o < oktaf; o++){
    const k = sel << o, kisi = Float32Array.from({length:k*k}, rngT);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const fx = x/n*k, fy = y/n*k, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx-x0, ty = fy-y0;
      const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty), g = (i, j) => kisi[((j+k)%k)*k + ((i+k)%k)];
      const v = (g(x0,y0)*(1-sx) + g(x0+1,y0)*sx)*(1-sy) + (g(x0,y0+1)*(1-sx) + g(x0+1,y0+1)*sx)*sy;
      out[y*n+x] += v*amp;
    }
    tot += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot; return out;
}
function lukisDerau(ctx, n, d, warna){   // warna(v, x, y) -> [r,g,b]
  const img = ctx.createImageData(n, n);
  for (let i = 0; i < n*n; i++){ const [r,g,b] = warna(d[i], i%n, Math.floor(i/n)); img.data[i*4] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255; }

// ═════ QUEST QA: papan test case + slime FAIL ═════
// Data dari /api/qa (folder QA di qa.json). Tiap TC = kertas di papan grupnya, warna = status; FAIL terkini = slime.
const WARNA_QA = {'PASS':0x3fae5a, 'FAIL':0xd8403a, 'JANGGAL':0xe8b830, 'BLOCKED':0x8a5ad0, 'TIDAK BISA DIUJI':0x9a9a9a, '-':0xeeeae0};
const NAMA_QA = {'PASS':'PASS', 'FAIL':'FAIL', 'JANGGAL':'JANGGAL', 'BLOCKED':'BLOCKED', 'TIDAK BISA DIUJI':'TBD', '-':'belum'};
const QC = AREA.Quest, KOLOM = 18, PETAK = 0.28, KANAN_Q = V(Math.cos(Math.PI/4), 0, -Math.sin(Math.PI/4));
const QUEST = {data:null, tanda:'', papan:[], slime:[], kertasDari:new Map(), putaran:'kini', katalog:0, pilih:null, filterS:'', filterG:'', cari:''};
const sorot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.32, 0.03), emisif(0xffffff, 2.2)); sorot.visible = false; scene.add(sorot);
const statusTC = t => QUEST.putaran === 'kini' ? (t.kini || '-') : (t.s[QUEST.putaran] || '-');

function hapusQuest(){
  for (const p of QUEST.papan){ scene.remove(p.g); p.lbl.removeFromParent(); p.lbl.element.remove(); }
  for (const s of QUEST.slime){ scene.remove(s.g); s.lbl.removeFromParent(); s.lbl.element.remove(); }
  QUEST.papan = []; QUEST.slime = []; QUEST.kertasDari.clear(); sorot.visible = false;
}
// halaman di depan barisan papan: u = sepanjang kanan-layar, v = maju/mundur ke arah kamera
const halamanQuest = (u, v) => QC.clone().addScaledVector(KANAN_Q, u).addScaledVector(ARAH, 5 + v);
function bangunQuest(){
  hapusQuest();
  const d = QUEST.data; if (!d || !d.grup) return;
  const n = d.grup.length, jarakX = 7.2;
  d.grup.forEach((G, i) => {
    const xs = d.tc.filter(t => t.g === G.nama).sort((a,b) => a.id.localeCompare(b.id));
    const baris = Math.max(1, Math.ceil(xs.length / KOLOM)), W = KOLOM*PETAK + 0.6, H = baris*PETAK + 0.7;
    // jajar sepanjang sumbu kanan-layar kamera bawaan & menghadap kamera -> tampil berdampingan, tak saling timpa
    const u = (i - (n-1)/2) * jarakX, mundur = Math.abs(i - (n-1)/2) * 1.2;
    const g = new THREE.Group(); g.position.copy(QC).addScaledVector(KANAN_Q, u).addScaledVector(ARAH, -2 - mundur);
    g.rotation.y = HADAP - (i - (n-1)/2) * 0.1; scene.add(g);
    for (const sx of [-1,1]) silinder(0.14, 0.17, H+1.5, 0x6b4a2e, sx*(W/2+0.1), (H+1.5)/2, 0, 6, g);
    const papan = kotak(W, H, 0.18, 0x9c7448, 0, 0.9+H/2, 0, g); papan.userData = {papan: G.nama};
    for (const sy of [-1, 1]) kotak(W+0.2, 0.12, 0.24, 0x5a3b22, 0, 0.9+H/2+sy*(H/2+0.04), 0, g);   // bingkai kayu
    for (const sx of [-1, 1]) kotak(0.12, H+0.2, 0.24, 0x5a3b22, sx*(W/2+0.04), 0.9+H/2, 0, g);
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) bola(0.07, 0xd9b44a, sx*(W/2+0.04), 0.9+H/2+sy*(H/2+0.04), 0.13, g);
    kotak(W+0.5, 0.14, 0.7, 0x7a3e22, 0, 1.55+H, 0.1, g).rotation.x = -0.25;
    // kertas TC: 1 InstancedMesh per papan, warna per status; FAIL dilapis kertas menyala (berkedip)
    const kertas = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.24, 0.02), new THREE.MeshStandardMaterial({map:TEX.perkamen, roughness:.9}), xs.length);
    const nyala = xs.filter(t => statusTC(t) === 'FAIL');
    const merah = new THREE.InstancedMesh(new THREE.BoxGeometry(0.23, 0.25, 0.022), emisif(0xff4a3a, 1.2), Math.max(1, nyala.length));
    merah.count = nyala.length;
    const dum = new THREE.Object3D(); let iM = 0;
    xs.forEach((t, k) => {
      const c = k % KOLOM, r = Math.floor(k / KOLOM);

      kertas.setMatrixAt(k, dum.matrix); kertas.setColorAt(k, new THREE.Color(WARNA_QA[statusTC(t)] ?? WARNA_QA['-']));
      QUEST.kertasDari.set(t.id, {g, pos: dum.position.clone(), rot: dum.rotation.z});
      if (statusTC(t) === 'FAIL'){ dum.position.z = 0.122; dum.updateMatrix(); merah.setMatrixAt(iM++, dum.matrix); }
    });
    kertas.userData = {kertas: xs.map(t => t.id)}; kertas.castShadow = true; g.add(kertas); g.add(merah);
    const hit = G.hitung, akhirPass = hit['PASS'] || 0, f = hit['FAIL'] || 0, j = hit['JANGGAL'] || 0;
    const div = document.createElement('div'); div.className = 'bangun papanQ';
    div.innerHTML = `${esc(G.nama)}<br><span style="opacity:.85;font-weight:400">${akhirPass}/${G.total} lulus${f ? ` · <b style="color:#ff8a7a">${f} FAIL</b>` : ''}</span>`; div.style.textAlign = 'center';
    const lbl = new CSS2DObject(div); lbl.position.set(0, 2.2+H, 0); g.add(lbl);
    QUEST.papan.push({g, lbl, nama: G.nama, kertas, merah, papan});
  });
  // slime = FAIL terkini (P1 lebih besar), melompat-lompat di halaman papan
  d.tc.filter(t => (t.kini || '-') === 'FAIL').forEach((t, i) => {
    const s = t.p === 'P1' ? 1.35 : 1, g = new THREE.Group(); scene.add(g);
    const badan = bola(0.5*s, 0xd8403a, 0, 0.42*s, 0, g, 1); badan.scale.set(1, 0.75, 1); badan.material = new THREE.MeshStandardMaterial({color:0xd8403a, flatShading:true, roughness:.35, transparent:true, opacity:.92});
    for (const sx of [-1,1]){ bola(0.1*s, 0xffffff, sx*0.17*s, 0.55*s, 0.36*s, g); bola(0.05*s, 0x1d1b1a, sx*0.17*s, 0.55*s, 0.44*s, g); }
    const alis = kotak(0.42*s, 0.05*s, 0.05, 0x5a1010, 0, 0.72*s, 0.38*s, g); alis.rotation.z = 0.15;
    badan.userData = {tc: t.id}; g.children.forEach(m => m.userData = {tc: t.id});
    const a = i * 2.39996, r = 4 + (i % 5) * 1.5;
    g.position.copy(halamanQuest(Math.cos(a)*r*1.2, Math.sin(a)*3));
    const div = document.createElement('div'); div.className = 'lblSlime'; div.textContent = t.id;
    const lbl = new CSS2DObject(div); lbl.position.set(0, 1.25*s, 0); g.add(lbl);
    QUEST.slime.push({g, badan, s, lbl, id: t.id, tujuan: g.position.clone(), fase: acak()*6, tunggu: acak()*2});
  });
  if (QUEST.pilih) soroti(QUEST.pilih, false);
}
HIDUP.push((t, dt) => {
  for (const p of QUEST.papan) p.merah.material.emissiveIntensity = 0.9 + Math.sin(t*4)*0.6;
  for (const s of QUEST.slime){
    const g = s.g, d = V(s.tujuan.x - g.position.x, 0, s.tujuan.z - g.position.z), L = d.length();
    if (L < 0.2){ s.tunggu -= dt; if (s.tunggu <= 0){ const a = acak()*Math.PI*2, r = 2 + acak()*9; s.tujuan.copy(halamanQuest((acak()-.5)*28, (acak()-.5)*7)); s.tunggu = 1 + acak()*2.5; } }
    else { g.position.addScaledVector(d, Math.min(1, 1.6*dt/L)); g.rotation.y = Math.atan2(d.x, d.z); }
    const lompat = L >= 0.2 ? Math.abs(Math.sin(t*5 + s.fase)) : Math.abs(Math.sin(t*2 + s.fase))*0.15;
    g.position.y = lompat * 0.6 * s.s; s.badan.scale.set(1 + (1-lompat)*0.18, 0.75 - (1-lompat)*0.15 + lompat*0.1, 1 + (1-lompat)*0.18);
  }
  if (sorot.visible) sorot.material.emissiveIntensity = 1.6 + Math.sin(t*6)*0.8;
});
function soroti(id, terbang = true){
  for (const sl of QUEST.slime) sl.lbl.element.classList.toggle('on', sl.id === id); // label slime terpilih selalu tampil
  const k = QUEST.kertasDari.get(id); if (!k){ sorot.visible = false; return; }
  sorot.visible = true; k.g.add(sorot); sorot.position.copy(k.pos); sorot.position.z = 0.1; sorot.rotation.z = k.rot;
  if (terbang){ const w = new THREE.Vector3(); k.g.localToWorld(w.copy(k.pos)); kam.fokus = null; kam.fokusPos = V(w.x, 0, w.z + 3); kam.zoomTuju = Math.max(kam.zoomTuju, 2.2); }
}
async function ambilQuest(){
  try {
    const r = await fetch('/api/qa?k=' + QUEST.katalog, {cache:'no-store'}); const j = await r.json();
    const tanda = JSON.stringify([j.aktif, j.putaran, j.tc?.map(t => t.id + (t.kini||'') + JSON.stringify(t.s))]);

// ═════ KARAKTER CHIBI RPG (low-poly) ═════
// Kerangka sama dgn stickman lama (pinggul y0.95, bahu +0.68, lengan 0.72, kaki 0.95) -> semua animasi tetap berlaku.
const KULIT = [0xf2d3b3, 0xe8b98f, 0xd9a273, 0xb87a4e, 0x8d5a3b, 0xf6e0c8];

const gelapkan = (c, k) => new THREE.Color(c).multiplyScalar(k).getHex();
function alat(jenis){
  const g = new THREE.Group();
  if (jenis==='palu'){ silinder(0.04,0.04,0.65,0x6b4a2e,0,-0.32,0,6,g); kotak(0.4,0.2,0.2,0x55555c,0,-0.65,0.08,g); }

  if (jenis==='pena'){ const c=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.5,5),mat(0xf4f4f4)); c.position.y=-0.2; c.rotation.x=Math.PI; g.add(c); }
  if (jenis==='teropong'){ const t=silinder(0.07,0.1,0.6,0xb08a3a,0,-0.1,0.2,8,g); t.rotation.x=Math.PI/2; }
  if (jenis==='gelas'){ silinder(0.12,0.11,0.25,0xc9a24a,0,-0.08,0.05,8,g); }
  if (jenis==='gulung'){ const t=silinder(0.07,0.07,0.45,0xf2e6c8,0,-0.05,0.05,8,g); t.rotation.z=Math.PI/2; }
  if (jenis==='tongkat'){ silinder(0.04,0.04,0.9,0x6b4a2e,0,-0.45,0,6,g); }

}
function buatKarakter(peran, id){

  const warna = WARNA[peran] || WARNA.Lain, baju2 = gelapkan(warna, 0.62);
  const kulit = KULIT[h % KULIT.length], rambut = RAMBUT[(h >>> 4) % RAMBUT.length];
  const celana = [0x3d3a4a, 0x4a3b2c, 0x2f3b4a, 0x4b4038][(h >>> 8) % 4], sepatu = 0x3a2618, kulitSamak = 0x6b4a2e;

  // badan: tunik + rok tunik + sabuk bergesper
  const badan = bagian(new THREE.CylinderGeometry(0.26, 0.32, 0.72, 8), warna, pinggul, 0, 0.42, 0);
  bagian(new THREE.CylinderGeometry(0.33, 0.39, 0.24, 8), baju2, pinggul, 0, 0.02, 0);
  bagian(new THREE.CylinderGeometry(0.33, 0.33, 0.08, 8), 0x5a3b22, pinggul, 0, 0.16, 0);
  bagian(new THREE.BoxGeometry(0.11, 0.09, 0.05), 0xd9b44a, pinggul, 0, 0.16, 0.32);

  const leher = new THREE.Group(); leher.position.y = 0.78; pinggul.add(leher);
  bagian(new THREE.CylinderGeometry(0.09, 0.1, 0.12, 6), kulit, leher, 0, 0.02, 0);

  for (const sx of [-1, 1]){

    bagian(new THREE.SphereGeometry(0.02, 4, 3), 0xffffff, leher, sx*0.13+0.02, 0.4, 0.37);
    bagian(new THREE.SphereGeometry(0.05, 6, 4), 0xf09a8a, leher, sx*0.21, 0.27, 0.29).scale.set(1, 0.5, 0.4);
  }
  bagian(new THREE.SphereGeometry(0.035, 5, 4), gelapkan(kulit, 0.88), leher, 0, 0.3, 0.36);
  const helm = peran === 'Tester';
  if (!helm){
    const rb = bagian(new THREE.SphereGeometry(0.395, 12, 8, 0, Math.PI*2, 0, Math.PI*0.5), rambut, leher, 0, 0.38, -0.03);

    bagian(new THREE.BoxGeometry(0.5, 0.1, 0.12), rambut, leher, 0, 0.62, 0.22).rotation.x = 0.5; // poni
  }
  // lengan: bahu bulat, lengan baju, lengan bawah, tangan
  const bahu = [0.33, -0.33].map(x => {
    const b = new THREE.Group(); b.position.set(x, 0.68, 0); pinggul.add(b);
    bagian(new THREE.SphereGeometry(0.13, 8, 6), warna, b);
    bagian(new THREE.CylinderGeometry(0.105, 0.09, 0.4, 7), warna, b, 0, -0.2, 0);
    bagian(new THREE.CylinderGeometry(0.075, 0.07, 0.28, 7), kulit, b, 0, -0.52, 0);

    const t = new THREE.Group(); t.position.y = -0.72; b.add(t); return {b, t};
  });
  // kaki: celana + sepatu bot
  const paha = [0.14, -0.14].map(x => {
    const p = new THREE.Group(); p.position.set(x, 0, 0); pinggul.add(p);
    bagian(new THREE.CylinderGeometry(0.115, 0.095, 0.72, 7), celana, p, 0, -0.38, 0);
    bagian(new THREE.BoxGeometry(0.21, 0.2, 0.34), sepatu, p, 0, -0.84, 0.05);
    return p;
  });
  // ── kostum per peran ──
  if (peran === 'Dev'){ // pandai besi: celemek kulit, tali, ikat kepala merah
    bagian(new THREE.BoxGeometry(0.46, 0.62, 0.05), kulitSamak, pinggul, 0, 0.28, 0.31);
    for (const sx of [-1,1]) bagian(new THREE.BoxGeometry(0.05, 0.4, 0.05), kulitSamak, pinggul, sx*0.17, 0.66, 0.27).rotation.x = -0.2;
    const ik = bagian(new THREE.TorusGeometry(0.37, 0.045, 6, 18), 0xb8322a, leher, 0, 0.47, 0); ik.rotation.x = Math.PI/2 + 0.12;
    bagian(new THREE.BoxGeometry(0.08, 0.2, 0.06), 0xb8322a, leher, 0.12, 0.42, -0.38).rotation.z = 0.5;
  } else if (peran === 'QA'){ // cendekiawan/penyihir: jubah panjang, topi runcing, kacamata bulat
    bagian(new THREE.CylinderGeometry(0.36, 0.52, 0.8, 9), baju2, pinggul, 0, -0.32, 0);
    bagian(new THREE.CylinderGeometry(0.56, 0.56, 0.05, 14), baju2, leher, 0, 0.64, 0);
    const kr = bagian(new THREE.ConeGeometry(0.33, 0.75, 9), warna, leher, 0, 1.0, -0.04); kr.rotation.x = -0.15;
    bagian(new THREE.CylinderGeometry(0.335, 0.335, 0.07, 12), 0xd9b44a, leher, 0, 0.7, 0);
    for (const sx of [-1,1]){ const k = bagian(new THREE.TorusGeometry(0.075, 0.016, 5, 12), 0x2b2620, leher, sx*0.13, 0.37, 0.36); }
  } else if (peran === 'Tester'){ // ksatria: helm + bulu, pelindung bahu, pelat dada, perisai di punggung
    bagian(new THREE.SphereGeometry(0.41, 12, 8, 0, Math.PI*2, 0, Math.PI*0.56), LOGAM, leher, 0, 0.37, -0.01).rotation.x = -0.12;
    bagian(new THREE.BoxGeometry(0.08, 0.3, 0.06), LOGAM, leher, 0, 0.5, 0.4).rotation.x = 0.3; // pelindung hidung
    bagian(new THREE.ConeGeometry(0.1, 0.42, 6), 0xc0392b, leher, 0, 0.88, -0.1).rotation.x = -0.5; // bulu helm
    bagian(new THREE.CylinderGeometry(0.29, 0.31, 0.42, 8), LOGAM, pinggul, 0, 0.56, 0);
    for (const b of bahu) bagian(new THREE.SphereGeometry(0.17, 8, 5, 0, Math.PI*2, 0, Math.PI/2), LOGAM, b.b, 0, 0.04, 0);
    const pr = bagian(new THREE.CylinderGeometry(0.4, 0.4, 0.07, 12), warna, pinggul, 0, 0.42, -0.38); pr.rotation.x = Math.PI/2;
    const tp = bagian(new THREE.TorusGeometry(0.4, 0.04, 5, 16), LOGAM, pinggul, 0, 0.42, -0.42);
    bagian(new THREE.BoxGeometry(0.1, 0.1, 0.05), 0xd9b44a, pinggul, 0, 0.42, -0.44);
  } else if (peran === 'Document'){ // juru tulis: baret, kacamata, tas selempang, syal
    const br = bagian(new THREE.CylinderGeometry(0.34, 0.41, 0.13, 12), baju2, leher, 0.04, 0.68, -0.02); br.rotation.z = 0.22;
    bagian(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 5), baju2, leher, 0.07, 0.77, -0.02);
    for (const sx of [-1,1]) bagian(new THREE.TorusGeometry(0.07, 0.015, 5, 12), 0x2b2620, leher, sx*0.13, 0.37, 0.36);
    bagian(new THREE.TorusGeometry(0.2, 0.06, 6, 14), 0xe8d5a8, pinggul, 0, 0.78, 0).rotation.x = Math.PI/2;
    bagian(new THREE.BoxGeometry(0.28, 0.24, 0.12), kulitSamak, pinggul, 0.34, 0.08, 0.06);
    const tl = bagian(new THREE.BoxGeometry(0.05, 0.9, 0.04), kulitSamak, pinggul, 0.05, 0.45, 0.3); tl.rotation.z = -0.62;
  } else if (peran === 'Lead'){ // ketua guild (sesi utama): jubah merah, mahkota emas, pelindung bahu emas, pita dada
    const jubah = bagian(new THREE.BoxGeometry(0.78, 1.45, 0.06), 0x8e1f2c, pinggul, 0, 0.12, -0.36); jubah.rotation.x = 0.12;
    bagian(new THREE.BoxGeometry(0.8, 0.08, 0.08), 0xd9b44a, pinggul, 0, 0.8, -0.3);
    for (const b of bahu) bagian(new THREE.SphereGeometry(0.16, 8, 5, 0, Math.PI*2, 0, Math.PI/2), 0xd9b44a, b.b, 0, 0.05, 0);
    const pita = bagian(new THREE.BoxGeometry(0.09, 0.85, 0.04), 0xd9b44a, pinggul, 0.02, 0.42, 0.31); pita.rotation.z = 0.6;
    bagian(new THREE.CylinderGeometry(0.29, 0.31, 0.16, 10), 0xd9b44a, leher, 0, 0.74, -0.02);
    for (let i=0;i<5;i++){ const a = i/5*Math.PI*2; const dur = bagian(new THREE.ConeGeometry(0.06, 0.18, 4), 0xd9b44a, leher, Math.sin(a)*0.27, 0.9, Math.cos(a)*0.27-0.02); }
    bagian(new THREE.OctahedronGeometry(0.06, 0), 0xc0392b, leher, 0, 0.76, 0.3);
  } else { // penduduk: tudung
    bagian(new THREE.SphereGeometry(0.42, 10, 8, 0, Math.PI*2, 0, Math.PI*0.5), baju2, leher, 0, 0.36, -0.06).rotation.x = -0.45;
  }
  const al = {palu:alat('palu'), pedang:alat('pedang'), pena:alat('pena'), teropong:alat('teropong'), gelas:alat('gelas'), gulung:alat('gulung'), tongkat:alat('tongkat')};
  for (const k in al) bahu[0].t.add(al[k]);
  const buku = new THREE.Group(); kotak(0.5,0.06,0.36,0x7a2e2e,0,0,0,buku); kotak(0.46,0.07,0.32,0xf4ecd6,0,0.01,0,buku);
  buku.position.set(0,0.42,0.5); buku.rotation.x=-0.9; buku.visible=false; pinggul.add(buku);
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,2.6,8), new THREE.MeshBasicMaterial({visible:false})); hit.position.y=1.3; g.add(hit);
  const cincin = new THREE.Mesh(new THREE.RingGeometry(0.75,0.95,24), new THREE.MeshBasicMaterial({color:0xe8b85a, transparent:true, opacity:.9, side:THREE.DoubleSide}));
  cincin.rotation.x=-Math.PI/2; cincin.position.y=0.05; cincin.visible=false; g.add(cincin);
  return {g, pinggul, badan, leher, bahuK:bahu[0].b, bahuKi:bahu[1].b, pahaK:paha[0], pahaKi:paha[1], al, buku, hit, cincin};
}

const percikan = [];
const geoPercik = new THREE.BoxGeometry(0.08,0.08,0.08);
const matPercik = new THREE.MeshBasicMaterial({color:0xffb347});
function semburPercik(p, n=10){ for(let i=0;i<n;i++){ const m=new THREE.Mesh(geoPercik, matPercik); m.position.copy(p); scene.add(m);
  percikan.push({m, v:V((Math.random()-.5)*5, 2+Math.random()*4, (Math.random()-.5)*5), umur:0.5+Math.random()*0.4}); } }

// ═════ AGEN DI DUNIA ═════
const AGEN = new Map(); // id -> objek dunia
let DATA = {agen:[], sekarang:Date.now()/1000}, selisih = 0, pilihId = null, gelembung = true, demo = false;

function animDari(a){
  if (a.status === 'diam') return 'tidur';
  const t = (a.tool_akhir || '').toLowerCase();
  const ada = (...k) => k.some(x => t.includes(x));
  if (a.peran === 'Dev'){
    if (ada('read','grep','glob','script_read','search','toolsearch','inspect')) return 'baca';
    if (ada('bash','powershell')) return 'panas';
    if (ada('execute_luau','start_stop_play','console')) return 'celup';
    if (ada('screen','screenshot','zoom','capture')) return 'teropong';
    return 'tempa';
  }
  if (a.peran === 'Tester'){
    if (ada('screen','screenshot','zoom','capture','read_page','get_page')) return 'teropong';
    if (ada('write','edit')) return 'tulis';
    if (ada('read','grep','glob','toolsearch')) return 'baca';
    return 'uji';
  }
  if (a.peran === 'QA'){
    if (ada('write','edit')) return 'tulis';
    if (ada('screen','capture','execute_luau','inspect')) return 'teropong';
    return 'baca';
  }
  if (a.peran === 'Document'){ return ada('read','grep','glob','search') ? 'baca' : 'tulis'; }
  return 'santai';
}

function buatAgenDunia(a, posAwal){
  const s = buatKarakter(a.peran, a.id);
  s.g.scale.setScalar(SKALA_ORANG);
  s.g.position.copy(posAwal); scene.add(s.g);
  const div = document.createElement('div'); div.className = 'lbl';
  const lbl = new CSS2DObject(div); lbl.position.set(0, 3.15, 0); s.g.add(lbl);  // di atas topi tertinggi (QA)
  const o = {id:a.id, s, div, lbl, jalur:[], anim:'diam', target:null, slot:null, fase:'?', t:Math.random()*10, tunggu:0, hapus:false, ketukT:0};
  s.hit.userData.id = a.id;
  AGEN.set(a.id, o); return o;
}
function hapusAgenDunia(o){ lepasSlot(o.slot); scene.remove(o.s.g); o.lbl.removeFromParent(); o.div.remove(); AGEN.delete(o.id); }

function rute(dari, ke){
  // lewat simpang jalan utama bila jauh, supaya jalan di jalur
  const pts = [];
  if (dari.distanceTo(ke) > 14){ pts.push(TITIK.simpang.clone().add(V((Math.random()-.5)*2,0,(Math.random()-.5)*2))); }
  pts.push(ke.clone()); return pts;
}
function kirim(o, ke, setelah){ o.jalur = rute(o.s.g.position, ke); o.setelah = setelah; }

function tempatkan(a, o, langsung){
  // tentukan tujuan agen menurut status
  const now = Date.now()/1000 + selisih;
  if (a.peran === 'Lead' && a.status !== 'selesai'){ // sesi utama: area kerja = o.areaLead (sudah ditahan di sinkron)
    const area = o.areaLead || 'QA';
    if (o.faseLead !== area){
      lepasSlot(o.slot); o.slot = ambilSlot(area === 'Kedai' ? 'Lain' : 'Lead_'+area, a.id); o.faseLead = area; o.fase = area === 'Kedai' ? 'kedai' : 'kerja';
      if (langsung){ o.s.g.position.copy(o.slot.pos); o.jalur = []; } else kirim(o, o.slot.pos);
    }
    return;
  }
  o.faseLead = null;
  if (a.status !== 'selesai'){
    if (o.fase !== 'kerja'){
      lepasSlot(o.slot); o.slot = ambilSlot(a.peran, a.id); o.fase = 'kerja';
      if (langsung){ o.s.g.position.copy(o.slot.pos); o.jalur = []; } else kirim(o, o.slot.pos);
    }
  } else if (now - a.akhir < SIMPAN_MENIT*60){
    if (o.fase === 'kerja' && !langsung){ // baru selesai: lapor ke guild dulu
      lepasSlot(o.slot); o.slot = null; o.fase = 'lapor';
      kirim(o, TITIK.papan.clone().add(V((Math.random()-.5)*2.4,0,1.3)), () => { o.tunggu = 2.6; o.animPaksa = 'lapor'; o.setelah = null;
        o.lanjut = () => { o.slot = ambilSlot('Lain', a.id); o.fase = 'kedai'; kirim(o, o.slot.pos); }; });
    } else if (o.fase !== 'kedai' && o.fase !== 'lapor'){
      lepasSlot(o.slot); o.slot = ambilSlot('Lain', a.id); o.fase = 'kedai';
      if (langsung){ o.s.g.position.copy(o.slot.pos); o.jalur = []; } else kirim(o, o.slot.pos);
    }
  } else if (o.fase !== 'pulang'){
    lepasSlot(o.slot); o.slot = null; o.fase = 'pulang';
    if (langsung) o.hapus = true; else kirim(o, TITIK.gerbang.clone(), () => { o.hapus = true; });
  }
}

let pertama = true;
function sinkron(){
  const now = Date.now()/1000 + selisih;
  const ada = new Set();
  for (const a of semuaAgen()){
    const diPeta = a.status !== 'selesai' || now - a.akhir < SIMPAN_MENIT*60;
    let o = AGEN.get(a.id);
    if (!o && !diPeta) continue;
    if (!o) o = buatAgenDunia(a, pertama ? V(0,0,0) : TITIK.gerbang.clone().add(V((Math.random()-.5)*3,0,0)));
    ada.add(a.id); o.data = a;
    if (a.peran === 'Lead'){
      const tujuan = areaLead(a);
      if (!o.areaLead) o.areaLead = tujuan;
      else if (tujuan !== o.areaLead){
        if (o.areaCalon !== tujuan){ o.areaCalon = tujuan; o.areaCalonT = now; }
        else if (now - o.areaCalonT >= LEAD_TAHAN) o.areaLead = tujuan;
      } else o.areaCalon = null;
    }
    tempatkan(a, o, pertama);
    o.baru = false;
    tulisLabel(o);
  }
  for (const [id,o] of AGEN) if (!ada.has(id)) { if (o.fase!=='pulang'){ lepasSlot(o.slot); o.fase='pulang'; kirim(o, TITIK.gerbang.clone(), ()=>{o.hapus=true}); } }
  pertama = false;
}

function tulisLabel(o){
  const a = o.data, now = Date.now()/1000 + selisih;
  const dipilih = o.id === pilihId;
  const maks = dipilih ? 40 : 22;
  const nama = a.deskripsi.length > maks ? a.deskripsi.slice(0,maks-1)+'…' : a.deskripsi;
  const jalan = a.status !== 'selesai';
  const lama = a.status === 'jalan' ? now - a.mulai : a.durasi;
  const pct = a.estimasi ? Math.min(99, lama/a.estimasi*100) : 5;
  const lead = a.peran === 'Lead';
  const akt = lead && a.status === 'menunggu' ? AKTIVITAS.menunggu : (AKTIVITAS[o.animTampil || animDari(a)] || '');
  const tool = (a.tool_akhir || '').replace(/^.*\./, '');
  // gelembung ringkas; baris detail cuma utk agen yg dipilih; Lead selalu menampilkan tugas dari user
  let gel = '';
  if (a.status === 'jalan' || (lead && a.status === 'menunggu')){
    const n = dipilih ? 120 : 46, tk = a.tugas_kini || '';
    const tugas = lead && tk ? `<br><i>Tugas: ${esc(tk.slice(0, n))}${tk.length > n ? '…' : ''}</i>` : '';
    gel = `<span class="gel"><b>${esc(akt)}</b>${tool && a.status==='jalan' ? ' · '+esc(tool) : ''}${dipilih && a.detail_akhir && a.status==='jalan' ? '<br>'+esc(a.detail_akhir.slice(0,80)) : ''}${tugas}</span>`;
  }
  const zz = a.status === 'diam' ? '<div class="zz">z Z z</div>' : '';
  o.div.className = 'lbl' + (dipilih ? ' pilih' : '') + (gelembung || dipilih ? '' : ' sembunyiLbl');
  o.div.innerHTML = `<div class="isi">${zz}${gel}<span class="nama"><span class="peran p-${esc(a.peran)}">${esc(a.peran)}</span>${esc(nama)}</span>${jalan && !lead ?`<div class="pb"><i style="width:${pct}%"></i></div>`:''}</div>`;
}

// ═════ ANIMASI PER FRAME ═════
function pose(o, dt){
  const s = o.s, a = o.data; o.t += dt;
  const t = o.t;
  // reset pose
  s.pinggul.position.y = 0.95; s.pinggul.rotation.set(0,0,0); s.leher.rotation.set(0,0,0);
  for (const b of [s.bahuK, s.bahuKi]) b.rotation.set(0,0,0);
  s.pahaK.rotation.set(0,0,0); s.pahaKi.rotation.set(0,0,0);
  for (const k in s.al) s.al[k].visible = false; s.buku.visible = false;
  let anim;
  if (o.jalur.length) anim = 'jalan';
  else if (o.tunggu > 0) anim = o.animPaksa || 'diam';
  else if (o.fase === 'kedai') anim = 'santai';
  else anim = a.peran === 'Lead' ? animLead(o, a) : animDari(a);
  if (anim !== o.animTampil){ o.animTampil = anim; tulisLabel(o); }
  const slot = o.slot;
  switch (anim){
    case 'jalan': { const f = Math.sin(t*9); s.pahaK.rotation.x = f*0.6; s.pahaKi.rotation.x = -f*0.6; s.bahuK.rotation.x = -f*0.5; s.bahuKi.rotation.x = f*0.5; s.pinggul.position.y = 0.95+Math.abs(Math.cos(t*9))*0.06; break; }
    case 'tempa': { // angkat palu pelan, hantam cepat
      s.al.palu.visible = true; const p = (t % 0.95)/0.95;
      const ang = p < 0.65 ? -0.6 - (p/0.65)*2.3 : -2.9 + ((p-0.65)/0.35)*2.3;
      s.bahuK.rotation.x = ang; s.bahuKi.rotation.x = -0.5; s.pinggul.rotation.x = 0.12; s.leher.rotation.x = 0.25;
      if (p >= 0.97 && o.ketukT !== Math.floor(t/0.95)){ o.ketukT = Math.floor(t/0.95); if (slot?.prop) semburPercik(slot.prop.clone().setY(0.95), 9); }
      break; }
    case 'panas': { const f = Math.sin(t*4); s.bahuK.rotation.x = -1.2+f*0.45; s.bahuKi.rotation.x = -1.2+f*0.45; s.pinggul.rotation.x = 0.18+f*0.05; s.al.tongkat.visible = true; break; }
    case 'celup': { const f = (Math.sin(t*1.6)+1)/2; s.pinggul.rotation.x = 0.35+f*0.25; s.bahuK.rotation.x = -0.4-f*0.3; s.bahuKi.rotation.x = -0.4-f*0.3; s.leher.rotation.x = 0.4; s.al.palu.visible = true; break; }
    case 'baca': { s.buku.visible = true; s.bahuK.rotation.x = -1.0; s.bahuKi.rotation.x = -1.0; s.bahuK.rotation.z = 0.35; s.bahuKi.rotation.z = -0.35; s.leher.rotation.x = 0.35+Math.sin(t*0.7)*0.05; s.leher.rotation.y = Math.sin(t*0.5)*0.15; break; }
    case 'uji': { // tebas dummy
      s.al.pedang.visible = true; const p = (t % 1.2)/1.2;
      s.bahuK.rotation.x = p < 0.6 ? -2.4+p*0.6 : -2.04 + (p-0.6)/0.4*1.7; s.bahuK.rotation.z = p < 0.6 ? 0.4 : 0.4-(p-0.6)*1.5;
      s.bahuKi.rotation.x = -0.6; s.pinggul.rotation.y = p<0.6 ? 0.25 : 0.25-(p-0.6)*1.3; s.pahaK.rotation.x = -0.25; s.pahaKi.rotation.x = 0.25;
      if (slot?.obj){ slot.obj.rotation.z = p>0.75 ? Math.sin((p-0.75)*30)*0.2*(1-p) : slot.obj.rotation.z*0.9; if (p>0.75 && o.ketukT !== Math.floor(t/1.2)){ o.ketukT = Math.floor(t/1.2); semburPercik(slot.prop.clone().setY(1.5), 5); } }
      break; }
    case 'teropong': { s.al.teropong.visible = true; s.bahuK.rotation.x = -2.5; s.bahuK.rotation.z = -0.45; s.bahuKi.rotation.x = -0.3; s.leher.rotation.x = -0.25; s.pinggul.rotation.y = Math.sin(t*0.6)*0.5; break; }
    case 'tulis': { s.al.pena.visible = true; s.bahuK.rotation.x = -0.95+Math.sin(t*7)*0.08; s.bahuK.rotation.z = Math.sin(t*3.5)*0.15; s.bahuKi.rotation.x = -0.8; s.leher.rotation.x = 0.45; s.pinggul.rotation.x = 0.15; break; }
    case 'tidur': { // berbaring telentang di samping stasiun, napas pelan
      // berbaring MIRING ke sumbu x lokal (tegak lurus arah pandang kamera) - kalau searah pandang, dari atas tampak berdiri
      s.pinggul.position.y = 0.3; s.pinggul.rotation.z = Math.PI/2 + Math.sin(t*1.2)*0.02; s.leher.rotation.z = -0.25;
      s.bahuK.rotation.x = -0.6; s.bahuKi.rotation.x = -0.9; s.pahaK.rotation.x = -0.5; s.pahaKi.rotation.x = -0.2; break; }
    case 'santai': { s.pinggul.position.y = 0.55; s.pahaK.rotation.x = -1.5; s.pahaKi.rotation.x = -1.5; s.al.gelas.visible = true;
      const p = (t % 5)/5; s.bahuK.rotation.x = p<0.25 ? -0.8-Math.sin(p/0.25*Math.PI)*1.5 : -0.8; s.leher.rotation.x = p<0.25 ? -0.3*Math.sin(p/0.25*Math.PI) : 0.05; s.bahuKi.rotation.x = -0.7; break; }
    case 'perintah': { // menunjuk papan misi, sesekali mengangkat gulungan

// ═════ STATIC BATCHING: gabung mesh dunia yg diam jadi sedikit draw call ═════
// Mesh dianggap diam kalau transform & geometrinya tak berubah saat semua HIDUP dijalankan di beberapa waktu berbeda.
// Yang ditandai userData.dinamis (properti stasiun yg dianimasikan pose(), partikel, dll.) tak pernah digabung.
function gabungStatis(){
  scene.updateMatrixWorld(true);
  const calon = [];
  scene.traverse(m => {
    if (!m.isMesh || m.isInstancedMesh || Array.isArray(m.material) || m.material.transparent) return;
    for (let p = m; p; p = p.parent){ if (!p.visible || p.userData.dinamis) return; }
    calon.push({m, w: m.matrixWorld.clone(), v: m.geometry.attributes.position.version});
  });
  for (const t of [0.37, 2.71, 5.93]) for (const f of HIDUP) f(t, 0.016);
  scene.updateMatrixWorld(true);
  const diam = calon.filter(c => c.w.equals(c.m.matrixWorld) && c.v === c.m.geometry.attributes.position.version && c.m.visible);
  const grup = new Map();
  for (const {m} of diam){ const k = m.material.uuid + (m.castShadow ? 'c' : '') + (m.receiveShadow ? 'r' : ''); if (!grup.has(k)) grup.set(k, []); grup.get(k).push(m); }
  let sebelum = 0, sesudah = 0;
  for (const ms of grup.values()){
    sebelum += ms.length; if (ms.length < 2){ sesudah += ms.length; continue; }
    const geos = ms.map(m => { const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
      if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));
      g.morphAttributes = {}; g.clearGroups(); return g.applyMatrix4(m.matrixWorld); });
    const gab = mergeGeometries(geos, false); if (!gab){ sesudah += ms.length; continue; }
    const M = new THREE.Mesh(gab, ms[0].material); M.castShadow = ms[0].castShadow; M.receiveShadow = ms[0].receiveShadow; M.userData.statis = true;
    scene.add(M); sesudah++;
    for (const m of ms){ m.removeFromParent(); m.geometry.dispose(); }
  }
  console.debug(`desa: static batching ${sebelum} mesh -> ${sesudah}`);
}

// saran otomatis: rata-rata < 40 fps selama 6 dtk (tab terlihat, belum hemat) -> tawarkan sekali per sesi halaman
const pantauFps = {n:0, t:0, ditolak:false};
$('bSaranYa').onclick = () => { kualitas = 'hemat'; terapkanKualitas(); $('saranHemat').style.display = 'none'; };
$('bSaranTidak').onclick = () => { pantauFps.ditolak = true; $('saranHemat').style.display = 'none'; };
function cekFps(dtAsli){
  if (hemat || pantauFps.ditolak || document.visibilityState !== 'visible' || dtAsli > 0.5) return;
  pantauFps.n++; pantauFps.t += dtAsli;
  if (pantauFps.t >= 6){ const fps = pantauFps.n / pantauFps.t; pantauFps.n = 0; pantauFps.t = 0;
    if (fps < 40){ pantauFps.ditolak = true; $('saranHemat').style.display = 'flex'; } }
}
function loop(){
  requestAnimationFrame(loop);
  const dtAsli = jamDunia.getDelta(); akum += dtAsli; cekFps(dtAsli);
  if (hemat && akum < 1/FPS_HEMAT - 0.002) return;   // lewati frame: batas 30 fps
  const dt = Math.min(0.05, akum); akum = 0;
  // kamera halus
  const sp = 24*dt/kam.zoom;
  if (tombol.has('w')) geser(0, sp/((VIEW/kam.zoom)/innerHeight)*Math.sin(kam.el)); if (tombol.has('s')) geser(0, -sp/((VIEW/kam.zoom)/innerHeight)*Math.sin(kam.el));
  if (tombol.has('a')) geser(sp/((VIEW/kam.zoom)/innerHeight), 0); if (tombol.has('d')) geser(-sp/((VIEW/kam.zoom)/innerHeight), 0);
  if (kam.fokus){ const p = kam.fokus.s.g.position; kam.target.lerp(V(p.x,0,p.z), Math.min(1, dt*4)); }
  else if (kam.fokusPos){ kam.target.lerp(kam.fokusPos, Math.min(1, dt*4)); if (kam.target.distanceTo(kam.fokusPos) < 0.05) kam.fokusPos = null; }
  kam.az += (kam.azTuju-kam.az)*Math.min(1, dt*7); kam.zoom += (kam.zoomTuju-kam.zoom)*Math.min(1, dt*8);
  labelR.domElement.classList.toggle('jauh', kam.zoom < 0.85); labelR.domElement.classList.toggle('dekat', kam.zoom > 1.5);
  aturKamera(); if (!hemat) aturBayangan();
  // agen
  for (const o of [...AGEN.values()]){ if (!o.data) continue; langkah(o, dt); pose(o, dt); if (o.hapus){ if (kam.fokus===o) kam.fokus=null; hapusAgenDunia(o); } }
  // percikan
  for (let i=percikan.length-1;i>=0;i--){ const p=percikan[i]; p.umur-=dt; p.v.y-=14*dt; p.m.position.addScaledVector(p.v, dt); if (p.umur<=0 || p.m.position.y<0){ scene.remove(p.m); percikan.splice(i,1);} }
  // dunia hidup: api, asap, bendera, bola sihir, burung, lampu untai, dst.
  const tt = performance.now()/1000;
  for (const f of HIDUP) f(tt, dt);
  if (hemat) renderer.render(scene, camera); else FX.c.render(dt);
  labelR.render(scene, camera);
  detikUI += dt; if (detikUI > 1){ detikUI = 0; gambarDaftar(); if (pilihId) gambarDetail(); for (const o of AGEN.values()) if (o.data && o.data.status==='jalan') tulisLabel(o); }
}
// hash URL opsional: #kam=x,z[,zoom[,putaran]] -> posisi kamera awal (pintasan & uji visual), mis. /desa#kam=-34,8,1.6
{ const m = /kam=(-?[\d.]+),(-?[\d.]+)(?:,([\d.]+))?(?:,(-?\d+))?/.exec(location.hash);
  if (m){ kam.target.set(+m[1], 0, +m[2]); if (m[3]) kam.zoom = kam.zoomTuju = Math.min(3.2, Math.max(0.4, +m[3])); if (m[4]) kam.az = kam.azTuju = Math.PI/4 + (+m[4])*Math.PI/2; } }
gabungStatis(); terapkanKualitas(); ambil(); setInterval(ambil, POLL_MS); ambilQuest(); setInterval(ambilQuest, 30000); loop();
</script>
