<style>
/* Tema RPG: panel perkamen berbingkai kayu + aksen emas. Teks gelap di atas perkamen. */
:root{--panel:#f3e6c8;--garis:rgba(90,59,34,.24);--teks:#3a2814;--teks2:#5e4528;--teks3:#8a6e4a;--emas:#a8761e;--emas2:#e8c46a;--kayu:#5a3b22;--kayu2:#3d2814;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --kertas:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .25 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#78b8e8;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--teks)}
#dunia{position:fixed;inset:0}
#dunia canvas{display:block}
.panel{position:fixed;z-index:10;color:var(--teks);background:var(--kertas),radial-gradient(ellipse at 30% 0%,#fbf2dc,#efdfba 60%,#e2cc9e);border:3px solid var(--kayu);border-radius:10px;
  box-shadow:inset 0 0 0 1px #c9a24a,inset 0 0 34px rgba(150,100,40,.28),0 10px 30px rgba(20,10,0,.45),0 0 0 1px #2a1a0c}
.panel::before,.panel::after{content:"";position:absolute;top:-7px;width:10px;height:10px;background:linear-gradient(135deg,#f6d77a,#a8761e);border:1px solid #5a3b22;transform:rotate(45deg);pointer-events:none}
.panel::before{left:-7px}.panel::after{right:-7px}
#kiri{left:12px;top:12px;bottom:12px;width:296px;display:flex;flex-direction:column}
#kiri header{padding:12px 14px 9px;border-bottom:1px solid var(--garis);background:linear-gradient(rgba(255,250,235,.5),transparent)}
#kiri h1{font:700 19px/1.2 var(--serif);margin:0;display:flex;align-items:center;gap:8px;color:var(--kayu);letter-spacing:.03em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#kiri h1::before{content:"";width:18px;height:18px;flex:none;background:center/contain no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1l2 4 4.5.6-3.3 3.1.8 4.5L8 11l-4 2.2.8-4.5L1.5 5.6 6 5z' fill='%23b8862e' stroke='%235a3b22' stroke-width='.8'/></svg>")}
#kiri h1 a{margin-left:auto;font:400 12px/1 system-ui,sans-serif;color:var(--teks3);text-decoration:none;border-bottom:1px dotted var(--teks3)}
.ringkas{font-size:12px;color:var(--teks3);margin-top:4px}
#daftar{overflow:auto;padding:6px 8px 10px;flex:1}
.grp{font:700 11px/1.2 var(--serif);letter-spacing:.08em;color:var(--emas);margin:12px 6px 5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(168,118,30,.6),transparent)}
.item .stTeks{font-size:10.5px;color:var(--teks3);flex:none}
.item.pin{background:rgba(232,196,106,.18);border-color:rgba(168,118,30,.35)}
.grpLipat{cursor:pointer;user-select:none}.grpLipat::after{order:1}.grpLipat .mbtn{order:2;text-transform:none;letter-spacing:0;font-family:system-ui,sans-serif;font-weight:400}
.item{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s}
.item:hover{background:rgba(120,80,30,.09)}
.item.pilih{border-color:var(--emas);background:rgba(232,196,106,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.item .wkt{font-size:11.5px;color:var(--teks3);font-variant-numeric:tabular-nums}
.arsip{opacity:.6}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(60,40,20,.5)}
.d-jalan{background:#3fbf7a;box-shadow:0 0 6px #3fbf7a}.d-diam{background:#e8a83a}.d-selesai{background:#9a917e}
.peran{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1px 6px 1px 4px;border-radius:5px;flex:none;border:1px solid rgba(0,0,0,.25)}
.peran svg{width:11px;height:11px;fill:currentColor;flex:none}
.p-Dev{background:#16304f;color:#8cbcf5}.p-QA{background:#2a2552;color:#b3aaf2}.p-Tester{background:#103b30;color:#7fdcbc}.p-Document{background:#47271a;color:#f2a57c}.p-Lain{background:#3a3530;color:#d8d0c0}.p-Lead{background:#4a2a12;color:#ffd77a}
.d-menunggu{background:#5aa8e8}
@keyframes muncul{from{opacity:0;transform:translateY(-8px) scale(.98)}}
#kanan{right:12px;top:12px;width:364px;max-height:calc(100% - 24px);overflow:auto;padding:14px 16px;display:none;animation:muncul .22s ease-out}
#kanan h2{font:700 16px/1.3 var(--serif);margin:6px 0 2px;color:var(--kayu2)}
#kanan .tutup{position:absolute;right:10px;top:6px;background:none;border:0;color:var(--kayu);font-size:22px;cursor:pointer;line-height:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:10px 0;padding:8px 10px;background:rgba(255,250,235,.45);border:1px solid var(--garis);border-radius:7px}
.kv span:nth-child(odd){color:var(--teks3)}
.bar{height:7px;background:rgba(90,59,34,.15);border-radius:4px;overflow:hidden;margin:6px 0 2px;border:1px solid rgba(90,59,34,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c9932e,#f0cc6a);border-radius:4px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:rgba(255,252,240,.65);border:1px solid var(--garis);border-radius:7px;padding:8px;max-height:220px;overflow:auto;color:var(--teks2)}
details summary{cursor:pointer;color:#8a5a1e;font-size:12.5px;margin-top:8px;font-weight:600}
/* tombol kayu */
.tab,#kontrol button,#saranHemat button{font:inherit;font-size:12.5px;cursor:pointer;color:#f8ead0;border:1px solid var(--kayu2);border-radius:6px;padding:5px 10px;
  background:linear-gradient(#8a5a32,#6b4423);box-shadow:inset 0 1px 0 rgba(255,220,160,.35),0 2px 0 #2a1a0c;text-shadow:0 1px 0 rgba(0,0,0,.4);transition:filter .12s,transform .08s}
.tab:hover,#kontrol button:hover,#saranHemat button:hover{filter:brightness(1.12)}
.tab:active,#kontrol button:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,220,160,.35),0 1px 0 #2a1a0c}
.tab.on,#kontrol button.on,#saranHemat button#bSaranYa{background:linear-gradient(#e2b456,#a8761e);color:#2a1a0c;text-shadow:0 1px 0 rgba(255,240,200,.5);border-color:#5a3b22}
#kontrol{left:320px;bottom:12px;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 540px);
  background:var(--kertas),linear-gradient(#6b4423,#4a2e18);border-color:var(--kayu2)}
#kontrol .bantu{font-size:11.5px;color:#e8d4ac;padding:0 6px}
#kontrol #bKontrol{padding:5px 8px;min-width:28px}
#kontrol.ciut>:not(#bKontrol):not(#bMaster){display:none}  /* bar tombol disembunyikan: tinggal tombol panah (H) + Master */
/* label di atas kepala (CSS2D) */
.lbl{text-align:center;pointer-events:none;white-space:nowrap}
.lbl .isi{transform:translateY(-50%)}  /* CSS2D memusatkan elemen di titik; geser supaya dasar label = di atas kepala */
.lbl .nama{display:inline-flex;gap:5px;align-items:center;background:linear-gradient(#4e321c,#2e1c0e);color:#fbecc8;font:600 11.5px/1.3 var(--serif);padding:2px 8px 2px 4px;border-radius:5px;border:1px solid #c9a24a;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.lbl .gel{position:relative;display:block;margin:0 auto 7px;max-width:230px;white-space:normal;background:#fdf6e2;color:#3a2814;font-size:11px;line-height:1.3;padding:4px 8px;border-radius:8px;border:1px solid #b89a6a;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.lbl .gel::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:#fdf6e2;border-bottom:0}
.lbl .pb{width:74px;height:5px;background:rgba(30,20,10,.55);border-radius:3px;margin:3px auto 0;overflow:hidden;border:1px solid rgba(201,162,74,.6)}
.lbl .pb i{display:block;height:100%;background:linear-gradient(90deg,#c9932e,#f0cc6a)}
.lbl.pilih .nama{outline:2px solid #f0cc6a;outline-offset:1px}
.lbl .zz{font:700 15px var(--serif);color:#fff;text-shadow:0 1px 3px #000}
.bangun{background:linear-gradient(#7a5232,#55361d);color:#fbe9c6;font:700 12px/1.2 var(--serif);letter-spacing:.04em;padding:4px 10px;border-radius:4px;border:1px solid #c9a24a;box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,160,.25);pointer-events:none;text-shadow:0 1px 0 #2a1a0c}
.sembunyiLbl .gel,.sembunyiLbl .pb{display:none}
.jauh .lbl:not(.pilih) .gel,.jauh .lbl:not(.pilih) .pb{display:none}  /* zoom jauh: cuma nama, kecuali agen dipilih */
.tabs{display:flex;gap:6px;margin-top:9px}
.tab{flex:1;padding:5px 8px}
#quest{overflow:auto;padding:6px 8px 10px;flex:1}
.qkontrol{display:flex;gap:6px;align-items:center;margin:4px 0 8px}.qkontrol select{flex:1}
#quest select,#qCari{font:inherit;font-size:12.5px;background:#fdf7e6;color:var(--teks);border:1px solid #b89a6a;border-radius:6px;padding:5px 7px}
#qCari{width:100%;margin:8px 0 2px}
.qg{padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent}.qg:hover{background:rgba(120,80,30,.09)}.qg.pilih{border-color:var(--emas);background:rgba(232,196,106,.2)}
.qgn{display:flex;justify-content:space-between;font-size:12.5px}.qgn span{color:var(--teks3)}
.qbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:4px;gap:1px;border:1px solid rgba(90,59,34,.25)}.qbar i{display:block}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.qproyek{display:flex;flex-direction:column;gap:3px;margin:2px 0 8px;padding-bottom:8px;border-bottom:1px solid rgba(90,59,34,.2)}
.qpr{display:flex;justify-content:space-between;align-items:center;gap:8px;font:inherit;font-size:12.5px;text-align:left;padding:6px 9px;border-radius:7px;border:1px solid transparent;background:none;color:var(--teks);cursor:pointer}
.qpr:hover{background:rgba(120,80,30,.09)}.qpr.on{border-color:var(--emas);background:linear-gradient(rgba(240,204,106,.35),rgba(212,164,71,.25));font-weight:700}
.qpr span{font-weight:400;color:var(--teks3);font-size:11.5px;white-space:nowrap}
.qchip{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid #b89a6a;background:rgba(255,250,235,.6);color:var(--teks2);cursor:pointer}.qchip.on{border-color:var(--emas);color:#2a1a0c;background:linear-gradient(#f0cc6a,#d4a447)}
.qid{font-size:11.5px;font-weight:700;color:var(--teks2);flex:none;font-variant-numeric:tabular-nums}
.qk{font-size:11.5px;color:var(--teks3);margin-top:8px}.qv{font-size:12.5px;color:var(--teks);white-space:pre-wrap;word-break:break-word}
.qh{padding:7px 0;border-top:1px solid var(--garis)}
.qpill{display:inline-block;font-size:11px;font-weight:700;color:#1a1a1a;padding:1px 8px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
/* Chat Master */
#master{right:12px;bottom:242px;width:420px;height:min(520px,calc(100% - 266px));min-width:280px;min-height:260px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);
  display:none;flex-direction:column;z-index:12;overflow:hidden}
/* pegangan ubah ukuran (tepi kiri/kanan/bawah + 2 sudut bawah); sudut kanan bawah diberi garis supaya terlihat */
.mrz{position:absolute;z-index:3;touch-action:none;user-select:none}
body.ukurPanel{user-select:none}
.mrz-w{left:0;top:40px;bottom:14px;width:7px;cursor:ew-resize}.mrz-e{right:0;top:40px;bottom:14px;width:7px;cursor:ew-resize}
.mrz-s{left:14px;right:14px;bottom:0;height:7px;cursor:ns-resize}
.mrz-sw{left:0;bottom:0;width:14px;height:14px;cursor:nesw-resize}
.mrz-se{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 45%,#a8761e 45%,#a8761e 52%,transparent 52%,transparent 64%,#a8761e 64%,#a8761e 71%,transparent 71%)}
.mrz:hover{background-color:rgba(168,118,30,.18)}
#master.buka{display:flex;animation:muncul .22s ease-out}
.mjudul{display:flex;align-items:center;gap:8px;padding:8px 10px 7px 12px;cursor:move;user-select:none;touch-action:none;border-bottom:1px solid var(--garis);background:linear-gradient(rgba(255,250,235,.5),transparent)}
.mjudul b{font:700 15px/1.2 var(--serif);color:var(--kayu2);letter-spacing:.02em}.mjudul span{font-size:11px;color:var(--teks3)}
.mjudul .tutup{margin-left:auto;background:none;border:0;color:var(--kayu);font-size:22px;cursor:pointer;line-height:1;padding:0 2px}
.mstat{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:12px;color:var(--teks2);border-bottom:1px solid var(--garis)}
.mstat .dot{width:8px;height:8px}.d-sibuk{background:#e8b830;box-shadow:0 0 6px #e8b830;animation:kedip 1s ease-in-out infinite}.d-siap{background:#3fbf7a}.d-mati{background:#9a917e}
@keyframes kedip{50%{opacity:.35}}
#mStatus{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mstat .ktl{margin-left:auto;display:flex;gap:4px;flex:none}
.mbtn{font:inherit;font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid #b89a6a;background:rgba(255,250,235,.6);color:var(--teks2);cursor:pointer}.mbtn:hover{background:rgba(232,196,106,.35)}
#mLog{flex:1;min-height:0;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.mg{max-width:88%;padding:6px 9px;border-radius:9px;font-size:12.5px;line-height:1.42;white-space:pre-wrap;word-break:break-word;border:1px solid var(--garis)}
.mg code{font:11.5px ui-monospace,Consolas,monospace;background:rgba(90,59,34,.1);padding:0 3px;border-radius:3px}
.mg-kamu{align-self:flex-end;background:linear-gradient(#f0d48a,#e2bd66);border-color:#b8913a;color:#2a1a0c;border-bottom-right-radius:3px}
.mtanya{display:block;margin:6px 0;padding:6px 8px 6px 9px;border-radius:7px;background:#fff1c2;border:1px solid #d9a83a;border-left:4px solid #c9821e;white-space:normal}
.mtanya .mtj{display:block;font:700 11.5px/1.3 var(--serif);color:#8a4a0e;letter-spacing:.02em;margin-bottom:2px}
.mtanya ol{margin:2px 0 0;padding-left:18px}
.mopsi{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.mop{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid #c9821e;background:#fffaf0;color:#5a3410;cursor:pointer}
.mop:hover{background:#ffe7a8}.mop.on{background:linear-gradient(#f0cc6a,#d4a447);border-color:#8a5a1e;color:#2a1a0c;font-weight:700}
.mop b{font-weight:inherit}
.mop.rek{border:2px solid #d4a447;padding:1px 8px;box-shadow:0 0 0 2px rgba(240,204,106,.35);font-weight:600}.mop.rek .ik{width:11px;height:11px;color:#c9921e;margin:0 3px -1px 0}
.mop.rek.on .ik{color:#7a4a10}
.msaran{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(212,164,71,.18);font:600 10.5px/1.6 system-ui,sans-serif;color:#8a5a1e;white-space:nowrap}.msaran .ik{width:10px;height:10px;color:#c9921e}
.mpakai{float:right;font:600 10.5px/1.5 system-ui,sans-serif;padding:1px 8px;border-radius:999px;border:1px solid #c9821e;background:linear-gradient(#fff3cf,#f3d98e);color:#5a3410;cursor:pointer}.mpakai:hover{background:linear-gradient(#ffe7a8,#e8c460)}.mpakai .ik{width:10px;height:10px;color:#c9921e;margin-right:3px;vertical-align:-1px}
.mtanya.lama{opacity:.72;border-left-color:#b8a07a}.mtsudah{font:400 10.5px system-ui,sans-serif;color:#8a6e4a;margin-left:6px}.mtanya li{margin:2px 0;white-space:pre-wrap}
.mg-master{align-self:flex-start;background:rgba(255,252,240,.85);border-bottom-left-radius:3px}
.mg-masuk{align-self:flex-start;background:rgba(214,232,206,.7);border-color:rgba(60,110,50,.3);border-bottom-left-radius:3px}
.mg .dari{display:block;font:700 10.5px/1.3 var(--serif);letter-spacing:.04em;color:#4a6a30;margin-bottom:2px}
.mk{font-size:11.5px;color:var(--teks2)}.mk summary{margin:0;font-weight:400;color:var(--teks2)}.mk summary b{color:var(--kayu)}
.mk pre{max-height:160px;margin:4px 0 0}
.mx{font-size:11px;color:var(--teks3);text-align:center}.mx.galat{color:#a83228}
.mkosong{font-size:12.5px;color:var(--teks3);padding:10px 4px;line-height:1.5}
#mTab{display:none;gap:4px;padding:6px 10px 0}#mTab.ada{display:flex}
#mTab button{flex:1;font:inherit;font-size:11.5px;padding:4px 6px;border-radius:6px 6px 0 0;border:1px solid #b89a6a;border-bottom:0;background:rgba(255,250,235,.5);color:var(--teks2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
#mTab button.on{background:linear-gradient(#f0cc6a,#d4a447);color:#2a1a0c;font-weight:700;border-color:var(--emas)}
#mTab button.baru::after{content:"";position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:#d8403a}
.mriwket{font-size:11px;color:var(--teks3);text-align:center;padding:2px 0 4px}
#mSesi{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 10px;border-top:1px solid var(--garis);max-height:64px;overflow:auto}
#mSesi .lbl2{font-size:11px;color:var(--teks3);margin-right:2px}
.msc{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid #b89a6a;background:rgba(255,250,235,.6);color:var(--teks2);cursor:pointer}
.msc:hover{background:rgba(232,196,106,.3)}.msc.on{border-color:var(--emas);color:#2a1a0c;background:linear-gradient(#f0cc6a,#d4a447);font-weight:700}
.msc i{width:7px;height:7px;border-radius:50%;flex:none}.msc i.sibuk{background:#e8a83a}.msc i.siap{background:#3fae5a}
#mSesi .batal{font-size:11px;color:#a83228;cursor:pointer;background:none;border:0;padding:0 4px}
.mg .ke{display:block;font-size:10.5px;font-weight:700;opacity:.75;margin-bottom:2px}
#mSesi+#mLamp{border-top:0}
#mSaran{display:none;flex-wrap:wrap;gap:4px;padding:6px 10px 0}#mSaran.ada{display:flex}
#mSaran .lbl2{font-size:11px;color:var(--teks3);margin-right:2px;align-self:center}
.msr{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px dashed #a8761e;background:rgba(255,250,235,.75);color:var(--kayu2);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msr:hover{background:rgba(232,196,106,.35);border-style:solid}
.msr-ai{margin-left:auto;font:700 10px/1 system-ui,sans-serif;padding:3px 6px;border-radius:5px;border:1px solid #b89a6a;background:transparent;color:var(--teks3);cursor:pointer}
.msr-ai.on{background:linear-gradient(#f0cc6a,#d4a447);color:#2a1a0c;border-color:var(--emas)}
#mLamp{display:none;flex-wrap:wrap;gap:6px;padding:7px 10px 0;border-top:1px solid var(--garis)}#mLamp.ada{display:flex}
#mLamp+#mForm{border-top:0}
.mli{position:relative;width:58px;height:58px;border-radius:6px;overflow:hidden;border:1px solid #b89a6a;background:#fdf7e6}
.mli img{width:100%;height:100%;object-fit:cover;display:block}
.mli button{position:absolute;top:1px;right:1px;width:18px;height:18px;padding:0;border-radius:50%;border:1px solid #5a3b22;background:rgba(42,26,12,.8);color:#fbecc8;font-size:12px;line-height:15px;cursor:pointer}
.mlket{font-size:11px;color:var(--teks3);align-self:center}
.mg .gbr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.mg .gbr img{max-width:120px;max-height:90px;border-radius:5px;border:1px solid rgba(90,59,34,.35);display:block;cursor:zoom-in}
#mGalat{display:none;margin:6px 10px 0;padding:5px 8px;border-radius:6px;background:rgba(216,64,58,.12);border:1px solid rgba(168,50,40,.4);color:#8a2018;font-size:11.5px}#mGalat.ada{display:block}
#mForm{display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--garis);align-items:flex-end}
#mTeks{flex:1;resize:none;font:inherit;font-size:12.5px;line-height:1.4;background:#fdf7e6;color:var(--teks);border:1px solid #b89a6a;border-radius:6px;padding:6px 8px;min-height:36px;max-height:140px}
#mKirim{font:inherit;font-size:12.5px;cursor:pointer;color:#2a1a0c;border:1px solid #5a3b22;border-radius:6px;padding:7px 11px;background:linear-gradient(#e2b456,#a8761e);box-shadow:0 2px 0 #2a1a0c}
#bMaster.baru{position:relative}#bMaster.baru::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:#d8403a;border:1px solid #fbecc8}
/* Pemakaian plan Claude (strip di kepala panel kiri + panel rincian) */
#pakai{display:none;width:100%;margin-top:7px;padding:5px 7px;border-radius:7px;border:1px solid var(--garis);background:rgba(255,250,235,.5);cursor:pointer;font:inherit;text-align:left;color:var(--teks)}
#pakai:hover{background:rgba(232,196,106,.25)}#pakai.on{border-color:var(--emas)}
.pkb{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;font-size:11px;color:var(--teks2);line-height:1.5}
.pkb b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;color:var(--teks)}
.pkbar{display:block;height:6px;border-radius:3px;background:rgba(90,59,34,.15);overflow:hidden;border:1px solid rgba(90,59,34,.2)}.pkbar i{display:block;height:100%;border-radius:3px}
#pakaiRinci{left:320px;top:12px;width:300px;max-height:calc(100% - 90px);overflow:auto;padding:12px 14px;display:none;animation:muncul .22s ease-out}
#pakaiRinci h2{font:700 15px/1.3 var(--serif);margin:0 0 2px;color:var(--kayu2)}
#pakaiRinci .tutup{position:absolute;right:10px;top:4px;background:none;border:0;color:var(--kayu);font-size:22px;cursor:pointer;line-height:1}
.pkr{padding:7px 0;border-top:1px solid var(--garis)}.pkr:first-of-type{border-top:0}
.pkr .atas{display:flex;justify-content:space-between;font-size:12.5px}.pkr .atas b{font-variant-numeric:tabular-nums}
.pkr .bawah{font-size:11px;color:var(--teks3);margin-top:3px}
.pkr .pkbar{height:8px;margin-top:4px}
.pkket{font-size:11px;color:var(--teks3);margin-top:8px;line-height:1.45}
/* Perlu jawaban: sesi yg kemungkinan menunggu user (hanya menampilkan; izin tetap diberikan di sesinya) */
#perlu{left:50%;top:12px;transform:translateX(-50%);width:min(380px,calc(100% - 24px));padding:0;display:none;z-index:13;overflow:hidden}
#perlu.ada{display:block}
#perlu .pkep{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;user-select:none;font:700 13px/1.2 var(--serif);color:var(--kayu2)}
#perlu .pkep .jml{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#d8403a;color:#fff;font:700 11.5px/20px system-ui,sans-serif;text-align:center;animation:denyut 1.6s ease-in-out infinite}
@keyframes denyut{50%{box-shadow:0 0 0 5px rgba(216,64,58,.18)}}
#perlu .pkep .ket{margin-left:auto;font:400 11px system-ui,sans-serif;color:var(--teks3)}
#perlu .pdaf{max-height:260px;overflow:auto;border-top:1px solid var(--garis)}
#perlu.ciut .pdaf{display:none}
.pit{display:flex;gap:8px;align-items:flex-start;padding:7px 10px 7px 12px;border-bottom:1px solid var(--garis);cursor:pointer}
.pit:hover{background:rgba(232,196,106,.22)}
.pit .isi{flex:1;min-width:0;font-size:12px;line-height:1.4}.pit .isi b{font-family:var(--serif);color:var(--kayu2)}
.pit .isi .q{display:block;color:var(--teks2);white-space:pre-wrap;word-break:break-word}
.pit .isi .w{font-size:10.5px;color:var(--teks3)}
.pit .jn{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;flex:none;margin-top:2px}.jn-tanya{background:#f3d27a;color:#4a2e0a}.jn-izin{background:#e8a090;color:#4a140c}
.pit .x{background:none;border:0;color:var(--teks3);font-size:16px;cursor:pointer;line-height:1;padding:0 2px}
.lblSlime{background:rgba(120,20,20,.88);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;pointer-events:none;border:1px solid #f0a090}
.lblSlime{display:none}.dekat .lblSlime,.lblSlime.on{display:block}
#galat{z-index:20;position:fixed;left:50%;top:12px;transform:translateX(-50%);background:linear-gradient(#8a2a20,#6a1a14);color:#fff;padding:6px 14px;border-radius:7px;border:1px solid #e8a090;display:none;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* tooltip hover dunia */
#tip{position:fixed;z-index:15;pointer-events:none;display:none;max-width:260px;padding:6px 9px;font-size:12px;line-height:1.35;color:var(--teks);background:#fbf3dd;border:1px solid #8a6a3a;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#tip b{font-family:var(--serif)}
/* peta mini */
#peta{right:12px;bottom:12px;width:206px;padding:7px 7px 4px}
#peta canvas{display:block;width:188px;height:188px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px #5a3b22,0 0 0 2px #c9a24a}
#peta .kaki{display:flex;justify-content:space-between;font:600 11px/1.4 var(--serif);color:var(--teks2);padding:4px 4px 0}
@media (max-width:820px){
  #kiri{width:230px;bottom:auto;max-height:44%}
  #kanan{left:12px;right:12px;width:auto;top:auto;bottom:60px;max-height:46%}
  #kontrol{left:12px;right:12px;max-width:none}
  #kontrol.ciut{right:auto}
  #master{left:12px!important;right:12px!important;top:auto!important;bottom:60px!important;width:auto!important;height:55%!important}
  .mrz{display:none}
  #pakaiRinci{left:12px;right:12px;width:auto;top:auto;bottom:60px;max-height:46%}
  #kontrol .bantu,#peta{display:none}
}

/* ═════ PENYEMPURNAAN UI PANEL (satu bahasa visual) ═════
   Warna status SAMA di semua tempat: kerja = hijau, menunggu / siap = biru, diam = kuning, mati / selesai = abu. */
:root{--st-kerja:#3fae5a;--st-tunggu:#3f8fd0;--st-diam:#d99a2b;--st-mati:#a39a88}
.d-jalan,.d-sibuk{background:var(--st-kerja);box-shadow:0 0 0 2px rgba(63,174,90,.2)}
.d-sibuk{animation:kedip 1.2s ease-in-out infinite}
.d-menunggu,.d-siap{background:var(--st-tunggu);box-shadow:none}
.d-diam{background:var(--st-diam);box-shadow:none}
.d-selesai,.d-mati{background:var(--st-mati);box-shadow:none}
.msc i.sibuk{background:var(--st-kerja)}.msc i.siap{background:var(--st-tunggu)}
/* panel kiri: tinggi ikut isi (tak ada ruang kosong), kepala lebih rapi */
#kiri{bottom:auto;max-height:calc(100% - 24px)}
#daftar{flex:0 1 auto;padding:4px 8px 10px}
#kiri header{padding:12px 14px 10px}
#kiri h1 a{border:1px solid #c4a777;border-radius:999px;padding:3px 9px;font-size:11px;color:var(--teks2);background:rgba(255,250,235,.55)}
#kiri h1 a:hover{background:rgba(232,196,106,.35)}
.ringkas{display:flex;flex-wrap:nowrap;gap:10px;margin-top:6px;font-size:11.5px;color:var(--teks2);white-space:nowrap;overflow:hidden}
.ringkas .rk{display:inline-flex;align-items:center;gap:5px}.ringkas .rk .dot{width:8px;height:8px}
.grp{margin:14px 6px 6px;font-size:10.5px}
.item{padding:6px 9px;gap:9px;margin:1px 0}
.item .nm{font-size:13px}
.item .wkt{min-width:44px;text-align:right;font-size:11px}
.item .stTeks{font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:600}
.item .st-jalan{background:rgba(63,174,90,.14);color:#2c7a40}.item .st-menunggu{background:rgba(63,143,208,.14);color:#2a6496}
.item .st-diam{background:rgba(217,154,43,.16);color:#8a5a10}.item .st-selesai{background:rgba(120,110,90,.14);color:#6a5e48}
.grpLipat .mbtn{font-size:10.5px;padding:1px 7px}
/* panel Perlu jawaban: di samping panel kiri, tak menabrak panel Chat Master */
#perlu{left:320px;transform:none;width:min(360px,calc(100% - 340px));z-index:11}  /* di bawah panel Chat (12) kalau layar sempit */
@media (max-width:820px){#perlu{left:12px;right:12px;width:auto;top:auto;bottom:60px}}
/* panel Chat Master: status di baris judul, menu utk aksi berisiko, area pesan diutamakan */
.mjudul{gap:8px;padding:7px 8px 7px 12px}
.mjudul .mjst{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:11.5px;color:var(--teks2)}
.mjudul .mjst .dot{width:8px;height:8px;flex:none}
.mjudul #mStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mjudul .tutup{margin-left:0}
.mmenu{position:relative;flex:none}
.mmenub{font:700 15px/1 system-ui,sans-serif;width:26px;height:24px;border-radius:6px;border:1px solid transparent;background:none;color:var(--kayu);cursor:pointer}
.mmenub:hover,.mmenu.buka .mmenub{border-color:#c4a777;background:rgba(232,196,106,.3)}
.mmenul{display:none;position:absolute;right:0;top:28px;z-index:6;min-width:190px;padding:4px;border-radius:8px;background:#fbf3dd;border:1px solid #8a6a3a;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.mmenu.buka .mmenul{display:block}
.mmenul button{display:block;width:100%;text-align:left;font:inherit;font-size:12px;padding:6px 9px;border:0;border-radius:6px;background:none;color:var(--teks);cursor:pointer}
.mmenul button:hover{background:rgba(232,196,106,.35)}.mmenul button.bahaya{color:#9a2a20}
.mmenul .ket{display:block;font-size:10.5px;color:var(--teks3)}
.mstat{display:none}
#mLog{padding:10px 12px;gap:8px}
.mg{max-width:86%;padding:7px 10px;border-radius:10px;line-height:1.45}
.mg-kamu{max-width:78%}
.mg.panjang .isiP{display:block;max-height:240px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.mg.panjang.lengkap .isiP{max-height:none;-webkit-mask-image:none;mask-image:none}
.mlebih{display:block;margin-top:4px;font:600 11px system-ui,sans-serif;color:#8a5a1e;background:none;border:0;padding:0;cursor:pointer}
.mk{align-self:stretch;font-size:11.5px;border:1px dashed rgba(168,118,30,.5);border-radius:8px;background:rgba(255,250,235,.5)}
.mk summary{list-style:none;display:flex;align-items:center;gap:7px;padding:4px 9px;margin:0;cursor:pointer;color:var(--teks2)}
.mk summary::-webkit-details-marker{display:none}
.mk summary .ke{flex:none;font-weight:700;color:var(--kayu)}
.mk summary .r{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk summary::after{content:"lihat";flex:none;font-size:10.5px;color:#8a5a1e}.mk[open] summary::after{content:"tutup"}
.mk pre{margin:0 9px 8px;max-height:200px}
/* komposer: tujuan & saran masing-masing satu baris yg bisa digeser, lampiran ringkas */
.mkomposer{border-top:1px solid var(--garis);background:linear-gradient(transparent,rgba(255,250,235,.35))}
#mSesi,#mSaran.ada{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:5px;padding:6px 10px 2px;max-height:none;border-top:0;scrollbar-width:thin}
#mSesi .lbl2,#mSaran .lbl2{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teks3);margin-right:1px}
.msc,.msr{flex:none;font-size:11.5px;padding:2px 9px}
.msr-ai{flex:none;margin-left:0;order:-1;font:700 10px/1 system-ui,sans-serif;padding:3px 7px;border-radius:999px}
#mLamp.ada{display:flex;padding:6px 10px 0;border-top:0;gap:6px}
.mli{width:40px;height:40px}
#mForm{border-top:0;padding:6px 10px 10px}
#mTeks{min-height:38px;border-radius:8px}
#mKirim{border-radius:8px}

#mLog{overflow-x:hidden}
.mtanya .msub{margin:3px 0 2px;padding-left:16px;list-style:disc}.mtanya .msub li{margin:1px 0}

/* ═════ SCROLLBAR BERTEMA (semua area scroll) ═════
   Chrome/Edge >= 121 MENGABAIKAN ::-webkit-scrollbar kalau scrollbar-width / scrollbar-color diisi (bukan auto),
   jadi properti standar hanya utk Firefox (@supports -moz). Tipis, track transparan, thumb kayu-emas membulat, tanpa panah. */
#mSesi,#mSaran.ada{scrollbar-width:auto;padding-bottom:4px}
::-webkit-scrollbar{width:9px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#c79a4e,#8a5a28);border-radius:999px;border:2px solid transparent;background-clip:padding-box;min-height:30px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(135deg,#e2b456,#a8761e);border-width:1px;background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:#7a4c20}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:#a8762e transparent}}

/* ═════ GAYA A: KAYU / KERTAS PREMIUM ═════
   Kedalaman berlapis, pita kepala perkamen bergaris emas ganda, judul kapital kecil, kartu agen bersegel inisial,
   animasi mikro ringan (hover, pesan baru, cincin "kerja", titik "berpikir"). Hanya panel; peta desa tak disentuh. */
.panel{box-shadow:inset 0 0 0 1px #c9a24a,inset 0 0 0 4px rgba(255,248,225,.32),inset 0 0 0 5px rgba(168,118,30,.18),inset 0 0 38px rgba(150,100,40,.26),0 2px 0 #2a1a0c,0 16px 36px rgba(20,10,0,.48)}
#kiri header,.mjudul,#perlu .pkep{background:linear-gradient(180deg,#fdf6e2 0%,#f3e3bc 100%);border-bottom:1px solid #c9a24a;box-shadow:inset 0 -3px 0 -2px rgba(255,250,235,.95),0 1px 0 rgba(90,59,34,.12);position:relative}
#kiri header::after,.mjudul::after{content:"";position:absolute;left:14px;right:14px;bottom:-4px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,74,.75),transparent);pointer-events:none}
#kiri h1{font-size:20px;font-variant:small-caps;letter-spacing:.05em}
.mjudul b{font-variant:small-caps;letter-spacing:.06em;font-size:16px}
#perlu .pkep>span:nth-child(2){font-variant:small-caps;letter-spacing:.05em;font-size:14px}
.grp{font-variant:small-caps;text-transform:none;font-size:12px;letter-spacing:.07em}
/* ikon SVG seragam (16px, currentColor) */
.ik{width:14px;height:14px;display:inline-block;vertical-align:-2px;flex:none}
.tutup .ik,.mmenub .ik{width:15px;height:15px}
.mjudul .tutup,#pakaiRinci .tutup,#kanan .tutup{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:6px;font-size:0;color:var(--kayu)}
.mjudul .tutup:hover,#pakaiRinci .tutup:hover,#kanan .tutup:hover{background:rgba(168,50,40,.12);color:#9a2a20}
.mmenub{display:inline-flex;align-items:center;justify-content:center;font-size:0}
/* kartu agen: segel inisial + nama + aktivitas terakhir */
.item.kartu{gap:10px;padding:7px 9px;border-radius:9px;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.item.kartu:hover{transform:translateX(2px);background:rgba(255,250,235,.7);box-shadow:0 1px 0 rgba(90,59,34,.12)}
.item.kartu.pilih{background:linear-gradient(90deg,rgba(240,204,106,.32),rgba(255,250,235,.4));box-shadow:inset 3px 0 0 #c9a24a}
.ava{position:relative;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 11.5px/1 var(--serif);letter-spacing:.02em;color:#fff8e6;text-shadow:0 1px 1px rgba(0,0,0,.45);
  background:radial-gradient(circle at 32% 28%,hsl(var(--h) 55% 58%),hsl(var(--h) 52% 36%) 62%,hsl(var(--h) 55% 24%));box-shadow:0 0 0 2px #fbf2dc,0 0 0 4px var(--st,#a39a88),0 2px 4px rgba(40,20,0,.35)}
.ava.st-jalan{--st:var(--st-kerja)}.ava.st-menunggu{--st:var(--st-tunggu)}.ava.st-diam{--st:var(--st-diam)}.ava.st-selesai{--st:var(--st-mati)}
.ava.st-jalan::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--st-kerja);animation:denyutKerja 1.8s ease-out infinite}
@keyframes denyutKerja{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.item.kartu .isiK{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item.kartu .nm{font-size:13px;font-weight:600;color:var(--teks)}
.item.kartu .akt{font-size:11px;color:var(--teks3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.kartu .kananK{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.item.kartu.arsip{padding:4px 9px}.item.kartu.arsip .ava{width:22px;height:22px;font-size:9px;box-shadow:0 0 0 2px #fbf2dc,0 0 0 3px var(--st)}
.item.kartu.arsip .akt{display:none}.item.kartu.arsip .nm{font-weight:400;font-size:12.5px}
/* strip usage */
#pakai{border:1px solid #d3b886;background:linear-gradient(rgba(255,252,242,.85),rgba(246,232,200,.6));box-shadow:inset 0 1px 0 #fffaf0,0 1px 2px rgba(90,59,34,.12)}
.pkb>span:first-child{font-variant:small-caps;letter-spacing:.04em;font-size:11.5px}
.pkbar{height:7px;background:rgba(90,59,34,.12);box-shadow:inset 0 1px 2px rgba(60,40,10,.25)}
.pkbar i{background-image:linear-gradient(rgba(255,255,255,.35),transparent 60%)!important;background-blend-mode:normal}
/* panel Chat: pesan baru masuk, titik berpikir, kotak ketik */
.anim-masuk{animation:masukPesan .32s cubic-bezier(.2,.8,.3,1)}
@keyframes masukPesan{from{opacity:0;transform:translateY(8px) scale(.985)}}
.ketik{display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle}.ketik i{width:4px;height:4px;border-radius:50%;background:var(--st-kerja);animation:ketikTitik 1s infinite}
.ketik i:nth-child(2){animation-delay:.15s}.ketik i:nth-child(3){animation-delay:.3s}
@keyframes ketikTitik{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}
.mg{box-shadow:0 1px 0 rgba(90,59,34,.1),0 2px 6px rgba(90,59,34,.06)}
.mg-master{background:linear-gradient(#fffdf6,#fbf3df)}
.mg-kamu{box-shadow:0 1px 0 rgba(90,59,34,.2),0 2px 6px rgba(140,90,20,.15)}
#mTeks{box-shadow:inset 0 1px 3px rgba(90,59,34,.18);transition:border-color .15s,box-shadow .15s}
#mTeks:focus{outline:none;border-color:#c9a24a;box-shadow:inset 0 1px 3px rgba(90,59,34,.18),0 0 0 3px rgba(232,196,106,.35)}
#mKirim{display:inline-flex;align-items:center;gap:6px;transition:filter .12s,transform .08s}#mKirim:hover{filter:brightness(1.08)}#mKirim:active{transform:translateY(1px)}
.msc,.msr,.mop,.mbtn,.qpr,.qchip{transition:background .15s,border-color .15s,transform .1s}
.msc:hover,.msr:hover,.mop:hover{transform:translateY(-1px)}
/* tab riwayat: tab perkamen dgn garis emas di atas tab aktif */
#mTab button{border-radius:8px 8px 0 0;background:rgba(245,232,200,.55);transition:background .15s}
#mTab button.on{background:linear-gradient(#fffaf0,#f6e7c2);color:var(--kayu2);box-shadow:inset 0 2px 0 #c9a24a}
/* Perlu jawaban: kartu dgn garis aksen per jenis */
.pit{border-left:3px solid transparent;transition:background .15s}
.pit:has(.jn-tanya){border-left-color:#e2b456}.pit:has(.jn-izin){border-left-color:#d8806a}
.pit .x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-size:0}
.pit .x:hover{background:rgba(168,50,40,.12);color:#9a2a20}

/* ═════ "Perlu jawabanmu" menyatu di atas panel kiri: tak pernah tertimpa panel lain ═════ */
#perlu{position:static;left:auto;top:auto;right:auto;bottom:auto;transform:none;width:auto;z-index:auto;margin:8px 10px 2px;padding:0;
  border:1px solid #d9a83a;border-radius:10px;background:linear-gradient(#fff8e2,#fbecc4);box-shadow:inset 0 1px 0 #fffdf4,0 2px 6px rgba(140,90,20,.18);overflow:hidden;flex:none}
#perlu::before,#perlu::after{display:none}
#perlu .pkep{padding:6px 10px;background:linear-gradient(180deg,#fff6dc,#f6e0a8);border-bottom:1px solid rgba(201,162,74,.6);box-shadow:none}
#perlu .pkep .ket{font-size:10.5px}
#perlu .pdaf{max-height:210px;border-top:0}
#perlu .pit{padding:6px 8px 6px 9px}
#perlu .pit .isi .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
#perlu .pit .isi b{font-size:12px}
@media (max-width:820px){#perlu{left:auto;right:auto;width:auto;top:auto;bottom:auto}}
#perlu .pkep{flex-wrap:nowrap;white-space:nowrap}#perlu .pkep>span:nth-child(2){font-size:13px;white-space:nowrap}#perlu .pkep .ket{margin-left:auto;white-space:nowrap}

/* ═ CHAT ALA APLIKASI: baris per pengirim (avatar + nama + jam), gelembung kiri/kanan, markdown, font sans ═ */
:root{--chat:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
#master{width:440px}
#mLog{font-family:var(--chat);gap:0;padding:6px 12px 14px;background:radial-gradient(circle at 20% 0,rgba(255,252,240,.55),transparent 60%)}
#mTeks{font:400 14px/1.45 var(--chat)}
.mtgl{align-self:center;margin:12px 0 4px;padding:3px 11px;border-radius:999px;font:700 10.5px/1.4 var(--chat);letter-spacing:.03em;color:var(--teks3);background:rgba(255,250,235,.75);border:1px solid var(--garis)}
.mrow{display:flex;gap:8px;align-items:flex-start;margin-top:12px;min-width:0}
.mrow.lanjut{margin-top:3px}
.mrow.kanan{justify-content:flex-end}
.mava{flex:none;width:32px}
.mava .ava{width:32px;height:32px;font:800 11.5px/1 var(--chat);box-shadow:0 0 0 2px #fbf2dc,0 2px 4px rgba(40,20,0,.3)}
.mava .ava.mcm{background:radial-gradient(circle at 34% 30%,#e0575a,#a3222e 58%,#6e1219);color:#ffe9b8;box-shadow:0 0 0 2px #e8c46a,0 2px 5px rgba(80,10,10,.4)}
.mkol{display:flex;flex-direction:column;min-width:0;max-width:82%}
.mrow.kanan .mkol{align-items:flex-end;max-width:80%}
.mkep{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 2px 4px;font:800 12.5px/1.3 var(--chat);color:var(--kayu2)}
.mkep .mjam,.mkaki{font:600 10.5px/1.3 var(--chat);color:var(--teks3)}
.mkep .mvia{display:inline-flex;align-items:center;gap:3px;font:600 10.5px/1.3 var(--chat);color:var(--teks3)}.mkep .mvia .ik{width:11px;height:11px}
.mnama.chip{padding:1px 9px;border-radius:999px;background:hsl(var(--h) 48% 88%);border:1px solid hsl(var(--h) 38% 62%);color:hsl(var(--h) 50% 24%)}
.mkaki{display:flex;align-items:center;gap:5px;margin:3px 3px 0}
.mkaki .ke{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:999px;background:rgba(212,164,71,.2);color:#7a4a10;font-weight:700}
.mkol .mg{max-width:100%;margin:0;padding:8px 12px;border-radius:15px;font:400 14px/1.55 var(--chat);white-space:normal;word-break:break-word;color:var(--teks)}
.mrow.kiri:not(.lanjut) .mg{border-top-left-radius:4px}.mrow.kanan:not(.lanjut) .mg{border-top-right-radius:4px}
.mkol .mg-kamu{border-bottom-right-radius:15px;color:#2a1a0c}
.mkol .mg-master,.mkol .mg-masuk{border-bottom-left-radius:15px}
.mg p{margin:0 0 .55em}.mg p:last-child,.mg>*:last-child{margin-bottom:0}
.mg ul,.mg ol{margin:.15em 0 .6em;padding-left:1.35em}.mg li{margin:.18em 0;padding-left:.1em}.mg li>ul,.mg li>ol{margin:.18em 0 .25em}
.mg ul{list-style:disc}.mg ul ul{list-style:circle}.mg ul ul ul{list-style:square}.mg li::marker{color:#a8761e}
.mg .mh{font:800 14.5px/1.35 var(--chat);color:var(--kayu2);margin:.75em 0 .3em}.mg .mh:first-child{margin-top:0}.mg .mh1{font-size:16px}.mg .mh2{font-size:15px}
.mg b{font-weight:800;color:var(--kayu2)}.mg-kamu b{color:inherit}
.mg code{font:12.5px/1.4 ui-monospace,"Cascadia Code",Consolas,monospace;background:rgba(90,59,34,.1);padding:1px 4px;border-radius:4px}
.mg code{overflow-wrap:anywhere}.mkode pre code{overflow-wrap:normal}
.mg .mcopy{cursor:copy;border-bottom:1px dashed rgba(168,118,30,.6)}.mg .mcopy:hover{background:rgba(232,196,106,.35)}
.mg .mcopy.tersalin{background:rgba(63,174,90,.22);border-bottom-color:transparent}
.mg a{color:#2f6fb5;text-decoration:underline;text-underline-offset:2px}
.mg hr{border:0;border-top:1px dashed rgba(90,59,34,.3);margin:.7em 0}
.mg blockquote{margin:.3em 0 .6em;padding:2px 0 2px 10px;border-left:3px solid #d9b46a;color:var(--teks2)}
.mkode{position:relative;margin:.35em 0 .7em}.mkode pre{margin:0;max-height:320px;overflow:auto;padding:9px 11px;border-radius:9px;background:#2e2318;border:1px solid #1b140d;color:#f6e9cc;font:12.5px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;white-space:pre}
.mkode pre code{background:none;padding:0;font:inherit;color:inherit}
.mkode .msalin{position:absolute;top:6px;right:7px;font:700 10.5px/1.4 var(--chat);padding:1px 8px;border-radius:6px;border:1px solid rgba(246,233,204,.35);background:rgba(246,233,204,.12);color:#f6e9cc;cursor:pointer;opacity:.75}
.mkode .msalin:hover{opacity:1;background:rgba(246,233,204,.22)}.mkode .msalin.tersalin{background:#3fae5a;border-color:#3fae5a;opacity:1}
.mtabel{overflow-x:auto;margin:.35em 0 .7em}.mtabel table{border-collapse:collapse;font-size:13px;line-height:1.4;min-width:100%}
.mtabel th,.mtabel td{border:1px solid rgba(90,59,34,.22);padding:4px 8px;text-align:left;vertical-align:top}
.mtabel th{background:rgba(212,164,71,.2);font-weight:800;color:var(--kayu2)}.mtabel tr:nth-child(even) td{background:rgba(255,250,235,.55)}
.mg .mtanya{font-size:13.5px;margin:.55em 0 .35em}.mg .mtanya li{white-space:normal}.mg .mtanya ol{padding-left:1.3em}
.mg .mtanya .mtj{font-family:var(--chat);font-weight:800;font-size:12px}
.mop{font-family:var(--chat);font-size:12.5px}
/* lipatan pintar: paragraf pembuka + blok pertanyaan selalu tampil, rincian dilipat */
.mlipat{position:relative;margin:.2em 0 .5em;border-top:1px dashed rgba(168,118,30,.35);padding-top:.45em}
.mlipat .isiL{max-height:7.8em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.mlipat.buka .isiL{max-height:none;-webkit-mask-image:none;mask-image:none}
.mlipat .mlebih{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin:2px 0 0;padding:4px 0;border:1px solid rgba(168,118,30,.35);border-radius:8px;background:rgba(255,246,220,.85);font:700 11.5px/1.3 var(--chat);color:#8a5a1e;cursor:pointer}
.mlipat .mlebih:hover{background:#ffe7a8}.mlipat .mlebih .ik{width:12px;height:12px;transition:transform .15s}.mlipat.buka .mlebih .ik{transform:rotate(180deg)}
/* Master sedang mengetik */
.mketik{display:inline-flex;align-items:center;gap:8px;color:var(--teks3);font-size:12.5px}
.titik{display:inline-flex;gap:4px}.titik i{width:7px;height:7px;border-radius:50%;background:#b8913a;animation:ketikTitik 1.1s infinite}
.titik i:nth-child(2){animation-delay:.16s}.titik i:nth-child(3){animation-delay:.32s}
.mrow+.mk,.mrow+.mx{margin-top:8px}.mk+.mrow,.mx+.mrow{margin-top:10px}
#mLog>.mk,#mLog>.mx{margin-top:6px;font-family:var(--chat)}
.mkosong{font-family:var(--chat);font-size:13.5px}
.mriwket{font-family:var(--chat)}
.mg .gbr{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
/* HUD ala Harvest Moon: kotak biru gelap pojok kanan atas (musim, hari, jam) */
#hud{position:fixed;right:14px;top:12px;z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:7px 12px 8px;min-width:132px;
  background:linear-gradient(#2a3f7a,#162448);border:3px solid #f4e8c0;border-radius:6px;box-shadow:0 0 0 2px #1a2440,0 4px 12px rgba(0,0,0,.45);color:#fff;font:700 13px/1.3 "Lucida Console",Consolas,monospace;text-shadow:1px 1px 0 #0a1230;image-rendering:pixelated}
#hud b{color:#ffe08a;font-size:12px;letter-spacing:.03em}#hud span{font-size:11.5px;color:#d8e4ff;font-weight:400}#hud i{font-style:normal;font-size:17px;letter-spacing:.06em}
#peta{bottom:12px}
#master{bottom:242px}
/* mode kilat: saklar di baris tujuan + penanda di pesan */
.mkilat{display:inline-flex;align-items:center;gap:3px;font:700 11px/1.5 var(--chat);padding:1px 9px 1px 6px;border-radius:999px;border:1px solid #b89a6a;background:rgba(255,250,235,.6);color:var(--teks3);cursor:pointer;margin-right:2px}
.mkilat .ik{width:12px;height:12px}.mkilat:hover{background:#ffe7a8}
.mkilat.on{background:linear-gradient(#ffe27a,#f0b830);border-color:#a8761e;color:#3a2006;box-shadow:0 0 0 2px rgba(240,184,48,.3)}
.mkaki .ke.kilat,.mk .ke .kl{color:#a8620e}.mkaki .ke.kilat{background:rgba(240,184,48,.28)}
.mkaki .ke .ik,.mk .kl .ik{width:11px;height:11px}

/* ═ TEMA UI ala Harvest Moon: Back to Nature (menimpa tema perkamen-kayu): kotak krem membulat bergaris coklat tua,
   garis putih tipis di dalam, teks coklat gelap, tombol krem, tombol aktif kuning. Tanpa permata sudut kayu. ═ */
:root{--panel:#f7efd6;--garis:rgba(74,44,20,.28);--teks:#2a1a0c;--teks2:#4a3018;--teks3:#7a5a38;--emas:#8a5a1e;--emas2:#f0d070;--kayu:#3a2412;--kayu2:#2a1a0c;--hm-tepi:#2e1c0e;--hm-dalam:#fffaf0;--hm-kuning:#f8d860;--hm-biru:#5a8ad8}
html,body{background:#78b8e8}
.panel{background:var(--panel);border:3px solid var(--hm-tepi);border-radius:8px;box-shadow:inset 0 0 0 2px var(--hm-dalam),0 4px 0 rgba(30,15,5,.35),0 6px 14px rgba(0,0,0,.25)}
.panel::before,.panel::after{display:none}
#kiri h1{font:800 20px/1.1 "Nunito","Segoe UI",system-ui,sans-serif;letter-spacing:.02em;color:var(--teks);text-shadow:none}
#kiri h1 a{font:700 11px/1.4 "Nunito",system-ui,sans-serif;background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:6px;padding:1px 7px;color:var(--teks2);text-decoration:none}
#kiri h1 a:hover{background:var(--hm-kuning)}
.grp{font:800 11px/1.2 "Nunito",system-ui,sans-serif;letter-spacing:.08em;color:var(--teks2);text-transform:uppercase}
.grp::after{background:rgba(46,28,14,.25)}
.item{border-radius:6px}.item.kartu:hover{background:rgba(248,216,96,.35)}.item.kartu.pilih{background:rgba(248,216,96,.55);box-shadow:inset 3px 0 0 var(--hm-tepi)}
.item.kartu .nm{color:var(--teks)}.item.kartu .akt{color:var(--teks3)}
.ava{box-shadow:0 0 0 2px var(--hm-dalam),0 0 0 4px var(--st,#a39a88),0 2px 3px rgba(40,20,0,.3)}
.tab,#kontrol button,#saranHemat button{font:700 12.5px/1.3 "Nunito",system-ui,sans-serif;color:var(--teks);background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:7px;box-shadow:inset 0 -3px 0 rgba(74,44,20,.18),0 2px 0 var(--hm-tepi);text-shadow:none}
.tab:hover,#kontrol button:hover,#saranHemat button:hover{filter:none;background:#fff4c0}
.tab:active,#kontrol button:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(74,44,20,.18),0 0 0 var(--hm-tepi)}
.tab.on,#kontrol button.on,#saranHemat button#bSaranYa{background:var(--hm-kuning);color:var(--teks);border-color:var(--hm-tepi);text-shadow:none}
#kontrol{background:var(--panel);border-color:var(--hm-tepi)}
#kontrol .bantu{color:var(--teks3)}
#kontrol #bMaster{background:var(--hm-biru);color:#fff;border-color:var(--hm-tepi)}#kontrol #bMaster:hover{background:#6c9ce6}
#kontrol #bMaster.baru::after{box-shadow:0 0 0 2px var(--hm-dalam)}
#pakai{border:2px solid var(--hm-tepi);background:var(--hm-dalam);box-shadow:none;border-radius:7px}
.pkbar{background:rgba(46,28,14,.15);box-shadow:none;border:1px solid var(--hm-tepi)}
/* label di atas kepala & gelembung: kotak dialog krem bergaris gelap */
.lbl .nama{background:var(--hm-dalam);color:var(--teks);font:800 11px/1.3 "Nunito",system-ui,sans-serif;border:2px solid var(--hm-tepi);border-radius:6px;box-shadow:0 2px 0 rgba(30,15,5,.35);text-shadow:none;padding:1px 7px 1px 4px}
.lbl .gel{background:var(--hm-dalam);color:var(--teks);border:2px solid var(--hm-tepi);border-radius:7px;box-shadow:0 2px 0 rgba(30,15,5,.35);font:600 11px/1.3 "Nunito",system-ui,sans-serif}
.lbl .gel::after{border-top-color:var(--hm-tepi)}
.lbl .pb{background:var(--hm-dalam);border:1.5px solid var(--hm-tepi)}.lbl .pb i{background:var(--hm-kuning)}
.lbl.pilih .nama{outline:2px solid var(--hm-kuning);outline-offset:1px}
.bangun{background:var(--hm-dalam);color:var(--teks);font:800 12px/1.2 "Nunito",system-ui,sans-serif;border:2px solid var(--hm-tepi);border-radius:6px;box-shadow:0 2px 0 rgba(30,15,5,.35);text-shadow:none}
.lblSlime{background:var(--hm-dalam);color:#b8322a;border:2px solid var(--hm-tepi);border-radius:5px}
#tip{background:var(--hm-dalam);color:var(--teks);border:2px solid var(--hm-tepi);border-radius:7px;box-shadow:0 2px 0 rgba(30,15,5,.35)}
/* peta mini: bingkai krem */
#peta{padding:6px}#peta canvas{border:2px solid var(--hm-tepi);border-radius:50%;background:#5c8a48}
#peta .kaki{font:700 11px/1.4 "Nunito",system-ui,sans-serif;color:var(--teks2)}
/* panel Chat Master: kotak dialog HM */
.mjudul{background:var(--hm-kuning);border-bottom:2px solid var(--hm-tepi)}.mjudul b{font:800 15px/1.2 "Nunito",system-ui,sans-serif;color:var(--teks);letter-spacing:0}
.mjudul .tutup{color:var(--teks)}
#mTab{background:var(--panel)}#mTab button{font:700 12px/1.3 "Nunito",system-ui,sans-serif;color:var(--teks2);border-bottom:2px solid transparent}#mTab button.on{color:var(--teks);border-bottom-color:var(--hm-tepi)}
#mLog{background:var(--panel)}
.mkol .mg{border:2px solid var(--hm-tepi);border-radius:10px;box-shadow:0 2px 0 rgba(30,15,5,.3)}
.mkol .mg-master{background:var(--hm-dalam)}.mkol .mg-masuk{background:#e6f4dc}.mkol .mg-kamu{background:#fff0a8;border-color:var(--hm-tepi);color:var(--teks)}
.mg b{color:var(--teks)}.mkep{color:var(--teks)}
.mtanya{background:#fff4c0;border:2px solid var(--hm-tepi);border-left-width:4px;border-radius:7px}.mtanya .mtj{color:#8a4a0e}
.mop{border:2px solid var(--hm-tepi);background:var(--hm-dalam);color:var(--teks)}.mop:hover{background:#fff4c0}.mop.on{background:var(--hm-kuning);border-color:var(--hm-tepi);color:var(--teks)}
.mop.rek{border-color:var(--hm-tepi);box-shadow:0 0 0 2px rgba(248,216,96,.6)}
.msc{border:2px solid var(--hm-tepi);background:var(--hm-dalam);color:var(--teks2)}.msc.on{background:var(--hm-kuning);color:var(--teks);border-color:var(--hm-tepi)}
.msr{border:2px solid var(--hm-tepi);background:var(--hm-dalam);color:var(--teks2)}.msr:hover{background:#fff4c0}
.mkilat{border:2px solid var(--hm-tepi);background:var(--hm-dalam)}.mkilat.on{background:var(--hm-kuning);border-color:var(--hm-tepi);box-shadow:none;color:var(--teks)}
#mTeks{background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:7px;color:var(--teks);box-shadow:none}
#mKirim{background:var(--hm-biru);color:#fff;border:2px solid var(--hm-tepi);border-radius:7px;font:800 13px/1.2 "Nunito",system-ui,sans-serif;box-shadow:0 2px 0 var(--hm-tepi)}#mKirim:hover{background:#6c9ce6}
.mkomposer{background:var(--panel);border-top:2px solid var(--hm-tepi)}
.mk{border:2px dashed rgba(46,28,14,.45);background:var(--hm-dalam)}
#perlu{background:#fff0a8;border:2px solid var(--hm-tepi);border-radius:7px}#perlu .pkep{color:var(--teks);font:800 13px/1.2 "Nunito",system-ui,sans-serif}
#perlu .jml{background:#d8403a;color:#fff;border:2px solid var(--hm-tepi)}
.pit{background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:6px}
#kanan h2,#pakaiRinci h2{font:800 16px/1.3 "Nunito",system-ui,sans-serif;color:var(--teks)}
pre{background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:7px;color:var(--teks)}
#quest select,#qCari{background:var(--hm-dalam);border:2px solid var(--hm-tepi);border-radius:6px;color:var(--teks)}
.qpr.on,.qg.pilih{border-color:var(--hm-tepi);background:rgba(248,216,96,.5)}
.qchip{border:2px solid var(--hm-tepi);background:var(--hm-dalam);color:var(--teks2)}.qchip.on{background:var(--hm-kuning);color:var(--teks);border-color:var(--hm-tepi)}
/* scrollbar krem */
*{scrollbar-color:#8a6a48 #efe4c8}
::-webkit-scrollbar-thumb{background:#8a6a48;border:2px solid #efe4c8}::-webkit-scrollbar-track{background:#efe4c8}
/* HUD persis ala BTN: ikon musim + "15 Kam" + "PM 12:30", kotak krem bergaris gelap */
#hud{position:fixed;right:14px;top:12px;z-index:9;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;min-width:150px;
  background:var(--panel);border:3px solid var(--hm-tepi);border-radius:8px;box-shadow:inset 0 0 0 2px var(--hm-dalam),0 4px 0 rgba(30,15,5,.35);color:var(--teks);text-shadow:none;image-rendering:pixelated}

#hud .isi{display:flex;flex-direction:column;align-items:flex-end;gap:0}
#hud b{font:800 15px/1.2 "Lucida Console",Consolas,"Courier New",monospace;color:var(--teks);letter-spacing:.04em}
#hud i{font:800 19px/1.2 "Lucida Console",Consolas,"Courier New",monospace;font-style:normal;color:var(--teks);letter-spacing:.06em}

#saranHemat{display:none!important}

/* ═ UI PACK ala HM BTN (referensi UI pack user, dibuat ulang): panel krem-tan bergradasi, tepi coklat sedang + garis luar
   coklat tua + garis terang di dalam, sudut bulat kecil; judul di pita tan lebih gelap; pilihan = biru muda + sarung tangan;
   font game Pixelify Sans (OFL, lokal) untuk judul/HUD/tombol/label, isi teks panjang tetap Nunito. ═ */
:root{--ui-a:#f4e2b4;--ui-b:#e6c88e;--ui-tepi:#a8783e;--ui-luar:#4a2c12;--ui-terang:#fff4d6;--ui-pita:#d9b574;--ui-pilih:#b4d2f6;--ui-pilih-t:#3f74c8;
  --ui-slot:#e8cc94;--ui-slot-t:#b08850;--px:"Pixelify Sans","Nunito",system-ui,sans-serif;--panel:#f0dcaa;--hm-dalam:#fff6dc;--teks:#2e1a08;--teks2:#4e3216;--teks3:#7e5c34}
html,body{cursor:var(--kursor)}
button,a,.item,.tab,.qpr,.qg,.qchip,.mop,.msc,.msr,.mkilat,#peta canvas,select,label{cursor:var(--kursor)!important}
textarea,input[type=text],input[type=search],input:not([type]){cursor:text}
.panel,#hud,#tip,.notif,#kontrol{background:linear-gradient(180deg,var(--ui-a),var(--ui-b));border:3px solid var(--ui-tepi);border-radius:7px;
  box-shadow:0 0 0 2px var(--ui-luar),inset 0 0 0 2px var(--ui-terang),0 5px 0 2px rgba(40,20,4,.35)}
/* judul & pita */
#kiri h1{font:700 21px/1.1 var(--px);letter-spacing:.02em;color:var(--teks)}
#kiri h1 a{font:600 11px/1.5 var(--px);background:var(--ui-slot);border:2px solid var(--ui-tepi);border-radius:5px;box-shadow:0 2px 0 var(--ui-luar)}
#kiri h1 a:hover{background:var(--ui-pilih);border-color:var(--ui-pilih-t)}
.grp{font:700 12px/1.2 var(--px);letter-spacing:.06em;color:var(--teks);background:var(--ui-pita);border:2px solid var(--ui-tepi);border-radius:5px;padding:3px 8px 3px 20px;position:relative;margin:10px 2px 6px}
.grp::before{content:"";position:absolute;left:7px;top:50%;margin-top:-5px;border:5px solid transparent;border-right:7px solid #c8322a;border-left:0}
.grp::after{display:none}
#kanan h2,#pakaiRinci h2{font:700 17px/1.3 var(--px);color:var(--teks);background:var(--ui-pita);border:2px solid var(--ui-tepi);border-radius:5px;padding:3px 10px}
/* kartu daftar = baris menu; terpilih = biru muda + sarung tangan menunjuk */
.item.kartu{border:2px solid transparent;border-radius:6px}
.item.kartu:hover{background:rgba(255,246,220,.7);border-color:var(--ui-slot-t)}
.item.kartu.pilih{background:var(--ui-pilih);border-color:var(--ui-pilih-t);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);padding-left:34px;position:relative}
.item.kartu.pilih::before{content:"";position:absolute;left:3px;top:50%;width:28px;height:21px;margin-top:-10px;background:var(--sarung) center/contain no-repeat;animation:tunjuk 1s ease-in-out infinite}
@keyframes tunjuk{50%{transform:translateX(3px)}}
.item.pin{background:rgba(255,246,220,.55);border:2px solid var(--ui-slot-t)}
.item .nm{font-weight:700}
.ava{box-shadow:0 0 0 2px var(--ui-terang),0 0 0 4px var(--st,#a39a88),0 2px 0 4px rgba(74,44,18,.35)}
/* tab = tombol menu */
.tab{font:700 14px/1.2 var(--px);background:var(--ui-slot);border:2px solid var(--ui-tepi);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(120,80,30,.2),0 2px 0 var(--ui-luar);color:var(--teks)}
.tab.on{background:var(--ui-pilih);border-color:var(--ui-pilih-t);color:#14284a}
.tab:hover{background:#f6e4bc}.tab.on:hover{background:#c4dcf8}
#pakai{background:var(--ui-terang);border:2px solid var(--ui-tepi);border-radius:6px;box-shadow:inset 0 2px 0 rgba(120,80,30,.15)}
.pkbar{background:#d8bc84;border:2px solid var(--ui-luar);border-radius:3px}
/* hotbar bawah: tombol = slot persegi berikon, label kecil di bawah */
#kontrol{padding:8px 10px 6px;gap:6px;align-items:flex-end}
#kontrol button{font:600 11.5px/1.15 var(--px);color:var(--teks);background:var(--ui-slot);border:2px solid var(--ui-slot-t);border-radius:6px;min-width:64px;padding:38px 6px 5px;position:relative;
  box-shadow:inset 0 0 0 2px rgba(255,246,220,.55),0 2px 0 var(--ui-luar)}
#kontrol button::before{content:"";position:absolute;left:50%;top:5px;width:30px;height:30px;margin-left:-15px;background:center/contain no-repeat}
#kontrol button:hover{background:#f4e0b4;border-color:var(--ui-tepi)}
#kontrol button.on{background:var(--ui-pilih);border-color:var(--ui-pilih-t);color:#14284a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 2px var(--ui-pilih-t),0 2px 0 2px var(--ui-luar)}
#kontrol button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px rgba(255,246,220,.55)}
#kontrol #bMaster{background:#cfe0f8;border-color:var(--ui-pilih-t);color:#14284a}#kontrol #bMaster:hover{background:#dcebfc}
#kontrol #bKontrol{min-width:28px;padding:6px 6px;align-self:stretch;font-size:13px;color:#c8322a}#kontrol #bKontrol::before{display:none}
#kontrol .bantu{font:500 11px/1.3 var(--px);color:var(--teks3)}
/* HUD kanan atas */
#hud{flex-direction:column;align-items:stretch;gap:5px;padding:7px 10px 7px 8px;min-width:200px}
#hud .hbaris{display:flex;align-items:center;gap:9px}
#hud .hlangit{width:44px;height:40px;flex:none;border:2px solid var(--ui-tepi);border-radius:4px;background:linear-gradient(#5aa0e8,#a8d4f6);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
#hud .hlangit .ikon{width:28px;height:28px;border-radius:3px}
#hud .isi{display:flex;flex-direction:column;align-items:stretch;gap:1px;flex:1}
#hud b{font:600 17px/1.15 var(--px);color:var(--teks);letter-spacing:.02em;display:flex;justify-content:space-between;gap:10px}
#hud i{font:600 21px/1.1 var(--px);font-style:normal;color:var(--teks);letter-spacing:.03em;text-align:right}
#hud .h2{border-top:2px solid rgba(168,120,62,.5);padding-top:4px}
#hud .hkoin{width:22px;height:22px;flex:none}#hud .hkoin svg{width:100%;height:100%;display:block}
#hud .hjml{font:600 15px/1 var(--px);color:var(--teks);margin-left:auto}
#hud span{display:revert;color:inherit;font-size:inherit;font-weight:inherit}#hud .tgl{color:var(--teks2)}#hud .hbaris,#hud .isi{display:flex}#hud .hlangit{display:grid}
/* peta mini */
#peta .kaki{font:600 12px/1.4 var(--px);color:var(--teks)}
#peta canvas{border:3px solid var(--ui-tepi);box-shadow:0 0 0 2px var(--ui-luar)}
/* label dunia & gelembung = kotak dialog */
.lbl .nama{font:600 12px/1.25 var(--px);background:var(--ui-terang);border:2px solid var(--ui-tepi);box-shadow:0 0 0 1.5px var(--ui-luar),0 2px 0 1.5px rgba(40,20,4,.3)}
.lbl .gel{background:var(--ui-terang);border:2px solid var(--ui-tepi);box-shadow:0 0 0 1.5px var(--ui-luar)}
.lbl .gel::after{border-top-color:var(--ui-luar)}
.lbl.pilih .nama{background:var(--ui-pilih);border-color:var(--ui-pilih-t);outline:none}
.bangun{font:600 13px/1.2 var(--px);background:linear-gradient(#d8a868,#b8834a);color:#2a1606;border:2px solid #6a4020;box-shadow:0 0 0 1.5px var(--ui-luar),inset 0 1px 0 rgba(255,230,180,.6)}
/* Chat Master: jendela dialog */
.mjudul{background:var(--ui-pita);border-bottom:3px solid var(--ui-tepi)}
.mjudul b{font:700 17px/1.2 var(--px);color:var(--teks);padding-left:16px;position:relative}
.mjudul b::before{content:"";position:absolute;left:0;top:50%;margin-top:-6px;border:6px solid transparent;border-right:8px solid #c8322a;border-left:0}
#mTab button{font:600 13px/1.2 var(--px)}
#mTab button.on{color:var(--teks);border-bottom-color:var(--ui-pilih-t)}
#mLog{background:var(--ui-terang)}
.mkol .mg{border:2px solid var(--ui-tepi);border-radius:6px;box-shadow:0 0 0 1.5px var(--ui-luar),0 2px 0 1.5px rgba(40,20,4,.25)}
.mkol .mg-master{background:linear-gradient(180deg,#fbeccb,#f0d8a4)}.mkol .mg-masuk{background:linear-gradient(180deg,#eef6e0,#dcebc4)}.mkol .mg-kamu{background:linear-gradient(180deg,#e2eefc,#c8dcf6);border-color:var(--ui-pilih-t)}
.mtanya{background:#fff2c4;border:2px solid var(--ui-tepi);border-left:6px solid #c8322a;border-radius:6px}
.mtanya .mtj{font-family:var(--px);font-size:14px}
.mop,.msc,.msr,.mkilat{font-family:var(--px);font-weight:600;background:var(--ui-slot);border:2px solid var(--ui-slot-t);border-radius:6px;box-shadow:0 2px 0 var(--ui-luar)}
.mop:hover,.msr:hover{background:#f4e0b4}
.mop.on,.msc.on,.mkilat.on{background:var(--ui-pilih);border-color:var(--ui-pilih-t);color:#14284a}
.mop.rek{box-shadow:0 0 0 2px #f0c040,0 2px 0 2px var(--ui-luar)}
.mkomposer{background:linear-gradient(180deg,var(--ui-a),var(--ui-b));border-top:3px solid var(--ui-tepi)}
#mTeks{background:var(--ui-terang);border:2px solid var(--ui-tepi);border-radius:6px;box-shadow:inset 0 2px 0 rgba(120,80,30,.15)}
#mKirim{font:700 15px/1.2 var(--px);background:var(--ui-slot);color:var(--teks);border:2px solid var(--ui-tepi);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(120,80,30,.22),0 2px 0 var(--ui-luar)}
#mKirim:hover{background:var(--ui-pilih);border-color:var(--ui-pilih-t)}
.mk{background:var(--ui-terang);border:2px dashed var(--ui-slot-t)}
/* Perlu jawaban = kotak notifikasi kuning */
#perlu{background:linear-gradient(#fff2c4,#f6dc94);border:2px solid var(--ui-tepi);box-shadow:0 0 0 1.5px var(--ui-luar)}
#perlu .pkep{font:700 14px/1.2 var(--px)}
.pit{background:var(--ui-terang);border:2px solid var(--ui-slot-t)}
/* Quest QA */
.qpr,.qg{border:2px solid var(--ui-slot-t);background:var(--ui-slot);border-radius:6px}
.qpr.on,.qg.pilih{background:var(--ui-pilih);border-color:var(--ui-pilih-t)}
.qchip{font-family:var(--px);background:var(--ui-slot);border:2px solid var(--ui-slot-t)}.qchip.on{background:var(--ui-pilih);border-color:var(--ui-pilih-t);color:#14284a}
#quest select,#qCari{background:var(--ui-terang);border:2px solid var(--ui-tepi)}
pre{background:var(--ui-terang);border:2px solid var(--ui-slot-t)}
/* scrollbar tan: jempol bertepi coklat, alur krem */
*{scrollbar-color:#c49a5e #ead2a0}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#ead2a0;border-left:2px solid var(--ui-slot-t)}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#e0b878,#c49a5e);border:2px solid var(--ui-luar);border-radius:4px}
/* notifikasi kartu (atas tengah) */
#notifW{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.notif{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;min-width:220px;animation:notifMasuk .3s ease-out;transition:opacity .45s,transform .45s}
.notif.pergi{opacity:0;transform:translateY(-8px)}
.notif .nik{width:40px;height:40px;flex:none;background:var(--ui-terang);border:2px solid var(--ui-tepi);border-radius:5px;display:grid;place-items:center}
.notif .nik svg{width:32px;height:32px}
.notif .nisi{display:flex;flex-direction:column;gap:1px}
.notif b{font:700 15px/1.2 var(--px);color:var(--teks)}.notif .nisi span{font:500 13.5px/1.2 var(--px);color:var(--teks2)}
@keyframes notifMasuk{from{opacity:0;transform:translateY(-10px) scale(.96)}}
/* papan nama lokasi: papan kayu berpaku */
#papanLokasi{position:fixed;left:50%;top:14px;z-index:29;transform:translateX(-50%);pointer-events:none;opacity:0;
  font:700 26px/1 var(--px);color:#2a1404;letter-spacing:.04em;text-shadow:0 1px 0 rgba(255,230,180,.6);padding:10px 34px 11px;border-radius:5px;
  background:repeating-linear-gradient(180deg,rgba(90,50,20,0) 0 7px,rgba(90,50,20,.12) 7px 8px),linear-gradient(180deg,#e2b878,#c08a4c);
  border:3px solid #7a4a22;box-shadow:0 0 0 2px var(--ui-luar),inset 0 2px 0 rgba(255,236,190,.7),0 5px 0 2px rgba(40,20,4,.35)}
#papanLokasi::before,#papanLokasi::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#5a3416;box-shadow:inset 1px 1px 0 rgba(255,220,170,.5)}
#papanLokasi::before{left:10px}#papanLokasi::after{right:10px}
#papanLokasi.muncul{animation:papanMuncul .45s cubic-bezier(.2,1.4,.4,1) forwards}
#papanLokasi.pergi{animation:papanPergi .5s ease-in forwards}
@keyframes papanMuncul{from{opacity:0;transform:translate(-50%,-30px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes papanPergi{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-20px)}}
/* label agen yang bertumpuk disembunyikan (rapikanLabel); kerumunan "+N santai" di tepi kolam */
.lbl.sesak .isi{visibility:hidden}
.kerumunan{pointer-events:auto;cursor:var(--kursor);font:600 13px/1.2 var(--px);color:var(--teks);background:var(--ui-terang);border:2px solid var(--ui-tepi);border-radius:12px;
  padding:3px 10px;box-shadow:0 0 0 1.5px var(--ui-luar),0 2px 0 1.5px rgba(40,20,4,.3);white-space:nowrap}
.kerumunan b{color:#3f74c8;font-weight:700}.kerumunan:hover{background:var(--ui-pilih);border-color:var(--ui-pilih-t)}
</style>

// kamera: FIXED OBLIQUE / THREE-QUARTER TOP-DOWN ala HM:BTN (sering disebut "isometrik"): sudut tunduk ~35 derajat (kam.el 0.611; dulu 55, diminta user 20 derajat lebih landai ke arah -Z),
// diputar 65 derajat di sumbu vertikal (AZ_KAM: kamera dari timur-tenggara; dulu 45, user minta +20), kebun tampak diagonal,
// tidak bisa diputar pemain, perspektif tipis (FOV 32) sehingga hampir ortografis. VIEW = tinggi dunia terlihat di titik fokus pada zoom 1.
const camera = new THREE.PerspectiveCamera(32, 1, 1, 400);
const VIEW = 24;
const AZ_KAM = 65*Math.PI/180;   // +65 derajat (kamera dari timur-tenggara); 0 = lurus dari selatan
const kam = {target: V(0, 0, 8), az: AZ_KAM, azTuju: AZ_KAM, el: 0.611, zoom: 1, zoomTuju: 1, fokus: null, fokusPos: null};
const BATAS_KAM = {x0: -60, x1: 60, z0: -40, z1: 48};
function aturKamera(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  const h = VIEW/kam.zoom, d = (h/2)/Math.tan(camera.fov*Math.PI/360);
  camera.position.set(kam.target.x + Math.sin(kam.az)*Math.cos(kam.el)*d, Math.sin(kam.el)*d + 0.6, kam.target.z + Math.cos(kam.az)*Math.cos(kam.el)*d);
  camera.lookAt(kam.target.x, 0.6, kam.target.z);
}
// bayangan matahari: frustum ketat mengikuti area yg terlihat kamera, pusat di-snap ke grid texel (tak berkilau saat geser)
const _bx = V(0, 0, 0), _by = V(0, 0, 0), _bz = V(0, 0, 0), _bc = V(0, 0, 0);
function aturBayangan(){
  const a = innerWidth/innerHeight, h = VIEW/kam.zoom;
  const half = Math.min(90, Math.hypot(h*a, h/Math.sin(kam.el))/2 + 8), sc = matahari.shadow.camera;
  if (Math.abs(sc.right - half) > 0.01){ sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); }
  _bz.copy(ARAH_MATAHARI); _bx.set(0, 1, 0).cross(_bz).normalize(); _by.copy(_bz).cross(_bx);
  const texel = 2*half / matahari.shadow.mapSize.x, ux = Math.round(kam.target.dot(_bx)/texel)*texel, uy = Math.round(kam.target.dot(_by)/texel)*texel;
  _bc.copy(_bx).multiplyScalar(ux).addScaledVector(_by, uy).addScaledVector(_bz, kam.target.dot(_bz));
  matahari.target.position.copy(_bc); matahari.position.copy(_bc).addScaledVector(ARAH_MATAHARI, 140);
}

// ═════ MODE PS1 (opsional): target rendah -> kuantisasi 15-bit + dither -> layar ═════
const PS1 = {aktif: false, baris: 240, res: new THREE.Vector2(427, 240), goyang: {value: 0}, affin: {value: 0}, dither: {value: 0}, tint: {value: new THREE.Color(1, 1, 1)}, nyalaBaris: {value: 0}};
const RT = new THREE.WebGLRenderTarget(427, 240, {minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false, depthBuffer: true, stencilBuffer: false});
const LAYAR = {
  scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
  mat: new THREE.ShaderMaterial({
    uniforms: {tDiffuse: {value: RT.texture}, uRes: {value: PS1.res}, uDither: PS1.dither, uTint: PS1.tint, uBaris: PS1.nyalaBaris},
    depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uDither, uBaris; uniform vec3 uTint; varying vec2 vUv;
      float bayer2(vec2 a){ a = floor(a); return fract(a.x/2.0 + a.y*a.y*0.75); }
      float bayer4(vec2 a){ return bayer2(0.5*a)*0.25 + bayer2(a); }
      void main(){
        vec2 pix = floor(vUv * uRes);
        gl_FragColor = texture2D(tDiffuse, (pix + 0.5) / uRes);
        #include <colorspace_fragment>
        vec3 x = gl_FragColor.rgb * uTint;
        float d = (bayer4(pix) - 0.5) * uDither;
        x = floor(x * 31.0 + 0.5 + d) / 31.0;
        x *= 1.0 - uBaris * 0.18 * mod(pix.y, 2.0);
        gl_FragColor = vec4(clamp(x, 0.0, 1.0), 1.0);
      }`}),
};
LAYAR.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), LAYAR.mat));
let rasioPiksel = 1;
function ukuran(){

  renderer.setPixelRatio(PS1.aktif ? 1 : Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight);
  aturKamera();
}
addEventListener('resize', ukuran);
function renderPS1(){
  if (!PS1.aktif){ renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
  renderer.setRenderTarget(RT); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(LAYAR.scene, LAYAR.cam);
}
// patch shader opsional (mode PS1): snap verteks ke grid piksel target rendah (goyang) + tekstur afin. Di mode HD kedua uniform 0.
function ps1(m, kunci = ''){
  const lama = m.onBeforeCompile;
  if (kunci === 'tanah' || kunci === 'air') m.defines = {...(m.defines || {}), TANPA_AO: ''};   // bidang tanah/air tidak digelapkan
  m.onBeforeCompile = (sh, r) => {
    if (lama) lama(sh, r);
    sh.uniforms.uRes = {value: PS1.res}; sh.uniforms.uGoyang = PS1.goyang; sh.uniforms.uAffin = PS1.affin;
    sh.vertexShader = 'uniform vec2 uRes; uniform float uGoyang; varying float vAff; varying float vTinggi;\n#ifdef USE_MAP\nvarying vec2 vUvOk;\n#endif\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      { vec4 wa = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wa = instanceMatrix * wa;
        #endif
        vTinggi = (modelMatrix * wa).y; }
      { vec4 p = gl_Position; vec2 g = uRes * 0.5; vec2 s = floor(p.xy / p.w * g + 0.5) / g * p.w; p.xy = mix(p.xy, s, uGoyang); gl_Position = p; vAff = p.w; }
      #ifdef USE_MAP
        vUvOk = vMapUv; vMapUv *= gl_Position.w;
      #endif`);
    // onBeforeCompile menerima shader SEBELUM #include diurai -> ganti chunk map_fragment utuh
    const f = sh.fragmentShader.replace('#include <map_fragment>', `#ifdef USE_MAP
      vec4 sampledDiffuseColor = texture2D( map, mix(vUvOk, vMapUv / vAff, uAffin) );
      diffuseColor *= sampledDiffuseColor;
    #endif`);
    sh.fragmentShader = 'uniform float uAffin; varying float vAff; varying float vTinggi;\n#ifdef USE_MAP\nvarying vec2 vUvOk;\n#endif\n' + f.replace('#include <opaque_fragment>', `
      #ifndef TANPA_AO
        outgoingLight *= mix(0.74, 1.0, smoothstep(0.0, 1.15, vTinggi));   // AO kontak: bagian dekat tanah lebih gelap lembut
        { float rim = pow(1.0 - clamp(dot(normal, normalize(vViewPosition)), 0.0, 1.0), 2.6);
          outgoingLight += vec3(1.0, 0.86, 0.66) * rim * 0.18 * diffuseColor.rgb; }   // rim hangat di tepi siluet -> terasa empuk
      #endif
      #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'ps1' + kunci;
  return m;
}

// ═════ TEKSTUR PROSEDURAL HALUS (canvas 32-64 px, cat kartun: derau lembut + goresan) ═════
const WAKTU = {value: 0};
function kanvas(w, h, gambar){ const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); gambar(x, w, h); return c; }
function tekstur(c, srgb = true){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; }
const rngT = (s => () => (s = (s*16807) % 2147483647) / 2147483647)(777);
const px = (x, c, i, j, w = 1, h = 1) => { x.fillStyle = c; x.fillRect(i, j, w, h); };
const campur = (a, b, t) => a + (b-a)*t;
// value noise tileable -> Float32Array n*n, 0..1
function derau(n, sel, oktaf = 3){
  const out = new Float32Array(n*n); let amp = 1, tot = 0;
  for (let o = 0; o < oktaf; o++){
    const k = sel << o, kisi = Float32Array.from({length: k*k}, rngT);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const fx = x/n*k, fy = y/n*k, x0 = Math.floor(fx), y0 = Math.floor(fy), tx_ = fx-x0, ty = fy-y0;
      const sx = tx_*tx_*(3-2*tx_), sy = ty*ty*(3-2*ty), g = (i, j) => kisi[((j+k)%k)*k + ((i+k)%k)];
      out[y*n+x] += ((g(x0,y0)*(1-sx) + g(x0+1,y0)*sx)*(1-sy) + (g(x0,y0+1)*(1-sx) + g(x0+1,y0+1)*sx)*sy)*amp;
    }
    tot += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot; return out;
}
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function lukisDerau(x, n, d, warna){ const img = x.createImageData(n, n); for (let i = 0; i < n*n; i++){ const [r, g, b] = warna(d[i], i%n, Math.floor(i/n)); img.data[i*4] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255; } x.putImageData(img, 0, 0); }
// palet per musim (CSS hex): rumput [dasar, gelap, terang], daun pohon, bunga, langit
const PALET = {
  semi:  {rumput: ['#56b83a', '#45a02e', '#76d24c'], daun: 0x4fb048, daun2: 0x3a923a, bunga: '#f5a7c8', langit: 0x86cdf5},
  panas: {rumput: ['#45a233', '#38892a', '#62b848'], daun: 0x3d9a3a, daun2: 0x2f7d2e, bunga: '#f4d35e', langit: 0x6ab4f0},
  gugur: {rumput: ['#9db044', '#8a9a3a', '#b5c458'], daun: 0xd4812c, daun2: 0xc06a2a, bunga: '#e07a3c', langit: 0x8ec2e6},
  dingin:{rumput: ['#eef2f6', '#dfe6ee', '#f8fafc'], daun: 0xc9d8e6, daun2: 0x8a9ab0, bunga: '#ffffff', langit: 0xa9c6dc},
};
const TEX = {};
const TILE_PX = 32;
// tile rumput halus: derau lembut antara 3 warna palet + helai rumput kecil
function tileRumput(p, i){
  const [a, b, c] = [hex2(p[0]), hex2(p[1]), hex2(p[2])];
  return kanvas(TILE_PX, TILE_PX, (x, w, h) => { const d = derau(w, 4, 3);
    lukisDerau(x, w, d, v => v < 0.5 ? [campur(b[0], a[0], v*2), campur(b[1], a[1], v*2), campur(b[2], a[2], v*2)] : [campur(a[0], c[0], (v-.5)*2), campur(a[1], c[1], (v-.5)*2), campur(a[2], c[2], (v-.5)*2)]);
    for (let k = 0; k < (i ? 14 : 8); k++){ const u = rngT()*w, v = rngT()*h; x.strokeStyle = rngT() < 0.5 ? p[1] : p[2]; x.lineWidth = 1; x.beginPath(); x.moveTo(u, v); x.lineTo(u + (rngT()-.5)*2, v - 2 - rngT()*3); x.stroke(); } });
}
const tileDerau = (w1, w2, sel = 5, titik = 0, c1 = null, c2 = null) => kanvas(TILE_PX, TILE_PX, (x, w, h) => { const d = derau(w, sel, 3), A = hex2(w1), B = hex2(w2);
  lukisDerau(x, w, d, v => [campur(A[0], B[0], v), campur(A[1], B[1], v), campur(A[2], B[2], v)]);
  for (let k = 0; k < titik; k++){ x.fillStyle = rngT() < 0.5 ? c1 : c2; x.beginPath(); x.arc(rngT()*w, rngT()*h, 0.8 + rngT()*1.2, 0, 7); x.fill(); } });
TEX.tanah = tekstur(tileDerau('#c9b07c', '#dcc89a', 5, 22, '#b8a070', '#e6d4a8'));
TEX.jalan = tekstur(tileDerau('#bfa574', '#d1b98a', 5, 18, '#ad9466', '#dcc69c'));
TEX.ladang = tekstur(kanvas(TILE_PX, TILE_PX, (x, w, h) => { const d = derau(w, 6, 2); lukisDerau(x, w, d, v => [campur(118, 150, v), campur(76, 100, v), campur(38, 56, v)]);
  for (let r = 0; r < h; r += 8){ x.fillStyle = 'rgba(60,34,14,.55)'; x.fillRect(0, r, w, 2); x.fillStyle = 'rgba(190,140,90,.35)'; x.fillRect(0, r + 4, w, 1); } }));
TEX.ladangBasah = tekstur(kanvas(TILE_PX, TILE_PX, (x, w, h) => { const d = derau(w, 6, 2); lukisDerau(x, w, d, v => [campur(84, 110, v), campur(52, 70, v), campur(26, 38, v)]);
  for (let r = 0; r < h; r += 8){ x.fillStyle = 'rgba(40,22,8,.6)'; x.fillRect(0, r, w, 2); x.fillStyle = 'rgba(150,110,70,.3)'; x.fillRect(0, r + 4, w, 1); } }));
TEX.pakan = tekstur(kanvas(TILE_PX, TILE_PX, (x, w, h) => { const d = derau(w, 4, 3); lukisDerau(x, w, d, v => [campur(96, 140, v), campur(170, 200, v), campur(60, 84, v)]);
  for (let k = 0; k < 40; k++){ const u = rngT()*w, v = rngT()*h; x.strokeStyle = rngT() < 0.5 ? '#5f9a34' : '#b8e070'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(u, v); x.lineTo(u + (rngT()-.5)*3, v - 4 - rngT()*5); x.stroke(); } }));

// ═════ GEOMETRI LEMBUT ("soft low-poly" ala diorama mainan): tidak ada sudut tajam ═════
// kotak = RoundedBoxGeometry (sudut & tepi membulat, normal halus); silinder = lathe dengan tepi atas/bawah membulat;
// bola = sphere low-poly berbayang halus. Grup material kotak tetap (6 sisi) sehingga kotakTex multi-material berjalan.
function geoKotak(w, h, d, rMaks = 0.14){ const r = Math.min(rMaks, Math.min(w, h, d)*0.24); return r < 0.012 ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 2, r); }
function geoSilinder(rt, rb, h, seg = 10){
  const r = Math.min(0.12, h*0.22, Math.max(rt, rb)*0.35), p = [new THREE.Vector2(0, -h/2)];
  for (let k = 0; k <= 3; k++){ const a = -Math.PI/2 + k/3*Math.PI/2; p.push(new THREE.Vector2(Math.max(0.001, rb - r + Math.cos(a)*r), -h/2 + r + Math.sin(a)*r)); }
  for (let k = 0; k <= 3; k++){ const a = k/3*Math.PI/2; p.push(new THREE.Vector2(Math.max(0.001, rt - r + Math.cos(a)*r), h/2 - r + Math.sin(a)*r)); }
  p.push(new THREE.Vector2(0, h/2));
  return new THREE.LatheGeometry(p, Math.max(10, seg));
}
function geoBola(r, w = 12, h = 9){ return new THREE.SphereGeometry(r, w, h); }
function geoGumpal(r, acakan = 0.12, w = 10, h = 8){ // gumpalan bulat sedikit tak beraturan (batu, kanopi pohon, semak): tetap halus
  const g = new THREE.SphereGeometry(r, w, h), p = g.attributes.position, s = (r*137.1) % 1;
  for (let i = 0; i < p.count; i++){ const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 1 + Math.sin(x*3.1/r + s*9)*Math.cos(z*2.7/r + s*5)*acakan; p.setXYZ(i, x*k, y*k, z*k); }
  g.computeVertexNormals(); return g;
}

const MAT_VC_STATIS = ps1(new THREE.MeshLambertMaterial({color: 0xffffff, vertexColors: true}));
