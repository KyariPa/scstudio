// atap pelana (prisma segitiga sepanjang sumbu X): lebar w (X), tinggi h, dalam d (Z); tekstur genteng di dua sisi miring
function atap(w, h, d, t, x, y, z, parent = scene, warnaUjung = 0xefe3c8){
  const g = new THREE.BufferGeometry();
  const hw = w/2, hd = d/2, pos = [], uv = [], idx = [];
  const v = (px_, py, pz, u, vv) => { pos.push(px_, py, pz); uv.push(u, vv); return pos.length/3 - 1; };
  const s = Math.hypot(h, hd), ru = w/2, rv = s/2;
  let a = v(-hw, 0, hd, 0, 0), b = v(hw, 0, hd, ru, 0), c = v(hw, h, 0, ru, rv), e = v(-hw, h, 0, 0, rv); idx.push(a, b, c, a, c, e);
  a = v(hw, 0, -hd, 0, 0); b = v(-hw, 0, -hd, ru, 0); c = v(-hw, h, 0, ru, rv); e = v(hw, h, 0, 0, rv); idx.push(a, b, c, a, c, e);
  const nSisi = idx.length;
  a = v(hw, 0, hd, 0, 0); b = v(hw, 0, -hd, 1, 0); c = v(hw, h, 0, 0.5, 1); idx.push(a, b, c);
  a = v(-hw, 0, -hd, 0, 0); b = v(-hw, 0, hd, 1, 0); c = v(-hw, h, 0, 0.5, 1); idx.push(a, b, c);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  g.addGroup(0, nSisi, 0); g.addGroup(nSisi, idx.length - nSisi, 1); g.computeVertexNormals();
  const m = new THREE.Mesh(g, [matTex(t), typeof warnaUjung === 'number' ? mat(warnaUjung) : warnaUjung]); m.position.set(x, y, z); parent.add(m); bayangKan(m);
  // bubungan & lis atap membulat (silinder lembut sepanjang X), warna sedikit lebih gelap dari genteng
  const mL = matTex(t, 0xd8c8c0), rb = Math.min(0.22, h*0.12);
  const bub = silinder(rb, rb, w + 0.1, mL, x, y + h, z, 10, parent); bub.rotation.z = Math.PI/2;
  for (const sz of [-1, 1]){ const lis = silinder(rb*0.8, rb*0.8, w + 0.05, mL, x, y + rb*0.3, z + sz*hd, 10, parent); lis.rotation.z = Math.PI/2; }
  return m;
}

const isiKotak = (r, v) => { for (let j = r.y; j < r.y + r.h; j++) for (let i = r.x; i < r.x + r.w; i++) st(i, j, v); };
for (let j = -PINGGIR; j < D + PINGGIR; j++) for (let i = -PINGGIR; i < W + PINGGIR; i++) st(i, j, (i < 0 || j < 0 || i >= W || j >= D) ? T_HUTAN : T_RUMPUT);   // asri: halaman berumput

for (const r of [{x: 0, y: 8, w: 11, h: 4}, {x: 32, y: 1, w: 8, h: 10}, {x: 0, y: 24, w: 1, h: 2}]) isiKotak(r, T_RUMPUT);   // petak rumput liar
function jalanTile(i0, j0, i1, j1, lebar = 2){
  const n = Math.max(Math.abs(i1 - i0), Math.abs(j1 - j0));
  for (let k = 0; k <= n; k++){ const i = Math.round(i0 + (i1 - i0)*k/n), j = Math.round(j0 + (j1 - j0)*k/n);
    for (let a = 0; a < lebar; a++) for (let b = 0; b < lebar; b++) if ([T_RUMPUT, T_HUTAN, T_TANAH].includes(pt(i + a, j + b))) st(i + a, j + b, T_JALAN); }
}

  for (const m of ekor.matchAll(/(?<!\b(?:saya|aku|sudah|kami)\s+)\b(?:bilang|ketik)(?:kan)?\s+(?:\*\*)?["“']([^"”'\n]{1,30})["”']/gi)) tambahBaru(m[1].trim());

// ═════ STATIC BATCHING: gabung mesh dunia yg diam jadi sedikit draw call ═════
// Mesh dianggap diam kalau transform & geometrinya tak berubah saat semua HIDUP dijalankan di beberapa waktu berbeda.
// Yang ditandai userData.dinamis (properti stasiun yg dianimasikan pose(), partikel, dll.) tak pernah digabung.
function gabungStatis(){
  // versi kebun: (1) mesh multi-material (kotakTex: tekstur per sisi) dipecah per grup material lalu ikut digabung,
  // (2) semua material Lambert polos (MAT_POLOS, dari mat(c) tanpa opsi) jadi SATU mesh berwarna verteks per kombinasi bayangan,

  scene.updateMatrixWorld(true);

    for (let p = m; p; p = p.parent){ if (!p.visible || p.userData.dinamis) return; }
    calon.push({m, w: m.matrixWorld.clone(), v: m.geometry.attributes.position.version});
  });

  scene.updateMatrixWorld(true);
  const diam = calon.filter(c => c.w.equals(c.m.matrixWorld) && c.v === c.m.geometry.attributes.position.version && c.m.visible);
  const bersih = (g0) => { const g = g0.index ? g0.toNonIndexed() : g0.clone();
    for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);

  let sebelum = 0;
  for (const {m} of diam){
    sebelum++;
    const bay = (m.castShadow ? 'c' : '') + (m.receiveShadow ? 'r' : '');
    // multi-material: sesudah toNonIndexed urutan verteks = urutan indeks, jadi rentang grup (start/count) = rentang verteks
    const potong = Array.isArray(m.material) ? (() => { const b = bersih(m.geometry), grs = m.geometry.groups.length ? m.geometry.groups : [{start: 0, count: b.attributes.position.count, materialIndex: 0}];
        return grs.map(gr => { const g = new THREE.BufferGeometry(); for (const k of ['position', 'normal', 'uv']){ const a = b.attributes[k]; g.setAttribute(k, new THREE.BufferAttribute(a.array.slice(gr.start*a.itemSize, (gr.start + gr.count)*a.itemSize), a.itemSize)); }
          return {g, mat: m.material[gr.materialIndex]}; }); })()

      else tambah(mt.uuid + bay, {g, mat: mt, c: m.castShadow, r: m.receiveShadow}); }
  }

}

  tomat: svgUI(`<circle cx="12" cy="13.5" r="7.5" fill="#e0402e" ${GRS}/><path d="M8.5 7.5l3.5 1.5 3.5-1.5-1 2.5 2 .5-4.5 1-4.5-1 2-.5z" fill="#4faa48" ${GRS}/><ellipse cx="9" cy="12" rx="1.6" ry="2.2" fill="#fff" opacity=".55"/>`),
  tanya: svgUI(`<path d="M4 3.5h16a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-6l-2 3.5-2-3.5H4A1.5 1.5 0 0 1 2.5 15V5A1.5 1.5 0 0 1 4 3.5z" fill="#fff" ${GRS}/><path d="M9.5 8a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4" fill="none" stroke="#3f74c8" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14.3" r="1.1" fill="#3f74c8"/>`),
  pohon: svgUI(`<rect x="10.5" y="14" width="3" height="7" rx="1" fill="#a8743a" ${GRS}/><circle cx="12" cy="9.5" r="6.5" fill="#5aaa44" ${GRS}/><circle cx="8.5" cy="8" r="1.2" fill="#f59ac0"/><circle cx="14.5" cy="7" r="1.2" fill="#f59ac0"/><circle cx="13" cy="12" r="1.2" fill="#f59ac0"/>`),
  seru: svgUI(`<path d="M4 3.5h16a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-6l-2 3.5-2-3.5H4A1.5 1.5 0 0 1 2.5 15V5A1.5 1.5 0 0 1 4 3.5z" fill="#fff" ${GRS}/><path d="M12 6.5v5" stroke="#d8403a" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="14.3" r="1.3" fill="#d8403a"/>`),
  cangkul: svgUI(`<path d="M6 19L16.5 8.5" stroke="#a8743a" stroke-width="2.6" stroke-linecap="round"/><path d="M6 19L16.5 8.5" fill="none" ${GRS} stroke-width=".8"/><path d="M14 5.5l5.5 5.5 1.5-4-3-3z" fill="#b8c4d0" ${GRS}/>`),
};
// sarung tangan putih: menunjuk ke kanan (penanda pilihan) dan menunjuk ke atas (kursor)
const SARUNG = `<rect x="1" y="7" width="6" height="11" rx="1.5" fill="#dfe6f0" ${GRS}/><rect x="6" y="5" width="12" height="14" rx="5" fill="#fff" ${GRS}/><rect x="13" y="5.5" width="17" height="6" rx="3" fill="#fff" ${GRS}/><rect x="14.5" y="11.3" width="7.5" height="4" rx="2" fill="#fff" ${GRS}/><rect x="14.5" y="15.1" width="6.5" height="4" rx="2" fill="#fff" ${GRS}/><rect x="8" y="1.5" width="7" height="5.5" rx="2.7" fill="#fff" ${GRS}/>`;
const SARUNG_KANAN = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 32 24">${SARUNG}</svg>`;
const SARUNG_ATAS = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="32" viewBox="0 0 26 32"><rect x="7" y="1" width="6" height="16" rx="3" fill="#fff" ${GRS}/><rect x="12.6" y="9" width="5" height="9" rx="2.5" fill="#fff" ${GRS}/><rect x="17" y="10.5" width="4.8" height="8" rx="2.4" fill="#fff" ${GRS}/><rect x="6" y="13.5" width="18" height="11" rx="5" fill="#fff" ${GRS}/><rect x="1.5" y="15" width="7" height="5" rx="2.5" fill="#fff" ${GRS}/><rect x="8" y="23.5" width="14" height="7" rx="1.8" fill="#dfe6f0" ${GRS}/></svg>`;
const uriSvg = s => `url("data:image/svg+xml,${encodeURIComponent(s.includes('xmlns') ? s : s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '))}")`;
// ikon hotbar per tombol bar bawah (lewat ::before, jadi textContent tombol yang diubah kode lain tidak menghapusnya)
const HOTBAR = {bMaster: 'surat', bReset: 'rumah', bLabel: 'gelembung', bDemo: 'benih', bWaktu: 'jam', bMusim: 'bunga', bSuara: 'lonceng', bHemat: 'palet', bRimbun: 'pohon'};
(() => {
  let css = `:root{--kursor:${uriSvg(SARUNG_ATAS)} 9 1, auto;--sarung:${uriSvg(SARUNG_KANAN)}}\n`;
  for (const [id, ik] of Object.entries(HOTBAR)) css += `#kontrol #${id}::before{background-image:${uriSvg(IKON_UI[ik])}}\n`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();
// ── HUD (pojok kanan atas): kotak langit + ikon musim, "Semi 15 Kam" / "PM 12:30", baris kedua jumlah agen bekerja ──
const MUSIM_PENDEK = {semi: 'Semi', panas: 'Panas', gugur: 'Gugur', dingin: 'Dingin'};
function tulisHUD(hh, mm){
  const h = $('hud'); if (!h) return; const d = new Date(), h12 = hh % 12 || 12, ag = semuaAgen();
  const kerja = ag.filter(a => a.status === 'jalan').length, tunggu = ag.filter(a => a.status === 'menunggu').length;
  h.innerHTML = `<span class="hbaris"><span class="hlangit">${IKON_MUSIM[SUASANA.musim]}</span><span class="isi"><b>${MUSIM_PENDEK[SUASANA.musim]}<span class="tgl">${d.getDate()} ${NAMA_HARI[d.getDay()].slice(0, 3)}</span></b><i>${hh < 12 ? 'AM' : 'PM'} ${String(h12).padStart(2, ' ')}:${String(mm).padStart(2, '0')}</i></span></span>`
    + `<span class="hbaris h2"><span class="hkoin">${IKON_UI.cangkul}</span><span class="hjml">${kerja} kerja${tunggu ? ` · ${tunggu} tunggu` : ''}</span></span>`;
}
// ── notifikasi kartu (atas tengah): agen mulai kerja, selesai, menunggu jawaban; surat baru dari Master ──
const NOTIF = {lama: new Map(), siap: false};
function notif(ikon, judul, teks){
  let w = $('notifW'); if (!w){ w = document.createElement('div'); w.id = 'notifW'; document.body.appendChild(w); }
  const k = document.createElement('div'); k.className = 'notif';
  k.innerHTML = `<span class="nik">${IKON_UI[ikon] || ''}</span><span class="nisi"><b>${esc(judul)}</b><span>${esc(teks)}</span></span>`;
  w.appendChild(k); while (w.children.length > 3) w.firstChild.remove();
  setTimeout(() => k.classList.add('pergi'), 4200); setTimeout(() => k.remove(), 4700);
}
const potong = (t, n = 34) => { t = String(t || '').replace(/^\[[^\]]*\]\s*/, ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
function cekNotif(){
  const kini = new Map(semuaAgen().map(a => [a.id, a]));
  if (NOTIF.siap) for (const [id, a] of kini){
    const s0 = NOTIF.lama.get(id); if (s0 === a.status) continue;
    if (s0 === undefined && a.status === 'jalan') notif('benih', potong(a.deskripsi), 'mulai bekerja di kebun');
    else if (a.status === 'selesai' && s0 && s0 !== 'selesai') notif('tomat', potong(a.deskripsi), 'selesai! hasil dikirim');
    else if (a.status === 'menunggu' && s0 && s0 !== 'menunggu') notif('tanya', potong(a.deskripsi), 'menunggu jawabanmu');
  }
  NOTIF.lama = new Map([...kini].map(([id, a]) => [id, a.status])); NOTIF.siap = true;
}
setInterval(() => { cekNotif(); const j = SUASANA.jam, hh = Math.floor(j); tulisHUD(hh, Math.floor((j - hh)*60)); }, 1500);
new MutationObserver(() => { if ($('bMaster').classList.contains('baru')) notif('surat', 'Surat baru', 'balasan dari Chat Master'); }).observe($('bMaster'), {attributes: true, attributeFilter: ['class']});
// ── papan nama lokasi (papan kayu, atas tengah): muncul saat kamera pindah ke area lain, lalu memudar ──
const NAMA_AREA = {Ladang: 'Ladang', Sapi: 'Padang Sapi', Kuda: 'Kandang Kuda', Ayam: 'Kandang Ayam', Kolam: 'Tepi Sungai', Rumah: 'Rumah', Kotak: 'Kotak Kirim', Kayu: 'Tempat Kayu', Quest: 'Papan Quest', Kedai: 'Kolam Ikan'};
const PAPAN = {nama: null, t: 0};
function cekPapan(){
  let terbaik = 'Kebun', jb = Infinity;
  for (const [k, nm] of Object.entries(NAMA_AREA)){ const p = AREA[k]; if (!p) continue; const d = Math.hypot(p.x - kam.target.x, p.z - kam.target.z) - (RADIUS[k] || 4); if (d < 2 && d < jb){ jb = d; terbaik = nm; } }
  if (terbaik === PAPAN.nama) return; PAPAN.nama = terbaik;
  let p = $('papanLokasi'); if (!p){ p = document.createElement('div'); p.id = 'papanLokasi'; document.body.appendChild(p); }
  p.textContent = terbaik; p.classList.remove('pergi'); void p.offsetWidth; p.classList.add('muncul');
  clearTimeout(PAPAN.t); PAPAN.t = setTimeout(() => p.classList.add('pergi'), 2600);
}
setInterval(cekPapan, 400);
// ── label anti-tumpuk: tiap 150 ms label agen diurutkan prioritas (dipilih, Lead, kerja, menunggu, lainnya; lalu yang lebih dekat kamera),
// label yang menimpa label lebih penting diberi kelas 'sesak' (transparan, tetap di tata letak supaya ukurannya bisa diukur) ──
const PRIO_ST = {jalan: 3, menunggu: 2, diam: 1, selesai: 0};
function rapikanLabel(){
  const daftar = [];
  for (const o of AGEN.values()){ if (!o.div || !o.data || o.div.classList.contains('sembunyiLbl') || !o.div.isConnected) continue;
    const nm = o.div.querySelector('.isi'); if (!nm) continue; const r = nm.getBoundingClientRect(); if (!r.width) continue;
    const p = o.id === pilihId ? 100 : (o.data.peran === 'Lead' ? 10 : 0) + (PRIO_ST[o.data.status] || 0);
    daftar.push({o, r, p, d: camera.position.distanceToSquared(o.s.g.position)}); }
  daftar.sort((a, b) => b.p - a.p || a.d - b.d);
  const pakai = [], ker = KERUMUNAN.lbl && KERUMUNAN.lbl.element;   // penanda "+N santai" ikut dihitung sebagai label yang sudah terpasang
  if (ker && ker.style.display !== 'none'){ const r = ker.getBoundingClientRect(); if (r.width) pakai.push(r); }
  for (const it of daftar){ const r = it.r, m = 2;
    const tabrak = it.p < 100 && pakai.some(q => r.left < q.right + m && r.right > q.left - m && r.top < q.bottom + m && r.bottom > q.top - m);
    it.o.div.classList.toggle('sesak', tabrak); if (!tabrak) pakai.push(r); }
}
setInterval(rapikanLabel, 150);
UI_SIAP = true; tulisTombolWaktu();
</script>
