// saran pesan berikutnya (gratis, tanpa model): aturan sederhana dari jawaban terakhir sesi tujuan.
// Klik saran = mengisi kotak ketik (tidak langsung terkirim).
// konteks saran = pesan TERBARU tentang sesi tujuan: jawaban terakhir di riwayat sesi itu ATAU ringkasan Master
// "[dari X] ..." / pesan masuk dari X di panel Chat Master, mana yg lebih baru. Hanya paragraf penutup yg dibaca.
function konteksSaran(r){
  const nama = (MCHAT.tujuan || '').toLowerCase(), it = r.item || [];
  const c = [...it].reverse().find(x => x.j === 'claude');
  const m = [...MCHAT.ev].reverse().find(e => (e.j === 'master' && e.teks.toLowerCase().startsWith('[dari ' + nama + ']'))
    || (e.j === 'masuk' && (e.dari || '').toLowerCase() === nama));
  const pilih = !c ? m : !m ? c : ((m.w || 0) > (c.w || 0) ? m : c);
  return pilih ? {teks: pilih.teks, w: pilih.w || 0} : null;
}
function ekorSaran(t){
  // paragraf penutup tanpa tautan / URL / kode; maksimal 3 baris terakhir yg berisi teks
  t = t.replace(/\[[^\]]*\]\([^)]*\)/g, '').replace(/https?:\/\/\S+/g, '').replace(/```[\s\S]*?```/g, '').replace(/`[^`\n]*`/g, '');
  const baris = t.split('\n').map(b => b.trim()).filter(Boolean);
  return baris.slice(-3).join('\n').slice(-450);
}
function saranDari(r){
  if (!r || !r.item) return [];
  const it = r.item, akhir = it[it.length - 1];
  const out = [], tambah = (...xs) => { for (const x of xs) if (x && !out.includes(x) && out.length < 4) out.push(x); };
  // sesi masih bekerja (atau pesan terakhir dari user / alat): saran status saja
  if (r.status === 'sibuk' || (akhir && akhir.j !== 'claude')){ tambah('status sekarang?', 'ringkas yang sudah selesai'); return out; }
  const k = konteksSaran(r); if (!k){ tambah('lanjut'); return out; }
  const ekor = ekorSaran(k.teks), el = ekor.toLowerCase();
  // yg sudah user kirim ke sesi ini SESUDAH konteks itu -> jangan disarankan lagi
  const sudah = new Set([...it.filter(x => x.j === 'user' && (x.w || 0) > k.w).map(x => x.teks),
    ...MCHAT.ev.filter(e => e.j === 'kamu' && e.ke === MCHAT.tujuan && (e.w || 0) > k.w).map(e => e.teks)].map(x => x.trim().toLowerCase()));
  const tambahBaru = (...xs) => tambah(...xs.filter(x => !sudah.has(x.toLowerCase())));
  const tanya = /\?/.test(ekor), ajak = tanya || /\b(bilang|kabari|kalau (mau|setuju|perlu)|mau (aku|saya|kulanjut)|setuju|pilih(lah)?\s+(opsi|[a-d]\b)|boleh(kah)? (aku|saya))/i.test(ekor);
  // 1) kata yg dikutip dalam ajakan: bilang "restart" / ketik **commit** -> persis itu
  for (const m of ekor.matchAll(/(?<!\b(?:saya|aku|sudah|kami)\s+)\b(?:bilang|ketik)(?:kan)?\s+(?:\*\*)?["“']([^"”'\n]{1,30})["”']/gi)) tambahBaru(m[1].trim());
  if (ajak){
    // 2) pilihan A-D hanya kalau ada pertanyaan / ajakan memilih
    const opsi = [...new Set([...k.teks.matchAll(/(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?(?:opsi\s+)?\(?([A-D])[.)](?:\*\*)?\s/gi)].map(m => m[1].toUpperCase()))];
    if (opsi.length >= 2) tambahBaru(...opsi.slice(0, 3).map(o => 'pilih ' + o));
    // 3) aksi yg disebut di ajakan penutup
    if (/\brestart\b/.test(el)) tambahBaru('restart');
    if (/\bcommit\b/.test(el)) tambahBaru('commit');
    if (/\bpush\b/.test(el)) tambahBaru('push');
    if (/\bupload\b/.test(el)) tambahBaru('upload');
    if (/\b(pr|pull request)\b/.test(el)) tambahBaru('bikin PR');
    if (opsi.length < 2) tambahBaru('ya, gas', 'jangan dulu');  // ada pilihan A-D: ya/tidak tak relevan
  } else if (/\b(error|galat|gagal|tidak bisa|belum bisa)\b/.test(el)){
    tambahBaru('coba perbaiki', 'apa penyebabnya?');
  } else {
    // laporan selesai tanpa pertanyaan
    tambahBaru('tes hasilnya', 'lanjut', 'ringkas hasil terakhir');
  }
  return out;
}
// Saran AI (Haiku, lewat POST /api/master/saran): dipanggil HANYA saat konteks berubah (sesi dipilih / balasan baru),
// tidak polling; hasil di-cache per konteks. Selama menunggu / kalau gagal / kalau dimatikan -> saran aturan di atas.
// Saklar "AI" di baris saran, diingat di localStorage.desaSaranAI.
MCHAT.saranAI = new Map(); MCHAT.saranMinta = ''; MCHAT.saranGagal = new Set();
try { MCHAT.aiNyala = localStorage.getItem('desaSaranAI') !== '0'; } catch (e) { MCHAT.aiNyala = true; }
function kunciSaran(){
  // konteks: ada tujuan -> jam pesan terakhir di riwayat sesi itu; tanpa tujuan -> jam balasan Master terakhir.
  // (jangan ikut semua event panel: Master yg sibuk meneruskan pesan lain akan terus mengubah kunci)
  if (MCHAT.tujuan){ const r = MCHAT.riw && MCHAT.riw.nama === MCHAT.tujuan ? MCHAT.riw : null;
    return MCHAT.tujuan + '|' + (r && r.item.length ? (r.item[r.item.length - 1].w || 0) : 0); }
  return '|' + Math.max(0, ...MCHAT.ev.filter(e => e.j === 'master' || e.j === 'masuk').map(e => e.w || 0));
}
function siapSaranAI(){
  // jangan minta saran selagi lawan bicara masih bekerja (konteks belum final)
  if (MCHAT.tujuan){ const r = MCHAT.riw; if (!r || r.nama !== MCHAT.tujuan || r.status === 'sibuk') return false;
    const a = r.item[r.item.length - 1]; return !a || a.j === 'claude'; }
  return MCHAT.status !== 'sibuk' && MCHAT.ev.some(e => e.j === 'master');
}
async function mintaSaranAI(kunci){
  MCHAT.saranMinta = kunci; gambarSaranUI();  // satu permintaan sekaligus (lihat gambarSaran)
  try { const r = await postToken('/api/master/saran', {headers:{'Content-Type':'application/json'}, body:JSON.stringify({nama: MCHAT.tujuan || ''})});
    const j = await r.json().catch(() => ({}));
    if (r.ok && Array.isArray(j.saran) && j.saran.length){ MCHAT.saranAI.set(kunci, {xs: j.saran, biaya: j.biaya || 0, total: j.total, jumlah: j.jumlah, cache: !!j.cache, tujuan: kunci.split('|')[0]}); if (MCHAT.saranAI.size > 40) MCHAT.saranAI.delete(MCHAT.saranAI.keys().next().value); }
    else if (j.mati){ MCHAT.aiMatiServer = true; }
    else MCHAT.saranGagal.add(kunci);  // gagal / server sibuk: jangan diulang utk konteks yg sama
  } catch (e) { MCHAT.saranGagal.add(kunci); }
  if (MCHAT.saranMinta === kunci) MCHAT.saranMinta = '';
  gambarSaran();  // konteks bisa sudah berubah selama menunggu -> minta lagi kalau perlu (tetap satu per satu)
}
function gambarSaran(){
  const kunci = kunciSaran();
  if (MCHAT.aiNyala && !MCHAT.aiMatiServer && !MCHAT.saranAI.has(kunci) && !MCHAT.saranGagal.has(kunci) && !MCHAT.saranMinta && siapSaranAI()) mintaSaranAI(kunci);
  gambarSaranUI();
}
function gambarSaranUI(){
  const el = $('mSaran'), kunci = kunciSaran(), aiOn = MCHAT.aiNyala && !MCHAT.aiMatiServer;
  // hasil persis utk konteks ini; kalau belum ada, hasil AI terakhir utk tujuan yg sama (sambil menunggu yg baru)
  const ai = !aiOn ? null : MCHAT.saranAI.get(kunci) || [...MCHAT.saranAI.values()].reverse().find(v => v.tujuan === (MCHAT.tujuan || '')) || null;
  const aturan = MCHAT.tujuan && MCHAT.riw && MCHAT.riw.nama === MCHAT.tujuan ? saranDari(MCHAT.riw) : [];
  const xs = ai ? ai.xs : aturan, memuat = MCHAT.aiNyala && MCHAT.saranMinta === kunci;
  const ada = xs.length > 0 || memuat || (MCHAT.aiNyala && MCHAT.buka && (MCHAT.tujuan || MCHAT.ev.length));
  el.classList.toggle('ada', !!ada);
  const label = ai ? 'Saran AI:' : memuat ? 'Saran (AI memuat...):' : 'Saran:';
  const tAI = MCHAT.aiMatiServer ? 'Saran AI dimatikan di server (SARAN_MODEL = False)'
    : MCHAT.aiNyala ? `Saran AI nyala (Haiku). Klik untuk mematikan.${ai ? ` Saran ini: ${ai.cache ? 'dari cache, 0' : '$' + ai.biaya.toFixed(5)}; sejak server menyala: ${ai.jumlah ?? '-'} saran, $${(ai.total ?? 0).toFixed(4)}` : ''}`
    : 'Saran AI mati: pakai aturan sederhana (gratis). Klik untuk menyalakan.';
  el.innerHTML = `<button type="button" class="msr-ai${MCHAT.aiNyala && !MCHAT.aiMatiServer ? ' on' : ''}" title="${esc(tAI)}">AI</button><span class="lbl2">${label.replace(/:$/, '')}</span>`
    + xs.map(x => `<button type="button" class="msr" title="Isi kotak ketik">${esc(x)}</button>`).join('');
}

// jendela Chat Master: buka/tutup (tombol Master, X), seret lewat judul, ubah ukuran (CSS resize); posisi diingat per browser
const SIMPAN_M = 'desaMaster', panelM = $('master');
let geoM = null;  // posisi/ukuran terakhir saat TERBUKA (panel tertutup = display:none, ukurannya 0)
const simpanPanelM = () => { try {
  // offset* = ukuran tanpa transform (animasi muncul memakai scale, getBoundingClientRect ikut mengecil)
  if (MCHAT.buka && panelM.style.left && panelM.offsetWidth > 0 && innerWidth >= 200) geoM = {x: panelM.offsetLeft, y: panelM.offsetTop, w: panelM.offsetWidth, h: panelM.offsetHeight};
  localStorage.setItem(SIMPAN_M, JSON.stringify({buka: MCHAT.buka, ...(geoM || {})})); } catch (e) {} };
function jepitPanelM(){  // jaga jendela tetap di dalam layar (judul selalu bisa diraih)
  if (!MCHAT.buka || !panelM.style.left || innerWidth < 200) return;  // panel tertutup / viewport belum siap: tak terukur
  panelM.style.left = Math.max(4, Math.min(innerWidth - 80, panelM.offsetLeft)) + 'px'; panelM.style.top = Math.max(4, Math.min(innerHeight - 40, panelM.offsetTop)) + 'px';
}

// lemparan antar karakter (ganti kurir surat): Master -> sesi = TOMBAK, sesi -> Master = ANAK PANAH.
// Pelempar menghadap sasaran + ancang-ancang, proyektil terbang parabola & menghadap arah gerak, menancap miring di tanah
// DEKAT KAKI sasaran (tidak mengenai badan), sasaran melompat kaget, proyektil memudar. Antre: maks 2 aktif, antre <= 6.
// Mesh lemparan ditandai userData.dinamis (jebakan 11); tak ada lampu baru (jebakan 13).

function buatProyektil(jenis){

  const g = new THREE.Group();
  kotak(0.38, 0.54, 0.03, 0xfaf4e0, 0, 0, 0, g); kotak(0.11, 0.11, 0.036, jenis === 'tombak' ? 0xc02828 : 0x2a6ab0, 0, -0.04, 0, g); kotak(0.36, 0.02, 0.036, 0xd8c8a0, 0, 0.14, 0, g);

function buatBusur(){
  const g = new THREE.Group(), b = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 5, 14, Math.PI), matKayuT);

function lempar(jenis, dari, ke){

  if (!ke) return;
  if (LEMPAR.length >= LEMPAR_MAKS){ if (ANTRE_LEMPAR.length < 6) ANTRE_LEMPAR.push([jenis, dari, ke]); return; }
  const L = {jenis, dari, ke, t: 0, fase: 'ancang', pegang: null, proy: null};
  if (dari && !dari.jalur.length){
    dari.aksi = {jenis, t: 0};
    L.pegang = buatProyektil(jenis); L.pegang.position.set(-0.3, 0.1, 0); L.pegang.rotation.x = -0.4;
    dari.s.tanganK.add(L.pegang);

}
function asalLempar(L){ return L.dari ? L.dari.s.g.position.clone().add(V(0, 2.6, 0)) : V(AREA.Aula.x, 4, AREA.Aula.z); }
HIDUP.push((t, dt) => {
  for (let i = LEMPAR.length - 1; i >= 0; i--){
    const L = LEMPAR[i]; L.t += dt;
    const keAda = AGEN.has(L.ke.id) && L.ke.data, dariAda = L.dari && AGEN.has(L.dari.id);
    if (L.fase === 'ancang'){
      // menghadap sasaran, tali busur ditarik
      if (dariAda && keAda){ const d = L.ke.s.g.position.clone().sub(L.dari.s.g.position); L.dari.yawPaksa = Math.atan2(d.x, d.z); }
      if (L.pegang && L.pegang.userData.tali) L.pegang.userData.tali.position.z = -Math.min(1, L.t / 0.55) * 0.32;
      if (L.t >= 0.6 || !dariAda){
        if (L.pegang){ L.pegang.removeFromParent(); L.pegang = null; }
        if (!keAda){ L.fase = 'selesai'; }
        else {
          L.fase = 'terbang'; L.t = 0; L.a = asalLempar(L);
          const kp = L.ke.s.g.position, arah = L.a.clone().setY(0).sub(V(kp.x, 0, kp.z)); if (arah.lengthSq() < 1e-4) arah.set(1, 0, 0);
          arah.normalize();

          const jarak = L.a.distanceTo(L.b); L.lama = Math.min(2.2, Math.max(0.7, jarak / 16)); L.tinggi = 2 + jarak * 0.22;
          L.proy = buatProyektil(L.jenis); L.proy.position.copy(L.a); scene.add(L.proy);
          if (L.dari) L.dari.aksi = {jenis: L.jenis, t: 0.6, lepas: true};
        }
      }
    } else if (L.fase === 'terbang'){
      const u = Math.min(1, L.t / L.lama), posU = x => L.a.clone().lerp(L.b, x).add(V(0, Math.sin(x * Math.PI) * L.tinggi * (1 - x * 0.15), 0));
      const p = posU(u), dpn = posU(Math.min(1, u + 0.02)).sub(p);
      L.proy.position.copy(p);

      if (u >= 1){

        if (keAda) L.ke.reaksiT = 0.7;
      }
    } else if (L.fase === 'menancap'){
      if (L.t > 2.6){ const k = Math.max(0, 1 - (L.t - 2.6) / 0.6); L.proy.scale.setScalar(Math.max(0.01, k)); if (k <= 0) L.fase = 'selesai'; }
    }
    if (L.fase === 'selesai'){
      if (L.pegang) L.pegang.removeFromParent();
      if (L.proy){ scene.remove(L.proy); L.proy.traverse(x => x.geometry && x.geometry.dispose()); }
      if (L.dari){ L.dari.yawPaksa = null; L.dari.aksi = null; }

});
// pose tambahan dipanggil di akhir pose(): ancang-ancang / lepas, dan kaget saat lemparan menancap di dekatnya
function poseAksi(o, dt){
  const s = o.s;
  if (o.aksi && !o.jalur.length){
    // berdiri dulu (kalau sedang duduk), angkat surat dengan dua tangan, lalu lempar ke depan
    s.pinggul.position.y = 0.95; s.pinggul.rotation.x = 0; s.pinggang.rotation.x = 0;
    for (const k in s.al) s.al[k].visible = false;
    const A = o.aksi; A.t += dt; const k = Math.min(1, A.t / 0.6);
    if (!A.lepas){ const u = halusK(k); s.bahuK.rotation.x = -1.2 - u*1.5; s.bahuKi.rotation.x = -1.2 - u*1.5; s.bahuK.rotation.z = -0.55*u; s.bahuKi.rotation.z = 0.55*u;
      s.sikuK.rotation.x = -0.3; s.sikuKi.rotation.x = -0.3; s.leher.rotation.x = -0.2*u; }
    else { const u = halusK(Math.min(1, (A.t - 0.6) / 0.35)); s.bahuK.rotation.x = -2.7 + u*1.7; s.bahuKi.rotation.x = -2.7 + u*1.7; s.bahuK.rotation.z = -0.55 + u*0.3; s.bahuKi.rotation.z = 0.55 - u*0.3;
      s.sikuK.rotation.x = -0.2; s.sikuKi.rotation.x = -0.2; s.pinggang.rotation.x = 0.3*u; s.leher.rotation.x = 0.1*u; }
  }
  if (o.reaksiT > 0){
    // kaget: lompat kecil + tangan terangkat
    o.reaksiT -= dt; const r = Math.max(0, o.reaksiT) / 0.7, h = Math.sin((1 - r) * Math.PI);

    s.bahuK.rotation.x = -2.6 * h; s.bahuKi.rotation.x = -2.6 * h; s.bahuK.rotation.z = 0.5 * h; s.bahuKi.rotation.z = -0.5 * h;
  }
}

const AGEN = new Map(); // id -> objek dunia

function animDari(a){
  // kantor: semua pegawai duduk di mejanya; tool terakhir menentukan gerak (mengetik / membaca / menelepon / tertidur)
  if (a.status === 'diam') return 'tidurMeja';
  const t = (a.tool_akhir || '').toLowerCase(), ada = (...k) => k.some(x => t.includes(x));

  return 'ketik';
}

function buatAgenDunia(a, posAwal){
  const s = buatKarakter(a.peran, a.id, a.deskripsi);
  s.g.scale.setScalar(SKALA_ORANG);
  s.g.position.copy(posAwal); scene.add(s.g);

  const lbl = new CSS2DObject(div); lbl.position.set(0, 3.3, 0); s.g.add(lbl);

function tulisLabel(o){

// ═════ STATIC BATCHING: gabung mesh dunia yg diam jadi sedikit draw call ═════
// Mesh dianggap diam kalau transform & geometrinya tak berubah saat semua HIDUP dijalankan di beberapa waktu berbeda.
// Yang ditandai userData.dinamis (properti stasiun yg dianimasikan pose(), partikel, dll.) tak pernah digabung.
function gabungStatis(){
  // versi kebun: (1) mesh multi-material (kotakTex: tekstur per sisi) dipecah per grup material lalu ikut digabung,
  // (2) semua material Lambert polos (MAT_POLOS, dari mat(c) tanpa opsi) jadi SATU mesh berwarna verteks per kombinasi bayangan,
  // (3) sisanya digabung per material seperti di desa. Mesh yang digerakkan / berubah warna wajib userData.dinamis.
  scene.updateMatrixWorld(true);
  const calon = [];
  scene.traverse(m => {
    if (!m.isMesh || m.isInstancedMesh) return;
    const ms = Array.isArray(m.material) ? m.material : [m.material]; if (ms.some(x => x.transparent)) return;
    for (let p = m; p; p = p.parent){ if (!p.visible || p.userData.dinamis) return; }
    calon.push({m, w: m.matrixWorld.clone(), v: m.geometry.attributes.position.version});
  });
  for (const t of [0.37, 2.71, 5.93]) for (const f of HIDUP) f(t, 0.016);
  scene.updateMatrixWorld(true);
  const diam = calon.filter(c => c.w.equals(c.m.matrixWorld) && c.v === c.m.geometry.attributes.position.version && c.m.visible);
  const bersih = (g0) => { const g = g0.index ? g0.toNonIndexed() : g0.clone();
    for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);

    g.morphAttributes = {}; g.clearGroups(); return g; };

  let sebelum = 0;
  for (const {m} of diam){
    sebelum++;
    const bay = (m.castShadow ? 'c' : '') + (m.receiveShadow ? 'r' : '');
    // multi-material: sesudah toNonIndexed urutan verteks = urutan indeks, jadi rentang grup (start/count) = rentang verteks
    const potong = Array.isArray(m.material) ? (() => { const b = bersih(m.geometry), grs = m.geometry.groups.length ? m.geometry.groups : [{start: 0, count: b.attributes.position.count, materialIndex: 0}];
        return grs.map(gr => { const g = new THREE.BufferGeometry(); for (const k of ['position', 'normal', 'uv']){ const a = b.attributes[k]; g.setAttribute(k, new THREE.BufferAttribute(a.array.slice(gr.start*a.itemSize, (gr.start + gr.count)*a.itemSize), a.itemSize)); }
          return {g, mat: m.material[gr.materialIndex]}; }); })()

        g.setAttribute('color', new THREE.BufferAttribute(w, 3)); tambah('vc' + bay, {g, mat: MAT_VC_STATIS, vc: true, c: m.castShadow, r: m.receiveShadow}); }
      else tambah(mt.uuid + bay, {g, mat: mt, c: m.castShadow, r: m.receiveShadow}); }
  }
  let sesudah = 0;
  for (const G of grup.values()){
    const gab = G.isi.length > 1 ? mergeGeometries(G.isi.map(x => x.g), false) : G.isi[0].g; if (!gab) continue;
    const M = new THREE.Mesh(gab, G.mat); M.castShadow = G.c; M.receiveShadow = G.r; M.userData.statis = true; scene.add(M); sesudah++;
  }
  for (const {m} of diam){ m.removeFromParent(); }
  console.debug(`kantor: static batching ${sebelum} mesh -> ${sesudah}`);
}

// Semua ikon digambar di sini (garis navy, isi warna rata), tanpa file gambar. CSS-nya di blok "TEMA KANTOR".
var UI_SIAP = false;   // var (bukan let): dibaca tulisTombolWaktu di k_kontrol sebelum blok ini dijalankan
const GRS = 'stroke="#2f3f5f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"';
const svgUI = (isi, vb = '0 0 24 24') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${isi}</svg>`;
const IKON_UI = {
  amplop: svgUI(`<rect x="2.5" y="5.5" width="19" height="13" rx="2.5" fill="#fff" ${GRS}/><path d="M3.5 7l8.5 6.2L20.5 7" fill="none" ${GRS}/><circle cx="18.5" cy="6.5" r="3" fill="#e0503e" stroke="#fff" stroke-width="1.2"/>`),

  balon: svgUI(`<path d="M4.5 4.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-4.5 3.5V16.5h-2.5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" fill="#fff" ${GRS}/><path d="M7 9h10M7 12.2h6.5" ${GRS}/>`),
  layar: svgUI(`<rect x="2.5" y="4" width="19" height="12.5" rx="1.8" fill="#fff" ${GRS}/><path d="M9 20.5h6M12 16.5v4" ${GRS}/><path d="M10 7.8l4.5 2.5-4.5 2.5z" fill="#4fa66b" ${GRS}/>`),
  jam: svgUI(`<circle cx="12" cy="12" r="8.8" fill="#fff" ${GRS}/><path d="M12 7v5.2l3.4 2" fill="none" ${GRS}/><circle cx="12" cy="12" r="1" fill="#2f3f5f"/>`),
  kalender: svgUI(`<rect x="3.5" y="5" width="17" height="15.5" rx="2" fill="#fff" ${GRS}/><path d="M3.5 9.5h17" ${GRS}/><rect x="3.5" y="5" width="17" height="4.5" rx="2" fill="#e0503e" ${GRS}/><path d="M8 3.5v3M16 3.5v3" ${GRS}/><g fill="#2f3f5f"><circle cx="8" cy="13" r="1"/><circle cx="12" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><circle cx="8" cy="16.6" r="1"/><circle cx="12" cy="16.6" r="1"/></g>`),
  speaker: svgUI(`<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#fff" ${GRS}/><path d="M15.5 9a4 4 0 0 1 0 6M17.8 6.8a7.2 7.2 0 0 1 0 10.4" fill="none" ${GRS}/>`),
  monitor: svgUI(`<rect x="2.5" y="4" width="19" height="12.5" rx="1.8" fill="#fff" ${GRS}/><path d="M9 20.5h6M12 16.5v4" ${GRS}/><rect x="5" y="6.5" width="5" height="3" rx=".6" fill="#f7ddd5"/><rect x="11" y="6.5" width="8" height="3" rx=".6" fill="#dfe8f8"/><rect x="5" y="10.5" width="14" height="3.5" rx=".6" fill="#ffe68f"/>`),
  laptop: svgUI(`<rect x="5" y="5" width="14" height="9.5" rx="1.4" fill="#dfe8f8" ${GRS}/><path d="M2.8 18.5h18.4l-2-3.5H4.8z" fill="#fff" ${GRS}/><path d="M8 8.5h6M8 11h4" stroke="#3b7ddd" stroke-width="1.5" stroke-linecap="round"/>`),
  mapCentang: svgUI(`<path d="M3.5 6.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 19 19.5H5a1.5 1.5 0 0 1-1.5-1.5z" fill="#ffe68f" ${GRS}/><path d="M8.5 13.2l2.4 2.4 4.8-4.8" fill="none" stroke="#4fa66b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`),
  tanya: svgUI(`<path d="M4.5 3.5h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6l-2 3.5-2-3.5h-5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="#fff" ${GRS}/><path d="M9.6 7.8a2.4 2.4 0 1 1 3.4 2.2c-.7.3-1 .8-1 1.5v.3" fill="none" stroke="#3b7ddd" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14" r="1.1" fill="#3b7ddd"/>`),
  seru: svgUI(`<circle cx="12" cy="12" r="9" fill="#e0503e" ${GRS}/><path d="M12 7v6" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.4" fill="#fff"/>`),
  tas: svgUI(`<rect x="3" y="7.5" width="18" height="12" rx="2" fill="#c99a5e" ${GRS}/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2" fill="none" ${GRS}/><path d="M3 12.5h18" ${GRS}/><rect x="10.5" y="11" width="3" height="3" rx=".6" fill="#ffe68f" ${GRS}/>`),
};
const uriSvg = s => `url("data:image/svg+xml,${encodeURIComponent(s.includes('xmlns') ? s : s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '))}")`;
// ikon dock per tombol (lewat ::before, jadi textContent tombol yang diubah kode lain tidak menghapusnya) + logo gedung di bilah judul
const HOTBAR = {bMaster: 'amplop', bReset: 'gedung', bLabel: 'balon', bDemo: 'layar', bWaktu: 'jam', bMusim: 'kalender', bSuara: 'speaker', bHemat: 'monitor'};
(() => {
  let css = `:root{--ikon-gedung:${uriSvg(IKON_UI.gedung)}}\n#kontrol #bMaster::before{background-image:${uriSvg(IKON_UI.amplop.replace('fill="#fff"', 'fill="#ffffff"'))}}\n`;
  for (const [id, ik] of Object.entries(HOTBAR)) css += `#kontrol #${id}::before{background-image:${uriSvg(IKON_UI[ik])}}\n`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();
// ── HUD (pojok kanan atas): kalender meja (bulan, tanggal, hari) + jam digital + bagian hari + jumlah pegawai kerja/menunggu ──
const BULAN_PENDEK = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
function tulisHUD(hh, mm){
  const h = $('hud'); if (!h) return; const d = new Date(), ag = semuaAgen();
  const kerja = ag.filter(a => a.status === 'jalan').length, tunggu = ag.filter(a => a.status === 'menunggu').length;
  h.innerHTML = `<span class="hkal"><b>${BULAN_PENDEK[d.getMonth()]}</b><i>${d.getDate()}</i><span>${NAMA_HARI[d.getDay()]}</span></span>`
    + `<span class="hjam"><em>${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}<small>${hh < 12 ? 'AM' : 'PM'}</small></em><span class="hket">${namaJam(SUASANA.jam)} · ${NAMA_MUSIM[SUASANA.musim]}</span>`
    + `<span class="hst"><u>${kerja} kerja</u><u class="t">${tunggu} menunggu</u></span></span>`;
}
// ── notifikasi kartu ala email (kanan atas, di bawah HUD): pegawai mulai kerja, selesai, menunggu jawaban; pesan baru dari CEO ──
const NOTIF = {lama: new Map(), siap: false};
const WARNA_NOTIF = {seru: ['#e0503e', '#fde8e4'], laptop: ['#4fa66b', '#e6f4ea'], mapCentang: ['#e8b520', '#fff6cc'], tanya: ['#3b7ddd', '#e8f0fd'], amplop: ['#e0503e', '#fde8e4']};
function notif(ikon, judul, teks, penting = false){   // penting: tampil lebih lama + bergoyang (pertanyaan yang harus segera dijawab)
  let w = $('notifW'); if (!w){ w = document.createElement('div'); w.id = 'notifW'; document.body.appendChild(w); }
  const k = document.createElement('div'); k.className = 'notif' + (penting ? ' penting' : ''); const [c1, c2] = WARNA_NOTIF[ikon] || WARNA_NOTIF.tanya; k.style.setProperty('--warna', c1); k.style.setProperty('--latar', c2);
  k.innerHTML = `<span class="nik">${IKON_UI[ikon] || ''}</span><span class="nisi"><b>${esc(judul)}</b><span>${esc(teks)}</span></span>`;
  w.appendChild(k); while (w.children.length > 3) w.firstChild.remove();
  const lama = penting ? 9000 : 4200; setTimeout(() => k.classList.add('pergi'), lama); setTimeout(() => k.remove(), lama + 500);
}
const potong = (t, n = 34) => { t = String(t || '').replace(/^\[[^\]]*\]\s*/, ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
function cekNotif(){
  const kini = new Map(semuaAgen().map(a => [a.id, a]));
  if (NOTIF.siap) for (const [id, a] of kini){
    const s0 = NOTIF.lama.get(id); if (s0 === a.status) continue;
    if (s0 === undefined && a.status === 'jalan') notif('laptop', potong(a.deskripsi), 'mulai bekerja di mejanya');
    else if (a.status === 'selesai' && s0 && s0 !== 'selesai') notif('mapCentang', potong(a.deskripsi), 'selesai, laporan diserahkan ke CEO');
    else if (a.status === 'menunggu' && s0 && s0 !== 'menunggu') peranTampil(a) === 'Fork' ? notif('mapCentang', potong(a.deskripsi), `beres, diserahkan ke ${namaInduk(a)}`) : notif('tanya', potong(a.deskripsi), 'menunggu jawabanmu');
  }
  NOTIF.lama = new Map([...kini].map(([id, a]) => [id, a.status])); NOTIF.siap = true;
}
setInterval(() => { cekNotif(); const j = SUASANA.jam, hh = Math.floor(j); tulisHUD(hh, Math.floor((j - hh)*60)); }, 1500);
new MutationObserver(() => { if ($('bMaster').classList.contains('baru')) notif('amplop', 'Pesan baru', 'balasan dari CEO (Chat Master)'); }).observe($('bMaster'), {attributes: true, attributeFilter: ['class']});
// ── papan nama pintu (atas tengah): nama ruang/area tempat titik pusat kamera, muncul saat pindah lalu memudar ──
const PAPAN = {nama: null, t: 0};
function cekPapan(){
  const x = kam.target.x, z = kam.target.z, dalam = r => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1;
  const tg = ZONA.tangga.some(dalam) || ZONA.bordes.some(dalam), q = KANTOR.ruang.find(r => r.jenis !== 'tangga' && dalam(r));
  const terbaik = tg ? 'Tangga' : q ? q.nama : z >= 0 && z <= KOR && x >= 0 && x <= KANTOR.lebar ? 'Koridor Lantai 1' : 'Kantor Agen';
  if (terbaik === PAPAN.nama) return; PAPAN.nama = terbaik;
  let p = $('papanLokasi'); if (!p){ p = document.createElement('div'); p.id = 'papanLokasi'; document.body.appendChild(p); }
  p.textContent = terbaik; p.classList.remove('pergi'); void p.offsetWidth; p.classList.add('muncul');
  clearTimeout(PAPAN.t); PAPAN.t = setTimeout(() => p.classList.add('pergi'), 2600);
}
setInterval(cekPapan, 400);
// ── label anti-tumpuk: tiap 150 ms label pegawai diurutkan prioritas (dipilih, Lead, kerja, menunggu, lainnya; lalu yang lebih dekat kamera),
// label yang menimpa label lebih penting diberi kelas 'sesak' (transparan, tetap di tata letak supaya ukurannya bisa diukur) ──
const PRIO_ST = {jalan: 3, menunggu: 2, diam: 1, selesai: 0};
function rapikanLabel(){
  const daftar = [];
  for (const o of AGEN.values()){ if (!o.div || !o.data || o.div.classList.contains('sembunyiLbl') || !o.div.isConnected) continue;
    const nm = o.div.querySelector('.isi'); if (!nm) continue; const r = nm.getBoundingClientRect(); if (!r.width) continue;
    const p = o.id === pilihId ? 100 : (TANYA.per.has(o.id) ? 50 : 0) + (o.data.peran === 'Lead' ? 10 : 0) + (PRIO_ST[o.data.status] || 0);   // yang bertanya didahulukan
    daftar.push({o, r, p, d: camera.position.distanceToSquared(o.s.g.position)}); }
  daftar.sort((a, b) => b.p - a.p || a.d - b.d);
  const pakai = [], ker = KERUMUNAN.lbl && KERUMUNAN.lbl.element;   // penanda "+N pulang" ikut dihitung sebagai label yang sudah terpasang
  if (ker && ker.style.display !== 'none'){ const r = ker.getBoundingClientRect(); if (r.width) pakai.push(r); }
  for (const it of daftar){ const r = it.r, m = 2;
    const tabrak = it.p < 100 && pakai.some(q => r.left < q.right + m && r.right > q.left - m && r.top < q.bottom + m && r.bottom > q.top - m);
    it.o.div.classList.toggle('sesak', tabrak); if (!tabrak) pakai.push(r); }
}
setInterval(rapikanLabel, 150);
UI_SIAP = true; tulisTombolWaktu();

// ═════ CHAT MASTER KANTOR: panel lebih lebar, kolom kiri = daftar tujuan vertikal (hanya sesi LEAD), kanan = chat ═════
// Elemen asli (#mSesi, #mTab, #mLog, .mkomposer) dipindah ke dua kolom; id & event-nya tetap, jadi logika chat desa tidak berubah.
// Fork tidak muncul di daftar tujuan (disaring lewat field `induk` dari server, lihat gambarSesi), tapi tetap bisa dihubungi lewat
// tombol "Kirim pesan" di panel detail pegawai.
(() => {
  const judul = $('mJudul'), badan = document.createElement('div'), kiri = document.createElement('div'), kanan = document.createElement('div');
  badan.className = 'mbadan'; kiri.className = 'mkiri'; kanan.className = 'mkanan';
  judul.after(badan); badan.append(kiri, kanan); kiri.append($('mSesi'));
  kanan.append($('mTab'), $('mLog'), document.querySelector('#master .mkomposer'));
})();
function tombolKirimKe(a){ // tombol di panel detail: kirim pesan ke sesi ini (juga untuk fork)
  if (!a || a.peran !== 'Lead' || a.status === 'selesai' || a.master) return '';
  return `<button type="button" class="kirimKe" data-nama="${esc(a.deskripsi)}" title="Buka Chat Master dengan tujuan sesi ini">${IK.kilat}Kirim pesan ke sesi ini</button>`;
}
$('detail').addEventListener('click', async e => {
  const b = e.target.closest('.kirimKe'); if (!b) return;
  if (!MCHAT.buka) bukaChat(true);
  if (!MCHAT.sesi.some(s => s.nama === b.dataset.nama)) await ambilSesi();
  if (!MCHAT.sesi.some(s => s.nama === b.dataset.nama)){ notif('tanya', b.dataset.nama, 'sesi ini tidak terdaftar aktif, belum bisa dikirimi pesan'); return; }
  MCHAT.tujuan = b.dataset.nama; MCHAT.lihat = 'riwayat'; MCHAT.riw = null;
  gambarSesi(); gambarChat(true); gambarSaran(); ambilRiwayat(); $('mTeks').focus();
});
</script>
